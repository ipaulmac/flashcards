<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS – Stage 1 Compact</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
--brand-navy:#002147;
--brand-gold:#CFC752;
--custom-purple:#561386;
}

.perspective-1000{perspective:1000px}
.preserve-3d{transform-style:preserve-3d}
.backface-hidden{backface-visibility:hidden}
.rotate-y-180{transform:rotateY(180deg)}
.flip-card-inner{transition:transform .5s cubic-bezier(.4,0,.2,1)}
.flipped{transform:rotateY(180deg)}

body{
background:var(--custom-purple);
font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
overflow-y:auto;
}

.phrase-front{font-size:2.4rem;line-height:1.1;font-weight:700}
.phrase-back{font-size:2.75rem;line-height:1.05;font-weight:800}

.nav-btn{
display:flex;align-items:center;justify-content:center;
width:40px;height:40px;border-radius:50%;
transition:.2s;
}
.nav-btn:active{background:rgba(0,0,0,.1);transform:scale(.9)}

.ui-accent-bg{background:var(--brand-gold)}
.navy-text{color:var(--brand-navy)}

.back-btn{
background:none;border:none;
font-size:.9rem;font-weight:800;
letter-spacing:2px;text-transform:uppercase;
color:#fff;cursor:pointer;
}

@media(max-width:480px){
.phrase-front{font-size:1.4rem}
.phrase-back{font-size:1.7rem}
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="mb-4 text-center">
<h1 class="text-white/80 text-[10px] font-black uppercase tracking-[.3em]">
Accelerated Language Systems
</h1>
</div>

<div class="w-full max-w-sm flex flex-col items-center pb-12">
<div class="w-full perspective-1000">

<div id="flashcard" class="relative w-full h-[360px] preserve-3d flip-card-inner cursor-pointer shadow-2xl rounded-3xl">

<!-- FRONT -->
<div class="absolute inset-0 bg-white backface-hidden rounded-3xl flex flex-col justify-between p-5 border">

<div class="w-full flex justify-between items-center">
<img src="https://static.wixstatic.com/media/c11625_0d25b3fc3bb56ca3c126f014ea762160.png" class="h-6">
<span class="text-[10px] font-black text-[#561386]/50 uppercase tracking-widest">Stage 1</span>
</div>

<div class="flex flex-col items-center justify-center text-center flex-grow">
<p id="front-text" class="phrase-front navy-text"></p>
</div>

<div class="flex flex-col items-center space-y-3">
<div class="text-[#800000] text-[11px] font-black uppercase tracking-[.2em]">
Tap / Click to reveal
</div>

<div class="flex items-center space-x-4 ui-accent-bg px-3 py-1 rounded-full">
<button onclick="prevCard(event)" class="nav-btn navy-text">
‹
</button>
<span id="counter-display" class="text-[11px] font-black navy-text">1 / 15</span>
<button onclick="nextCard(event)" class="nav-btn navy-text">
›
</button>
</div>
</div>
</div>

<!-- BACK -->
<div class="absolute inset-0 bg-[#002147] text-white backface-hidden rotate-y-180 rounded-3xl flex flex-col justify-between p-5 border-b-8 border-[#CFC752]">

<div class="w-full flex justify-between items-center">
<span class="text-[10px] font-bold text-white/40 uppercase tracking-widest">Translation</span>
<button class="back-btn">BACK</button>
</div>

<div class="flex-grow flex items-center justify-center text-center">
<p id="back-text" class="phrase-back italic"></p>
</div>

<img src="https://static.wixstatic.com/media/c11625_0d25b3fc3bb56ca3c126f014ea762160.png"
class="h-5 mx-auto opacity-50 invert">

</div>
</div>
</div>

<button id="restart-btn"
class="mt-8 flex items-center space-x-2 hover:opacity-80 active:scale-95 transition-all">
<span class="font-black text-xs text-white tracking-[.15em] uppercase">Try again</span>
</button>
</div>

<script>
const library=[
{front:"Viaggiare senza intoppi",back:"To make good time"},
{front:"Mi raccomando",back:"Whatever you do..."},
{front:"Ci è andata bene!",back:"We were lucky!"},
{front:"Darci una mossa",back:"To get going"},
{front:"Un giorno sì e un giorno no",back:"Every other day"},
{front:"Secondo me...",back:"I think..."},
{front:"A tutti gli effetti",back:"To all intents and purposes"},
{front:"Alle prime luci dell'alba",back:"At the crack of dawn"},
{front:"Non se ne parla!",back:"Out of the question!"},
{front:"Da ore e ore",back:"For hours on end"},
{front:"Tutto d'un tratto",back:"All of a sudden"},
{front:"Cambiare idea",back:"To change one's mind"},
{front:"Sentirsi poco bene",back:"To feel under the weather"},
{front:"Ogni tanto",back:"Now and then"},
{front:"A memoria",back:"By heart"}
];

let cards=[],pool=[],currentIndex=0;
const flashcard=document.getElementById("flashcard");
const frontText=document.getElementById("front-text");
const backText=document.getElementById("back-text");
const counter=document.getElementById("counter-display");
const restartBtn=document.getElementById("restart-btn");

function startSession(){
if(pool.length<15) pool=[...library].sort(()=>0.5-Math.random());
cards=pool.splice(0,15);
currentIndex=0;
updateCard();
}

function updateCard(){
flashcard.classList.remove("flipped");
setTimeout(()=>{
frontText.innerText=cards[currentIndex].front;
backText.innerText=cards[currentIndex].back;
counter.innerText=`${currentIndex+1} / ${cards.length}`;
},150);
}

function nextCard(e){e.stopPropagation();currentIndex=(currentIndex+1)%cards.length;updateCard();}
function prevCard(e){e.stopPropagation();currentIndex=(currentIndex-1+cards.length)%cards.length;updateCard();}

flashcard.addEventListener("click",()=>flashcard.classList.toggle("flipped"));
restartBtn.addEventListener("click",startSession);

startSession();
</script>

</body>
</html>
