<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prepositions – Mobile Flashcards</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --bg-blue:#061247;
  --card-cream:#F7F2E7;
  --it-red:#8C0327;
  --en-blue:#0E065C;
  --border-red:#8C0327;
}

body{
  background:var(--bg-blue);
  font-family:system-ui, Segoe UI, Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:1rem;
}

/* CARD */
.perspective{perspective:1000px;}
.card-inner{
  width:90vw;
  max-width:380px;
  height:55vw;
  max-height:240px;
  position:relative;
  transform-style:preserve-3d;
  transition:.4s;
  cursor:pointer;
}
.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:1rem;
}
.back{transform:rotateY(180deg);}

.corner-hint{
  position:absolute;
  top:.4rem;
  right:.6rem;
  font-size:.6rem;
  font-weight:800;
  color:#061247;
}

.it-text{
  color:var(--it-red);
  font-weight:800;
  text-transform:uppercase;
  text-align:center;
  font-size:1.1rem;
}
.en-text{
  color:var(--en-blue);
  font-weight:700;
  text-transform:uppercase;
  text-align:center;
  font-size:1rem;
  white-space:pre-line;
}

.listen-btn{
  background:none;
  border:none;
  color:var(--it-red);
  font-weight:700;
  font-size:.9rem;
}

/* NAV */
.nav-btn{
  font-size:1.4rem;
  font-weight:700;
  color:white;
}

/* SET BUTTONS */
.set-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr); /* 4 buttons on one line */
  gap:.4rem;
  max-width:380px;
  width:100%;
}

.set-btn{
  padding:.35rem 0;
  font-size:.75rem;
  font-weight:800;
  border-radius:999px;
  background:white;
  color:#0E065C;
}
.set-btn.active{
  background:#8C0327;
  color:white;
}
</style>
</head>

<body>

<h1 class="text-white font-extrabold mb-2">PREPOSITIONS</h1>

<div class="perspective">
  <div id="flashcard" class="card-inner">

    <!-- FRONT -->
    <div class="face bg-[#F7F2E7] border-4 border-[#8C0327] flex items-center justify-center p-4">
      <div class="corner-hint">TAP TO REVEAL</div>
      <div id="front-text" class="it-text"></div>
    </div>

    <!-- BACK -->
    <div class="face back bg-[#F7F2E7] border-4 border-[#8C0327] flex flex-col items-center justify-center gap-3 p-4">
      <div class="corner-hint">TAP TO RETURN</div>
      <div id="back-text" class="en-text"></div>
      <button id="speakBtn" class="listen-btn">🔊 Listen</button>
    </div>

  </div>
</div>

<div class="flex justify-between items-center w-full max-w-[380px] mt-1">
  <button onclick="prevCard(event)" class="nav-btn">◀</button>
  <span id="counter-display" class="text-white font-bold text-sm">1 / 1</span>
  <button onclick="nextCard(event)" class="nav-btn">▶</button>
</div>

<div class="set-grid mt-2">
  <button class="set-btn" onclick="loadSet(1)">SET 1</button>
  <button class="set-btn" onclick="loadSet(2)">SET 2</button>
  <button class="set-btn" onclick="loadSet(3)">SET 3</button>
  <button class="set-btn" onclick="loadSet(4)">SET 4</button>
</div>

<script>
const sets = {
  1: [
    {it:"IN / DENTRO", en:"IN", speak:["in"]},
    {it:"SU", en:"ON", speak:["on"]},
    {it:"ATTACCATO", en:"ON", speak:["on"]},
    {it:"A / PRESSO", en:"AT", speak:["at"]},
    {it:"A / VERSO", en:"TO", speak:["to"]},
    {it:"DA", en:"FROM", speak:["from"]},
    {it:"DENTRO / IN", en:"INTO", speak:["into"]},
    {it:"FUORI DA", en:"OUT OF", speak:["out of"]},
    {it:"SOPRA / OLTRE", en:"OVER", speak:["over"]},
    {it:"SOTTO", en:"UNDER", speak:["under"]}
  ],

  2: [
    {it:"AL DI SOPRA", en:"ABOVE", speak:["above"]},
    {it:"AL DI SOTTO", en:"BELOW", speak:["below"]},
    {it:"TRA (due cose o persone)", en:"BETWEEN", speak:["between"]},
    {it:"TRA (più di due cose o persone)", en:"AMONG", speak:["among"]},
    {it:"VICINO A", en:"NEAR", speak:["near"]},
    {it:"PRIMA DI", en:"BEFORE", speak:["before"]},
    {it:"DOPO", en:"AFTER", speak:["after"]},
    {it:"DURANTE", en:"DURING", speak:["during"]},
    {it:"PER", en:"FOR", speak:["for"]},
    {it:"DA (QUANDO)", en:"SINCE", speak:["since"]}
  ],

  3: [
    {it:"DA (QUANTO)", en:"FOR", speak:["for"]},
    {it:"FINO A / FINCHÉ NON", en:"UNTIL", speak:["until"]},
    {it:"DI", en:"OF", speak:["of"]},
    {it:"CON", en:"WITH", speak:["with"]},
    {it:"SENZA", en:"WITHOUT", speak:["without"]},
    {it:"RIGUARDO A / A PROPOSITO", en:"ABOUT", speak:["about"]},
    {it:"DA / CON / PER MEZZO DI", en:"BY", speak:["by"]},
    {it:"A CAUSA DI", en:"BECAUSE OF", speak:["because of"]},
    {it:"ATTRAVERSO", en:"THROUGH", speak:["through"]},
    {it:"ATTRAVERSO / DA UN LATO ALL’ALTRO", en:"ACROSS", speak:["across"]}
  ],

  4: [
    {it:"CONTRO", en:"AGAINST", speak:["against"]},
    {it:"VERSO", en:"TOWARDS", speak:["towards"]},
    {it:"SECONDO (ME)", en:"ACCORDING TO (ME)", speak:["according to me"]},
    {it:"SU / VERSO L’ALTO", en:"UP", speak:["up"]},
    {it:"GIÙ / VERSO IL BASSO", en:"DOWN", speak:["down"]},
    {it:"DA / VIA DA", en:"OFF", speak:["off"]},
    {it:"SU", en:"ONTO", speak:["onto"]},
    {it:"ALL’INTERNO DI", en:"WITHIN", speak:["within"]},
    {it:"ENTRO (QUANTO)", en:"WITHIN", speak:["within"]},
    {it:"ENTRO (QUANDO)", en:"BY", speak:["by"]},
    {it:"ENTRO (QUANDO)", en:"BY", speak:["by"]}
  ]
};



let currentSet=1, cards=[], index=0;
const flashcard=document.getElementById("flashcard");
const frontText=document.getElementById("front-text");
const backText=document.getElementById("back-text");
const counter=document.getElementById("counter-display");
const speakBtn=document.getElementById("speakBtn");

function loadSet(n){
 currentSet=n; cards=sets[n]; index=0;
 updateCard(); highlightSet(n);
}
function highlightSet(n){
 document.querySelectorAll('.set-btn').forEach((b,i)=>b.classList.toggle('active',i+1===n));
}
function updateCard(){
 flashcard.classList.remove("flipped");
 if(!cards.length){
   frontText.innerText="—";
   backText.innerText="—";
   counter.innerText="0 / 0";
   return;
 }
 setTimeout(()=>{
   frontText.innerText=cards[index].it;
   backText.innerText=cards[index].en;
   counter.innerText=`${index+1} / ${cards.length}`;
 },120);
}
function nextCard(e){e.stopPropagation(); if(!cards.length) return; index=(index+1)%cards.length; updateCard();}
function prevCard(e){e.stopPropagation(); if(!cards.length) return; index=(index-1+cards.length)%cards.length; updateCard();}
flashcard.onclick=()=>flashcard.classList.toggle("flipped");

speakBtn.onclick=e=>{
 e.stopPropagation();
 if(!cards.length) return;
 const t = cards[index].speak.join(", ");
 const u=new SpeechSynthesisUtterance(t);
 u.lang="en-GB";
 speechSynthesis.cancel();
 speechSynthesis.speak(u);
};

loadSet(1);
</script>

</body>
</html>
