<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS – Lessons 13 & 14</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --navy:#002147;
  --gold:#CFC752;
  --purple:#561386;
}

body{
  background:var(--navy);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  overflow:hidden;
}

.perspective-1000{perspective:1000px;}
.preserve-3d{transform-style:preserve-3d;}
.backface-hidden{backface-visibility:hidden;}
.rotate-y-180{transform:rotateY(180deg);}
.flip-card-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);}
.flipped{transform:rotateY(180deg);}

.front-text, .back-text {
  font-size: 2.4rem;   /* natural size on desktop */
  line-height: 1.2;    /* gives a little breathing room */
  font-weight: 800;
}

.back-text {
  color: var(--navy);  /* keeps back text readable */
  line-height: 1.2;    /* match front for balance */
}

.nav-btn{
  width:50px;
  height:50px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.2rem;
}
.nav-btn:active{transform:scale(.9);}

.restart-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  background:none;
  border:2px solid #fff;
  color:#fff;
  padding:6px 14px;
  border-radius:999px;
  font-weight:800;
  letter-spacing:1.5px;
  text-transform:uppercase;
  font-size:.85rem;
  margin-top:1rem;
}
.restart-btn:active{transform:scale(.95);opacity:.8;}

.audio-btn{
  margin-top:.5rem;
  padding:6px 14px;
  border:2px solid var(--navy);
  border-radius:999px;
  font-weight:800;
  font-size:.8rem;
  letter-spacing:.05em;
  color:var(--navy);
}
.audio-btn:active{transform:scale(.95);opacity:.85;}

@media (max-width:480px){
  .front-text, .back-text{
    font-size:1.5rem;  /* mobile: readable but not too small */
    line-height:1.3;   /* add a little breathing room on small screens */
  }
  .nav-btn{
    width:40px;        /* slightly smaller on mobile */
    height:40px;
    font-size:1rem;
  }
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-[420px] perspective-1000">
<div id="flashcard" class="relative w-full h-[360px] preserve-3d flip-card-inner cursor-pointer shadow-2xl rounded-3xl">

<!-- FRONT -->
<div class="absolute inset-0 bg-white backface-hidden rounded-3xl flex flex-col justify-between p-5">
  <div class="text-[10px] font-black text-[#8B0000]/50 uppercase tracking-widest text-right">
    Lessons 13 & 14
  </div>

  <div class="flex-grow flex items-center justify-center text-center px-2">
    <p id="front-text" class="front-text"></p>
  </div>

  <div class="flex flex-col items-center space-y-2">
    <div class="text-[#8B0000] text-[11px] font-black uppercase tracking-[0.2em]">
      Tap / Click to reveal
    </div>

    <div class="flex items-center space-x-4 bg-white px-3 py-1 rounded-full">
      <button onclick="prevCard(event)" class="nav-btn text-[#002147]">◀</button>
      <span id="counter-display" class="text-[11px] font-black text-[#002147]">1 / 15</span>
      <button onclick="nextCard(event)" class="nav-btn text-[#002147]">▶</button>
    </div>
  </div>
</div>

<!-- BACK -->
<div class="absolute inset-0 bg-white backface-hidden rotate-y-180 rounded-3xl flex flex-col justify-between p-5 border-b-8 border-[#CFC752]">
  <div class="text-[10px] font-bold text-[#8B0000]/40 uppercase tracking-widest text-right">
    Translation
  </div>

  <div class="flex-grow flex flex-col items-center justify-center text-center px-2">
    <p id="back-text" class="back-text"></p>
    <button id="speakBtn" class="audio-btn">🔊 Listen</button>
  </div>

  <div class="flex justify-center pb-2">
    <div id="backBtn" class="text-[11px] font-black uppercase tracking-[0.2em] text-[#8B0000] cursor-pointer">
      Tap / Click to go back
    </div>
  </div>
</div>

</div>
</div>


<!-- RESTART -->
<button id="restartBtn" class="restart-btn">
  &#x21bb; Try again
</button>

<script>
const library = [
  { front:"Guastarsi / Crollare", back:"Break down", speak:["Break down"] },
  { front:"Richiedere / Esigere", back:"Call for", speak:["Call for"] },
  { front:"Passare da / Dare la parola", back:"Call on", speak:["Call on"] },
  { front:"Ovvio / Inequivocabile", back:"Clear cut", speak:["Clear cut"] },
  { front:"Riprendere i sensi / Rinvenire", back:"Come to", speak:["Come to"] },
  { front:"Cancellare / Barrare", back:"Cross out", speak:["Cross out"] },

  { front:"Smettere", back:"Give up", speak:["Give up"] },
  { front:"Arrendersi", back:"Give up", speak:["Give up"] },
  { front:"Rinunciare", back:"Give up", speak:["Give up"] },

  { front:"Indossare", back:"Have on", speak:["Have on"] },
  { front:"Chiarire", back:"Make clear", speak:["Make clear"] },
  { front:"Dare per scontato", back:"Take for granted", speak:["Take for granted"] },
  { front:"Tenere in considerazione", back:"Take into account", speak:["Take into account"] },
  { front:"Rivelarsi / Andare a finire / Diventare", back:"Turn out", speak:["Turn out"] },

  { front:"A dire il vero / In realtà", back:"As a matter of fact", speak:["As a matter of fact"] },

  { front:"Non vedere l’ora di fare", back:"Can’t wait to do / Look forward to doing", speak:["Can't wait to do", "Look forward to doing"] },

  { front:"Avverarsi", back:"Come true", speak:["Come true"] },
  { front:"Mangiare a casa", back:"Eat in", speak:["Eat in"] },
  { front:"Mangiare fuori", back:"Eat out", speak:["Eat out"] },

  { front:"Avere voglia di (fare)", back:"Fancy doing / Feel like doing", speak:["Fancy doing", "Feel like doing"] },

  { front:"Sentire (qualcuno)", back:"Hear from", speak:["Hear from"] },
  { front:"Sentire parlare di", back:"Hear of", speak:["Hear of"] },
  { front:"Offro io", back:"It’s on me", speak:["It's on me"] },
  { front:"Tenere d’occhio", back:"Keep an eye on", speak:["Keep an eye on"] },
  { front:"Prendersi cura di", back:"Look after", speak:["Look after"] },
  { front:"Prendere in giro", back:"Make fun of", speak:["Make fun of"] },
  { front:"Una volta per tutte", back:"Once and for all", speak:["Once and for all"] },
  { front:"Non tutto il male vien per nuocere", back:"A blessing in disguise", speak:["A blessing in disguise"] },

  { front:"Stordito", back:"Dazed", speak:["Dazed"] },
  { front:"Premere un interruttore", back:"Flick a switch", speak:["Flick a switch"] },
  { front:"Avvicinarsi (all’età/ora)", back:"Get on for", speak:["Get on for"] },
  { front:"Accensione", back:"Ignition", speak:["Ignition"] },
  { front:"Attaccare bottone / Avviare", back:"Strike up", speak:["Strike up"] },
  { front:"A dir poco", back:"To say the least", speak:["To say the least"] },
  { front:"I perché e i percome", back:"The whys and wherefores", speak:["The whys and wherefores"] }
];

let currentIndex = 0;
let cards = [];
let recentlyShown = []; // tracks recently shown cards across sessions
const sessionSize = 15; // number of cards per session
const recentLimit = 30;  // how many cards to avoid repeating across sessions

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const backBtn   = document.getElementById("backBtn");
const restartBtn= document.getElementById("restartBtn");
const speakBtn  = document.getElementById("speakBtn");

// --- Speech voices setup ---
let voices = [];
let currentSpeakArray = [];
speechSynthesis.onvoiceschanged = () => {
  voices = speechSynthesis.getVoices();
};

// Fisher–Yates shuffle
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// Start a session
function startSession() {
  // Filter out recently shown cards
  const available = library.filter(c => !recentlyShown.includes(c));
  const shuffled = shuffleArray(available.length ? [...available] : [...library]);
  
  cards = shuffled.slice(0, sessionSize);

  // Update recentlyShown to track minimal repetition across sessions
  recentlyShown.push(...cards);
  if (recentlyShown.length > recentLimit) {
    recentlyShown.splice(0, recentlyShown.length - recentLimit);
  }

  currentIndex = 0;
  updateCard();
}

// Update the displayed card
function updateCard() {
  flashcard.classList.remove("flipped");
  setTimeout(() => {
    frontText.innerText = cards[currentIndex].front;
    backText.innerText  = cards[currentIndex].back;
    currentSpeakArray   = cards[currentIndex].speak || [];
    counter.innerText   = `${currentIndex+1} / ${cards.length}`;
  }, 150);
}

// Navigation buttons
function nextCard(e){
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % cards.length;
  updateCard();
}

function prevCard(e){
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + cards.length) % cards.length;
  updateCard();
}

/* FLIP */
flashcard.addEventListener("click", ()=> flashcard.classList.toggle("flipped"));
backBtn.addEventListener("click", (e)=>{
  e.stopPropagation();
  flashcard.classList.remove("flipped");
});

/* AUDIO – British male voice with “or” between alternatives */
speakBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if (!currentSpeakArray.length) return;

  speechSynthesis.cancel();

  const ukMale = voices.find(v => v.lang === "en-GB" && /male/i.test(v.name)) || voices.find(v => v.lang === "en-GB");

  let i = 0;

  function speakNext() {
    if (i >= currentSpeakArray.length) return;

    const utter = new SpeechSynthesisUtterance(currentSpeakArray[i]);
    utter.lang = "en-GB";
    if (ukMale) utter.voice = ukMale;

    utter.onend = () => {
      i++;
      if (i < currentSpeakArray.length) {
        const orUtter = new SpeechSynthesisUtterance("or");
        orUtter.lang = "en-GB";
        if (ukMale) orUtter.voice = ukMale;

        orUtter.onend = () => setTimeout(speakNext, 60); // short, natural pause
        speechSynthesis.speak(orUtter);
      }
    };

    speechSynthesis.speak(utter);
  }

  speakNext();
});

// Restart session (Try Again)
restartBtn.addEventListener("click", startSession);

// Start first session on page load
startSession();
</script>
