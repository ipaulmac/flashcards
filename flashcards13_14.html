<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS - Lessons 13 & 14 Compact</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root {
    --brand-navy:#002147;
    --brand-gold:#CFC752;
    --custom-purple:#561386;
}

body{
    background:var(--custom-purple);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    overflow:hidden;
}

.perspective-1000{perspective:1000px;}
.preserve-3d{transform-style:preserve-3d;}
.backface-hidden{backface-visibility:hidden;}
.rotate-y-180{transform:rotateY(180deg);}
.flip-card-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);}
.flipped{transform:rotateY(180deg);}

.phrase-front{font-size:2.4rem;line-height:1.1;font-weight:700;color:#FFFFFF;}
.phrase-back{font-size:2.75rem;line-height:1.05;font-weight:800;color:var(--brand-navy);}

.nav-btn{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#FFFFFF; 
    color:var(--brand-navy); 
    font-weight:700;
}
.nav-btn:active{transform:scale(.9);}

#counter-display{
    background:#FFFFFF;
    color:var(--brand-navy);
    padding:0 8px;
    border-radius:6px;
    font-weight:700;
    font-size:.85rem;
}

.back-btn{
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:.9rem;
}
.back-btn:active{transform:scale(.95);opacity:.8;}

.restart-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:.85rem;
    margin-top:1rem;
}
.restart-btn:active{transform:scale(.95);opacity:.8;}

#speakBtn{
    background:none;
    border:2px solid var(--brand-navy);
    color:var(--brand-navy);
    padding:5px 12px;
    border-radius:999px;
    font-weight:700;
    margin-bottom:0.5rem;
    cursor:pointer;
}
#speakBtn:active{transform:scale(.95);opacity:.8;}

@media (max-width:480px){
    .phrase-front{font-size:1.4rem;}
    .phrase-back{font-size:1.7rem;}
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-[420px] perspective-1000">
<div id="flashcard" class="relative w-full h-[360px] preserve-3d flip-card-inner cursor-pointer shadow-2xl rounded-3xl">

<!-- FRONT -->
<div class="absolute inset-0 bg-[#002147] backface-hidden rounded-3xl flex flex-col justify-between p-5 border">
    <div class="text-[10px] font-black text-white/50 uppercase tracking-widest text-right">Lessons 13 & 14</div>
    <div class="flex-grow flex items-center justify-center text-center px-2">
        <p id="front-text" class="phrase-front"></p>
    </div>

    <div class="flex flex-col items-center space-y-2">
        <div class="text-[#FFFFFF] text-[11px] font-black uppercase tracking-[0.2em]">
            Tap / Click to reveal
        </div>

        <div class="flex items-center space-x-4 px-3 py-1 rounded-full">
            <button onclick="prevCard(event)" class="nav-btn">◀</button>
            <span id="counter-display">1 / 15</span>
            <button onclick="nextCard(event)" class="nav-btn">▶</button>
        </div>
    </div>
</div>

<!-- BACK -->
<div class="absolute inset-0 bg-white backface-hidden rotate-y-180 rounded-3xl flex flex-col justify-between p-5 border-b-8 border-[#561386]">
    <div class="text-[10px] font-bold text-[#561386]/40 uppercase tracking-widest text-right">Translation</div>

    <div class="flex-grow flex flex-col items-center justify-center text-center px-2">
        <p id="back-text" class="phrase-back italic mb-2"></p>
        <button id="speakBtn">🔊 Listen</button>
    </div>

    <div class="flex justify-center pb-2">
        <button id="backBtn" class="back-btn">Tap / Click to go back</button>
    </div>
</div>

</div>
</div>

<button id="restartBtn" class="restart-btn">
    &#x21bb; Try again
</button>

<script>
const library = [
  {front:"Guastarsi / Crollare", back:"Break down"},
  {front:"Richiedere / Esigere", back:"Call for"},
  {front:"Passare da / Dare la parola", back:"Call on"},
  {front:"Ovvio / Inequivocabile", back:"Clear cut"},
  {front:"Riprendere i sensi", back:"Come to"},
  {front:"Cancellare / Barrare", back:"Cross out"},
  {front:"Smettere / Arrendersi", back:"Give up"},
  {front:"Indossare", back:"Have on"},
  {front:"Chiarire", back:"Make clear"},
  {front:"Dare per scontato", back:"Take for granted"},
  {front:"Tenere in considerazione", back:"Take into account"},
  {front:"Rivelarsi / Andare a finire / Diventare", back:"Turn out"},
  {front:"A dire il vero / In realtà", back:"As a matter of fact"},
  {front:"Non vedere l’ora di", back:"Can’t wait / Look forward to"},
  {front:"Avverarsi", back:"Come true"},
  {front:"Mangiare a casa", back:"Eat in"},
  {front:"Mangiare fuori", back:"Eat out"},
  {front:"Avere voglia di fare", back:"Fancy doing / Feel like doing"},
  {front:"Sentire (qualcuno)", back:"Hear from"},
  {front:"Sentire parlare di", back:"Hear of"},
  {front:"Offro io", back:"It’s on me"},
  {front:"Tenere d’occhio", back:"Keep an eye on"},
  {front:"Prendersi cura di", back:"Look after"},
  {front:"Prendere in giro", back:"Make fun of"},
  {front:"Una volta per tutte", back:"Once and for all"},
  {front:"Una benedizione sotto mentite spoglie", back:"Blessing in disguise"},
  {front:"Stordito", back:"Dazed"},
  {front:"Premere un interruttore", back:"Flick a switch"},
  {front:"Avvicinarsi (all’età/ora)", back:"Get on for"},
  {front:"Accensione", back:"Ignition"},
  {front:"Attaccare bottone / Avviare", back:"Strike up"},
  {front:"A dir poco", back:"To say the least"},
  {front:"I perché e i percome", back:"Whys and wherefores"}
];

let cards=[], pool=[], currentIndex=0;

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const backBtn   = document.getElementById("backBtn");
const restartBtn= document.getElementById("restartBtn");
const speakBtn  = document.getElementById("speakBtn");

function startSession(){
    if(pool.length < 15) pool=[...library].sort(()=>0.5-Math.random());
    cards = pool.splice(0,15);
    currentIndex=0;
    updateCard();
}

function updateCard(){
    flashcard.classList.remove("flipped");
    setTimeout(()=>{
        frontText.innerText = cards[currentIndex].front;
        backText.innerText  = cards[currentIndex].back;
        counter.innerText  = `${currentIndex+1} / ${cards.length}`;
    },150);
}

function nextCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex+1)%cards.length;
    updateCard();
}
function prevCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex-1+cards.length)%cards.length;
    updateCard();
}

flashcard.addEventListener("click",()=>flashcard.classList.toggle("flipped"));
backBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    flashcard.classList.remove("flipped");
});
restartBtn.addEventListener("click",startSession);

speakBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    const utterance = new SpeechSynthesisUtterance(cards[currentIndex].back);
    utterance.lang = 'en-GB';
    utterance.rate = 0.9;
    speechSynthesis.speak(utterance);
});

startSession();
</script>

</body>
</html>
