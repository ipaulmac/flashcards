<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS - Lessons 5 & 6 Compact</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root {
    --brand-navy:#002147;
    --brand-gold:#CFC752;
    --custom-purple:#561386;
}
body{
    background:var(--custom-purple);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    overflow:hidden;
}
.perspective-1000{perspective:1000px;}
.preserve-3d{transform-style:preserve-3d;}
.backface-hidden{backface-visibility:hidden;}
.rotate-y-180{transform:rotateY(180deg);}
.flip-card-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);}
.flipped{transform:rotateY(180deg);}

.phrase-front{font-size:2.4rem;line-height:1.1;font-weight:700;color:var(--brand-navy);}
.phrase-back{font-size:2.75rem;line-height:1.05;font-weight:800;}

.nav-btn{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
}
.nav-btn:active{transform:scale(.9);}

.ui-accent-bg{background:var(--brand-gold);}
.navy-text{color:var(--brand-navy);}

.back-btn{
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:.9rem;
}
.back-btn:active{transform:scale(.95);opacity:.8;}

.restart-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:.85rem;
    margin-top:1rem;
}
.restart-btn:active{transform:scale(.95);opacity:.8;}

@media (max-width:480px){
    .phrase-front{font-size:1.4rem;}
    .phrase-back{font-size:1.7rem;}
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-[420px] perspective-1000">
<div id="flashcard" class="relative w-full h-[360px] preserve-3d flip-card-inner cursor-pointer shadow-2xl rounded-3xl">

<!-- FRONT -->
<div class="absolute inset-0 bg-white backface-hidden rounded-3xl flex flex-col justify-between p-5 border">
    <div class="text-[10px] font-black text-[#561386]/50 uppercase tracking-widest text-right">Lessons 5 & 6</div>
    <div class="flex-grow flex items-center justify-center text-center px-2">
        <p id="front-text" class="phrase-front"></p>
    </div>

    <div class="flex flex-col items-center space-y-2">
        <div class="text-[#800000] text-[11px] font-black uppercase tracking-[0.2em]">
            Tap / Click to reveal
        </div>

        <div class="flex items-center space-x-4 ui-accent-bg px-3 py-1 rounded-full">
            <button onclick="prevCard(event)" class="nav-btn navy-text">◀</button>
            <span id="counter-display" class="text-[11px] font-black navy-text">1 / 15</span>
            <button onclick="nextCard(event)" class="nav-btn navy-text">▶</button>
        </div>
    </div>
</div>

<!-- BACK -->
<div class="absolute inset-0 bg-[#002147] text-white backface-hidden rotate-y-180 rounded-3xl flex flex-col justify-between p-5 border-b-8 border-[#CFC752]">
    <div class="text-[10px] font-bold text-white/30 uppercase tracking-widest text-right">Translation</div>

    <div class="flex-grow flex items-center justify-center text-center px-2">
        <p id="back-text" class="phrase-back italic"></p>
    </div>

    <div class="flex justify-center pb-2">
        <button id="backBtn" class="back-btn">Tap / Click to go back</button>
    </div>
</div>

</div>
</div>

<button id="restartBtn" class="restart-btn">
    &#x21bb; Try again
</button>

<script>
const library = [
  {front:"Annullare", back:"To call off"},
  {front:"Prendere il raffreddore", back:"To catch a cold"},
  {front:"Cambiare idea", back:"To change one’s mind"},
  {front:"Per sempre", back:"For good"},
  {front:"Per ora", back:"For the time being"},
  {front:"Tornare (a casa)", back:"To get back (home)"},
  {front:"Riprendersi / Superare", back:"To get over"},
  {front:"Di corsa", back:"In a hurry / In a rush"},
  {front:"Fare attenzione a", back:"To look out for / To watch out for"},
  {front:"Decidersi", back:"To make up one’s mind"},
  {front:"Rimandare", back:"To put off"},
  {front:"Stringere la mano", back:"To shake hands"},
  {front:"Tutto d’un tratto", back:"All at once / All of a sudden"},
  {front:"Controllare / Rivedere", back:"To check over / To go over / To look over"},
  {front:"Contare su", back:"To count on / To rely on / To depend on"},
  {front:"Cavarsela", back:"To get by"},
  {front:"Avere l’occasione di fare", back:"To get to do something"},
  {front:"Continuare / Succedere / Accendersi", back:"To go on"},
  {front:"Riattaccare (il telefono)", back:"To hang up"},
  {front:"Chiedere un permesso", back:"To have / To take (time) off"},
  {front:"Fuori servizio", back:"Out of order"},
  {front:"Spegnere", back:"To put out"},
  {front:"Non sentirsi bene", back:"To feel under the weather"},
  {front:"Entrare in possesso", back:"To come into possession"},
  {front:"Mi gira la testa", back:"I feel dizzy"},
  {front:"Fuori campo", back:"Out of range"},
  {front:"Venire a mancare / Morire", back:"To pass away"},
  {front:"Tramandare", back:"To pass down"},
  {front:"Fermarsi (con l’auto)", back:"To pull up"},
  {front:"Pernottare", back:"To stay overnight"},
  {front:"Fermarsi brevemente", back:"To stop off"},
  {front:"Buche (sull’asfalto)", back:"Pot-holes"},
  {front:"Spericolato / Avventato", back:"Reckless"},
  {front:"Altrettanto (facile) quanto", back:"Just as (easy) as"},
  {front:"Liberarsi di / Scrollarsi di dosso", back:"To shake off"},
  {front:"Peggiorare", back:"To go downhill"},
  {front:"Testardo / Ostinato", back:"Stubborn"},
  {front:"Sei riuscito a (fare)?", back:"Any luck (doing)?"},
  {front:"Neanche per sogno / Assolutamente no", back:"No way"},
  {front:"Riunione del consiglio di amministrazione", back:"Board-meeting"},
  {front:"Per fortuna", back:"Thankfully"},
  {front:"Di scorta / In più", back:"Spare"},
  {front:"Dare un passaggio", back:"To give a lift"},
  {front:"Come mai…?", back:"Why is it that …?"},
  {front:"Nella foga del momento", back:"In the heat of the moment"},
  {front:"Sopraffatto", back:"Overwhelmed"},
  {front:"Legalmente vincolante", back:"Legally-binding"},
  {front:"Di lunga data", back:"Long-standing"},
  {front:"Fare gli straordinari", back:"To work over-time"}
];

let cards=[], pool=[], currentIndex=0;

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const backBtn   = document.getElementById("backBtn");
const restartBtn= document.getElementById("restartBtn");

function startSession(){
    if(pool.length < 15) pool=[...library].sort(()=>0.5-Math.random());
    cards = pool.splice(0,15);
    currentIndex=0;
    updateCard();
}

function updateCard(){
    flashcard.classList.remove("flipped");
    setTimeout(()=>{
        frontText.innerText = cards[currentIndex].front;
        backText.innerText  = cards[currentIndex].back;
        counter.innerText  = `${currentIndex+1} / ${cards.length}`;
    },150);
}

function nextCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex+1)%cards.length;
    updateCard();
}
function prevCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex-1+cards.length)%cards.length;
    updateCard();
}

flashcard.addEventListener("click",()=>flashcard.classList.toggle("flipped"));
backBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    flashcard.classList.remove("flipped");
});
restartBtn.addEventListener("click",startSession);

startSession();
</script>

</body>
</html>
