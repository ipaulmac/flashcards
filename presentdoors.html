    btn.classList.remove("active")
  })

  if(mode === "test"){
    document.getElementById("test-btn").classList.add("active")
  } else if(n){
    document.querySelectorAll(".set-btn")[n-1].classList.add("active")
  }
}

/* ================= LOAD FLOOR ================= */

window.loadSet = function(n){

  mode = "floor"
  currentFloor = n

  let weightedPool = []

  sets[n].forEach(card=>{
    if(recentCards.includes(card)){
      if(Math.random() < 0.3){
        weightedPool.push(card)
      }
    } else {
      weightedPool.push(card)
    }
  })

  if(weightedPool.length < 10){
    weightedPool = [...sets[n]]
  }

  let selected = shuffle(weightedPool).slice(0,10)

  cards = selected.map(card=>{
    let originalIndex = sets[n].indexOf(card) + 1
    return {
      ...card,
      audio: `audio/floor${n}/F${n}-${String(originalIndex).padStart(3,'0')}.mp3`
    }
  })

  recentCards = [...recentCards, ...cards].slice(-RECENT_LIMIT)

  index = 0

  activateButton(n)
  updateCard()
}

/* ================= TEST MODE ================= */

window.loadTest = function(){

  mode = "test"

  let combined = []

 Object.keys(sets).forEach(i=>{

  if(Number(i) === 7) return // skip Door 6+

    sets[i].forEach((card, idx)=>{
      combined.push({
        ...card,
        door: Number(i), // FIX
        audio: `audio/floor${i}/F${i}-${String(idx+1).padStart(3,'0')}.mp3`
      })
    })
  })

  cards = shuffle(combined).slice(0,20)

  index = 0

  activateButton()
  updateCard()
}

/* ================= REFRESH ================= */

window.refreshCurrentSet = function(){
  if(mode === "floor"){
    loadSet(currentFloor)
  } else {
    loadTest()
  }
}

/* ================= UPDATE CARD ================= */

function updateCard(){

  if(!cards.length) return

  flashcard.classList.remove("flipped")

  // RESTORE NORMAL CARD STYLING
  frontText.style.color = "";
  frontText.style.textAlign = "center";
  frontText.style.fontSize = "1.08rem";
  frontText.style.lineHeight = "1.28";
  frontText.style.padding = "";

  const c = cards[index]

  frontText.innerText = c.front.toUpperCase()
  backText.innerText = c.back.toUpperCase()

  if(mode === "floor"){
    doorLabel.innerText = doorLabels[currentDoor] || ("DOOR " + currentDoor)
  } else {
    doorLabel.innerText = doorLabels[c.door] || ("DOOR " + c.door)
  }

  counter.innerText = (index + 1) + " / " + cards.length
}

/* ================= NAVIGATION ================= */

window.nextCard = function(){
  index = (index + 1) % cards.length
  updateCard()
}

window.prevCard = function(){
  index = (index - 1 + cards.length) % cards.length
  updateCard()
}

/* ================= CARD FLIP ================= */

flashcard.addEventListener("click", ()=>{

  if(mode === "instructions") return

  flashcard.classList.toggle("flipped")
})

/* ================= AUDIO ================= */

speakBtn.addEventListener("click", (e)=>{

  e.stopPropagation()

  if(mode === "instructions") return

  if(currentAudio){
    currentAudio.pause()
    currentAudio.currentTime = 0
    currentAudio = null
  }

  currentAudio = new Audio(cards[index].audio)
  currentAudio.play()
})

const BACK_BUTTON_URL = "https://www.acceleratedlanguagesystems.com/virtual-classroom-booster";

document.getElementById("libraryBackBtn").onclick = function(){
    window.location.href = BACK_BUTTON_URL;
};
