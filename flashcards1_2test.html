<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS – Lessons 1 & 2</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --bg-blue:#061247;
  --card-white:#ffffff;
  --it-red:#8C0327;
  --en-blue:#0E065C;
  --border-red:#8C0327;
}

/* Body */
body{
  background:var(--bg-blue);
  font-family:system-ui, Segoe UI, Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:1rem;
}

/* CARD */
.perspective{perspective:1000px;}
.card-inner{
  width:90vw;
  max-width:380px;
  height:55vw;
  max-height:240px;
  position:relative;
  transform-style:preserve-3d;
  transition:.4s;
  cursor:pointer;
}
.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:1rem;
  background:var(--card-white);
  border:4px solid var(--border-red);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:1rem;
}
.back{transform:rotateY(180deg);}

/* Text */
.front-text{
  color:var(--it-red);
  font-weight:800;
  text-transform:uppercase;
  text-align:center;
  font-size:1.5rem;
}
.back-text{
  color:var(--en-blue);
  font-weight:700;
  text-transform:uppercase;
  text-align:center;
  font-size:1.4rem;
  white-space:pre-line;
}

/* TAP hints */
.tap-hint{
  position:absolute;
  bottom:0.5rem;
  font-size:0.7rem;
  font-weight:700;
  color:#061247;
  text-transform:uppercase;
}

/* Listen button */
.audio-btn, .listen-btn{
  margin-top:.5rem;
  padding:6px 14px;
  border:2px solid var(--en-blue);
  border-radius:999px;
  font-weight:800;
  font-size:.8rem;
  letter-spacing:.05em;
  color:var(--en-blue);
}
.audio-btn:active, .listen-btn:active{transform:scale(.95);opacity:.85;}

/* NAV */
.nav-btn{
  font-size:1.4rem;
  font-weight:700;
  color:white;
}

/* Corner hint */
.corner-hint{
  position:absolute;
  top:.4rem;
  right:.6rem;
  font-size:.6rem;
  font-weight:800;
  color:#061247;
}

/* RESTART BUTTON */
.restart-btn{
  display:flex;align-items:center;justify-content:center;
  background:none;border:2px solid white;color:white;
  padding:6px 14px;border-radius:999px;
  font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;font-size:.85rem;margin-top:1rem;
}
.restart-btn:active{transform:scale(.95);opacity:.8;}
</style>
</head>

<body>

<div class="perspective">
  <div id="flashcard" class="card-inner">

    <!-- FRONT -->
    <div class="face">
      <div class="corner-hint">Lessons 1 & 2</div>
      <div id="front-text" class="front-text"></div>
      <div class="tap-hint">TAP TO REVEAL</div>
    </div>

    <!-- BACK -->
    <div class="face back">
      <div class="corner-hint">Translation</div>
      <div id="back-text" class="back-text"></div>
      <button id="speakBtn" class="audio-btn">🔊 Listen</button>
      <div class="tap-hint">TAP TO RETURN</div>
    </div>

  </div>
</div>

<div class="flex justify-center items-center w-full max-w-[380px] mt-2 gap-4">
  <button onclick="prevCard(event)" class="nav-btn">◀</button>
  <span id="counter-display" class="text-white font-bold text-sm">1 / 15</span>
  <button onclick="nextCard(event)" class="nav-btn">▶</button>
</div>

<button id="restartBtn" class="restart-btn">🔄 Try again</button>

<script>
const library = [
 {front:"All’inizio", back:"At first"},
 {front:"Subito", back:"At once / Right away / Straight away"},
 {front:"Richiamare", back:"Call back"},
 {front:"Telefonare / Fare uno squillo", back:"Call up"},
 {front:"Entrare / Salire (in auto)", back:"Get in"},
 {front:"Scendere (dal treno)", back:"Get off"},
 {front:"Salire (mezzi pubblici)", back:"Get on"},
 {front:"Uscire / Scendere dalla macchina", back:"Get out"},
 {front:"Alzarsi", back:"Get up"},
 {front:"Fare uno squillo a qualcuno", back:"Give someone a call / Call up"},
 {front:"Raccogliere (da terra)", back:"Pick up"},
 {front:"Passare a prendere", back:"Pick up"},
 {front:"Ritirare (un pacco)", back:"Pick up"},
 {front:"Indossare / Mettersi", back:"Put on"},
 {front:"Spegnere", back:"Switch off / Turn off / Shut off"},
 {front:"Accendere", back:"Switch on / Turn on"},
 {front:"Togliersi", back:"Take off"},
 {front:"Dall’inizio", back:"All along"},
 {front:"Dappertutto", back:"All over"},
 {front:"Va bene", back:"All right"},
 {front:"Come al solito", back:"As usual"},
 {front:"Finalmente", back:"At last"},
 {front:"Vestirsi elegante", back:"Dress up"},
 {front:"Scoprire / Informarsi", back:"Find out"},
 {front:"Poco a poco", back:"Little by little / Step by step"},
 {front:"Guardare", back:"Look at"},
 {front:"Cercare", back:"Look for, or, Search for"},
 {front:"Non importa / Lascia perdere", back:"Never mind / Don't bother"},
 {front:"Passo dopo passo", back:"Step by step / Little by little"},
 {front:"Stancare troppo / Sfinire", back:"Tire out / Wear out"},
 {front:"Compagno di classe", back:"Classmate"},
 {front:"Nel giro di", back:"In the space of"},
 {front:"Versare", back:"Pour"},
 {front:"Saltare", back:"Skip"},
 {front:"Fornire", back:"Supply"},
 {front:"Mi raccomando", back:"Whatever you do"},
 {front:"Sgranchirsi le gambe", back:"Stretch one’s legs"},
 {front:"Per l’amor del cielo! / Mamma mia!", back:"For heaven’s sake!"},
 {front:"Un cavolo / Proprio niente", back:"A damned thing"},
 {front:"Identificare", back:"Put one’s finger on something"},
 {front:"Volevo solo dire", back:"I just wanted to mention"},
 {front:"Lascia stare / Non ti preoccupare", back:"Don’t bother / Never mind"},
 {front:"Qual è il suo problema?!", back:"What’s wrong with him?!"},
 {front:"Di fila / Consecutivamente", back:"In a row"},
 {front:"Non posso non essere d’accordo con te", back:"I would have to agree with you"}
];

let currentIndex = 0;
let cards = [];
const sessionSize = 15;

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const restartBtn= document.getElementById("restartBtn");
const speakBtn  = document.getElementById("speakBtn");

// Pick 15 random cards per session
function startSession() {
  cards = [];
  const copy = [...library];
  while(cards.length < sessionSize && copy.length){
    const idx = Math.floor(Math.random() * copy.length);
    cards.push(copy.splice(idx,1)[0]);
  }
  currentIndex = 0;
  updateCard();
}

function updateCard(){
  flashcard.classList.remove("flipped");
  setTimeout(()=>{
    frontText.innerText = cards[currentIndex].front.toUpperCase();
    backText.innerText  = cards[currentIndex].back.toUpperCase();
    counter.innerText   = `${currentIndex+1} / ${cards.length}`;
  },150);
}

function nextCard(e){
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % cards.length;
  updateCard();
}

function prevCard(e){
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + cards.length) % cards.length;
  updateCard();
}

/* FLIP */
flashcard.addEventListener("click", ()=> flashcard.classList.toggle("flipped"));

/* AUDIO */
speakBtn.addEventListener("click",(e)=>{
  e.stopPropagation();
  const utter = new SpeechSynthesisUtterance(backText.innerText);
  utter.lang = "en-GB";
  const voices = speechSynthesis.getVoices();
  const ukMale = voices.find(v=>v.lang==="en-GB" && /male/i.test(v.name));
  if(ukMale) utter.voice = ukMale;
  speechSynthesis.speak(utter);
});

restartBtn.addEventListener("click", startSession);

startSession();
</script>

</body>
</html>
