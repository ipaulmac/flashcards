<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS – Lessons 1 & 2</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --navy:#002147;
  --gold:#CFC752;
  --purple:#561386;
}

body{
  background:var(--navy);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  overflow:hidden;
}

.perspective-1000{perspective:1000px;}
.preserve-3d{transform-style:preserve-3d;}
.backface-hidden{backface-visibility:hidden;}
.rotate-y-180{transform:rotateY(180deg);}
.flip-card-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);}
.flipped{transform:rotateY(180deg);}

.front-text{font-size:2.2rem;line-height:1.1;font-weight:800;color:#002147;}
.back-text{font-size:2.2rem;line-height:1.05;font-weight:800;color:var(--navy);}

.nav-btn{
  width:50px;   /* increased from 40px */
  height:50px;  /* increased from 40px */
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.2rem; /* optional: makes the arrow symbol inside bigger */
}
.nav-btn:active{transform:scale(.9);}

.restart-btn{
  display:flex;align-items:center;justify-content:center;
  background:none;border:2px solid #fff;color:#fff;
  padding:6px 14px;border-radius:999px;
  font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;font-size:.85rem;margin-top:1rem;
}
.restart-btn:active{transform:scale(.95);opacity:.8;}

.audio-btn{
  margin-top:.5rem;
  padding:6px 14px;
  border:2px solid var(--navy);
  border-radius:999px;
  font-weight:800;
  font-size:.8rem;
  letter-spacing:.05em;
  color:var(--navy);
}
.audio-btn:active{transform:scale(.95);opacity:.85;}

@media (max-width:480px){
  .nav-btn{
    width:40px;
    height:40px;
    font-size:1rem;
  }
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-[420px] perspective-1000">
<div id="flashcard" class="relative w-full h-[360px] preserve-3d flip-card-inner cursor-pointer shadow-2xl rounded-3xl">

<!-- FRONT -->
<div class="absolute inset-0 bg-white backface-hidden rounded-3xl flex flex-col justify-between p-5">
  <div class="text-[10px] font-black text-[#002147]/50 uppercase tracking-widest text-right">
    Lessons 1 & 2
  </div>

  <div class="flex-grow flex items-center justify-center text-center px-2">
    <p id="front-text" class="front-text"></p>
  </div>

  <div class="flex flex-col items-center space-y-2">
    <div class="text-[#002147] text-[11px] font-black uppercase tracking-[0.2em]">
      Tap / Click to reveal
    </div>

    <div class="flex items-center space-x-4 bg-white px-3 py-1 rounded-full">
      <button onclick="prevCard(event)" class="nav-btn text-[#002147]">◀</button>
      <span id="counter-display" class="text-[11px] font-black text-[#002147]">1 / 15</span>
      <button onclick="nextCard(event)" class="nav-btn text-[#002147]">▶</button>
    </div>
  </div>
</div>

<!-- BACK -->
<div class="absolute inset-0 bg-white backface-hidden rotate-y-180 rounded-3xl flex flex-col justify-between p-5 border-b-8 border-[#CFC752]">
  <div class="text-[10px] font-bold text-[#002147]/40 uppercase tracking-widest text-right">
    Translation
  </div>

  <div class="flex-grow flex flex-col items-center justify-center text-center px-2">
    <p id="back-text" class="back-text"></p>
    <button id="speakBtn" class="audio-btn">🔊 Listen</button>
  </div>

  <div class="flex justify-center pb-2">
    <div id="backBtn" class="text-[11px] font-black uppercase tracking-[0.2em] text-[#002147] cursor-pointer">
      Tap / Click to go back
    </div>
  </div>
</div>

</div>
</div>

<!-- RESTART -->
<button id="restartBtn" class="restart-btn">
  &#x21bb; Try again
</button>

<script>
const library = [
 {front:"All’inizio", back:"At first", speak:["at first"]},
 {front:"Subito", back:"At once / Right away / Straight away", speak:["at once","right away","straight away"]},
 {front:"Richiamare", back:"Call back", speak:["call back"]},
 {front:"Telefonare / Fare uno squillo", back:"Call up", speak:["call up"]},
 {front:"Entrare / Salire (in auto)", back:"Get in", speak:["get in"]},
 {front:"Scendere (dal treno)", back:"Get off", speak:["get off"]},
 {front:"Salire (mezzi pubblici)", back:"Get on", speak:["get on"]},
 {front:"Uscire / Scendere dalla macchina", back:"Get out", speak:["get out"]},
 {front:"Alzarsi", back:"Get up", speak:["get up"]},
 {front:"Fare uno squillo a qualcuno", back:"Give someone a call / Call up", speak:["give someone a call","call up"]},
 {front:"Raccogliere (da terra)", back:"Pick up", speak:["pick up"]},
 {front:"Passare a prendere", back:"Pick up", speak:["pick up"]},
 {front:"Ritirare (un pacco)", back:"Pick up", speak:["pick up"]},
 {front:"Indossare / Mettersi", back:"Put on", speak:["put on"]},
 {front:"Spegnere", back:"Switch off / Turn off / Shut off", speak:["switch off","turn off","shut off"]},
 {front:"Accendere", back:"Switch on / Turn on", speak:["switch on","turn on"]},
 {front:"Togliersi", back:"Take off", speak:["take off"]},
 {front:"Dall’inizio", back:"All along", speak:["all along"]},
 {front:"Dappertutto", back:"All over", speak:["all over"]},
 {front:"Va bene", back:"All right", speak:["all right"]},
 {front:"Come al solito", back:"As usual", speak:["as usual"]},
 {front:"Finalmente", back:"At last", speak:["at last"]},
 {front:"Vestirsi elegante", back:"Dress up", speak:["dress up"]},
 {front:"Scoprire / Informarsi", back:"Find out", speak:["find out"]},
 {front:"Poco a poco", back:"Little by little / Step by step", speak:["little by little","step by step"]},
 {front:"Guardare", back:"Look at", speak:["look at"]},
 {front:"Cercare", back:"Look for, or, Search for", speak:["look for","search for"]},
 {front:"Non importa / Lascia perdere", back:"Never mind / Don't bother", speak:["never mind","don't bother"]},
 {front:"Passo dopo passo", back:"Step by step / Little by little", speak:["step by step","little by little"]},
 {front:"Stancare troppo / Sfinire", back:"Tire out / Wear out", speak:["tire out","wear out"]},
 {front:"Compagno di classe", back:"Classmate", speak:["classmate"]},
 {front:"Nel giro di", back:"In the space of", speak:["in the space of"]},
 {front:"Versare", back:"Pour", speak:["pour"]},
 {front:"Saltare", back:"Skip", speak:["skip"]},
 {front:"Fornire", back:"Supply", speak:["supply"]},
 {front:"Mi raccomando", back:"Whatever you do", speak:["whatever you do"]},
 {front:"Sgranchirsi le gambe", back:"Stretch one’s legs", speak:["stretch one's legs"]},
 {front:"Per l’amor del cielo! / Mamma mia!", back:"For heaven’s sake!", speak:["for heaven's sake"]},
 {front:"Un cavolo / Proprio niente", back:"A damned thing", speak:["a damned thing"]},
 {front:"Identificare", back:"Put one’s finger on something", speak:["put one's finger on something"]},
 {front:"Volevo solo dire", back:"I just wanted to mention", speak:["i just wanted to mention"]},
 {front:"Lascia stare / Non ti preoccupare", back:"Don’t bother / Never mind", speak:["don't bother","never mind"]},
 {front:"Qual è il suo problema?!", back:"What’s wrong with him?!", speak:["what's wrong with him"]},
 {front:"Di fila / Consecutivamente", back:"In a row", speak:["in a row"]},
 {front:"Non posso non essere d’accordo con te", back:"I would have to agree with you", speak:["i would have to agree with you"]}
];

let currentIndex = 0;
let cards = [];
let recentlyShown = []; // tracks recently shown cards
const sessionSize = 15; // number of cards per session
const recentLimit = 15; // how many cards to avoid repeating

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const backBtn   = document.getElementById("backBtn");
const restartBtn= document.getElementById("restartBtn");
const speakBtn  = document.getElementById("speakBtn");

// --- Speech voices setup ---
let voices = [];
let currentSpeakArray = [];
speechSynthesis.onvoiceschanged = () => {
  voices = speechSynthesis.getVoices();
};

// Pick a random card avoiding recently shown
function pickNextCard() {
  const candidates = library.filter(c => !recentlyShown.includes(c));
  if(candidates.length === 0) recentlyShown = []; // reset if all cards recently shown
  const choice = candidates[Math.floor(Math.random() * candidates.length)];
  recentlyShown.push(choice);
  if(recentlyShown.length > recentLimit) recentlyShown.shift(); // keep list manageable
  return choice;
}

// Start a session
function startSession() {
  cards = [];
  for(let i = 0; i < sessionSize; i++){
    cards.push(pickNextCard());
  }
  currentIndex = 0;
  updateCard();
}

// Update the displayed card
function updateCard(){
  flashcard.classList.remove("flipped");
  setTimeout(() => {
    frontText.innerText = cards[currentIndex].front;
    backText.innerText  = cards[currentIndex].back;
    currentSpeakArray   = cards[currentIndex].speak || [];
    counter.innerText   = `${currentIndex+1} / ${cards.length}`;
  }, 150);
}

// Navigation buttons
function nextCard(e){
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % cards.length;
  updateCard();
}

function prevCard(e){
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + cards.length) % cards.length;
  updateCard();
}

/* FLIP */
flashcard.addEventListener("click", ()=> flashcard.classList.toggle("flipped"));
backBtn.addEventListener("click",(e)=>{
  e.stopPropagation();
  flashcard.classList.remove("flipped");
});

/* AUDIO – British male voice with “or” between alternatives */
speakBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if (!currentSpeakArray.length) return;

  speechSynthesis.cancel();

  const ukMale = voices.find(v => v.lang === "en-GB" && /male/i.test(v.name)) || voices.find(v => v.lang === "en-GB");

  let i = 0;

  function speakNext(){
    if (i >= currentSpeakArray.length) return;

    const utter = new SpeechSynthesisUtterance(currentSpeakArray[i]);
    utter.lang = "en-GB";
    if (ukMale) utter.voice = ukMale;

    utter.onend = () => {
      i++;
      if (i < currentSpeakArray.length) {
        const orUtter = new SpeechSynthesisUtterance("or");
        orUtter.lang = "en-GB";
        if (ukMale) orUtter.voice = ukMale;

        orUtter.onend = () => setTimeout(speakNext, 200);
        speechSynthesis.speak(orUtter);
      }
    };

    speechSynthesis.speak(utter);
  }

  speakNext();
});

// Restart session
restartBtn.addEventListener("click", startSession);

// Start first session on page load
startSession();
</script>
