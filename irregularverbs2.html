<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Irregular Verbs – Mobile Flashcards</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --bg-blue:#061247;
  --card-cream:#F7F2E7;
  --it-red:#8C0327;
  --en-blue:#0E065C;
  --border-red:#8C0327;
}

body{
  background:var(--bg-blue);
  font-family:system-ui, Segoe UI, Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:1rem;
  gap:0rem;
}

/* CARD */
.perspective{perspective:1000px;}
.card-inner{
  width:90vw;
  max-width:380px;
  height:55vw;
  max-height:240px;
  position:relative;
  transform-style:preserve-3d;
  transition:.4s;
  cursor:pointer;
}
.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:1rem;
}
.back{transform:rotateY(180deg);}

.it-text{
  color:var(--it-red);
  font-weight:800;
  text-transform:uppercase;
  text-align:center;
  font-size:1.1rem;
}
.en-text{
  color:var(--en-blue);
  font-weight:700;
  text-transform:uppercase;
  text-align:center;
  font-size:1rem;
}

.listen-btn{
  background:none;
  border:none;
  color:var(--it-red);
  font-weight:700;
  font-size:.9rem;
}

/* NAV */
.nav-btn{
  font-size:1.4rem;
  font-weight:700;
  color:white;
}

/* SET BUTTONS */
.set-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:.4rem;
  max-width:380px;
  width:100%;
}

.set-btn{
  padding:.35rem 0;
  font-size:.75rem;
  font-weight:800;
  border-radius:999px;
  background:white;
  color:#0E065C;
  text-align:center;
}

.set-btn.active{
  background:#8C0327;
  color:white;
}
</style>
</head>

<body>

<!-- FLASHCARD -->
<div class="perspective mt-4">
  <div id="flashcard" class="card-inner">

    <!-- FRONT -->
    <div class="face bg-[#F7F2E7] border-4 border-[#8C0327] flex items-center justify-center p-4">
      <div id="front-text" class="it-text"></div>
    </div>

    <!-- BACK -->
    <div class="face back bg-[#F7F2E7] border-4 border-[#8C0327] flex flex-col items-center justify-center gap-3 p-4">
      <div id="back-text" class="en-text"></div>
      <button id="speakBtn" class="listen-btn">🔊 Listen</button>
    </div>

  </div>
</div>

<!-- NAVIGATION -->
<div class="flex justify-between items-center w-full max-w-[380px]">
  <button onclick="prevCard(event)" class="nav-btn">◀</button>
  <span id="counter-display" class="text-white font-bold text-sm">1 / 1</span>
  <button onclick="nextCard(event)" class="nav-btn">▶</button>
</div>

<!-- SET BUTTONS (BELOW CARD) -->
<div class="set-grid mt-2">
  <button class="set-btn" onclick="loadSet(1)">SET 1</button>
  <button class="set-btn" onclick="loadSet(2)">SET 2</button>
  <button class="set-btn" onclick="loadSet(3)">SET 3</button>
  <button class="set-btn" onclick="loadSet(4)">SET 4</button>

  <button class="set-btn" onclick="loadSet(5)">SET 5</button>
  <button class="set-btn" onclick="loadSet(6)">SET 6</button>
  <button class="set-btn" onclick="loadSet(7)">SET 7</button>

  <button class="set-btn" onclick="loadSet(8)">SET 8</button>
  <button class="set-btn" onclick="loadSet(9)">SET 9</button>
  <button class="set-btn" onclick="loadSet(10)">SET 10</button>

  <button class="set-btn" onclick="loadSet(11)">SET 11</button>
</div>

// FLASHCARD LOGIC
let currentSet = 1;
let cards = [];
let index = 0;

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const speakBtn  = document.getElementById("speakBtn");

function loadSet(n){
  currentSet = n;
  cards = sets[n];
  index = 0;
  updateCard();
  highlightSet(n);
}

function highlightSet(n){
  document.querySelectorAll('.set-btn').forEach((btn,i)=>{
    btn.classList.toggle('active', i + 1 === n);
  });
}

function updateCard(){
  flashcard.classList.remove("flipped");
  if(!cards.length){
    frontText.innerText = "—";
    backText.innerText  = "—";
    counter.innerText = "0 / 0";
    return;
  }
  setTimeout(()=>{
    frontText.innerText = cards[index].it;
    backText.innerText  = cards[index].en;
    counter.innerText = `${index + 1} / ${cards.length}`;
  },120);
}

function nextCard(e){
  e.stopPropagation();
  if(!cards.length) return;
  index = (index + 1) % cards.length;
  updateCard();
}

function prevCard(e){
  e.stopPropagation();
  if(!cards.length) return;
  index = (index - 1 + cards.length) % cards.length;
  updateCard();
}

flashcard.addEventListener("click", () =>
  flashcard.classList.toggle("flipped")
);

speakBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if(!cards.length) return;
  const text = cards[index].speak ? cards[index].speak.join(", ") : cards[index].en;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-GB";
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
});
