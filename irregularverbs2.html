<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Irregular Verbs – Mobile Friendly</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg-blue:#061247;
  --card-cream:#F7F2E7;
  --it-red:#8C0327;
  --en-blue:#0E065C;
  --border-red:#8C0327;
}
body{
  background:var(--bg-blue);
  font-family:system-ui,Segoe UI,Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:1rem;
  gap:1rem;
}
.perspective{perspective:1000px;}
.card-inner{
  transition:.4s;
  transform-style:preserve-3d;
  width:90vw;
  max-width:400px;
  height:55vw;
  max-height:250px;
  position:relative;
  cursor:pointer;
}
.flipped{transform:rotateY(180deg);}
.face{backface-visibility:hidden;position:absolute;inset:0;border-radius:1rem;}
.back{transform:rotateY(180deg);}
.it-text{color:var(--it-red);font-weight:800;text-transform:uppercase;text-align:center;font-size:1.2rem;}
.en-text{color:var(--en-blue);font-weight:700;text-transform:uppercase;text-align:center;font-size:1rem;}
.listen-btn{background:none;color:var(--it-red);border:none;font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:5px;}
.nav-btn{text-lg;font-weight:700;}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0.5rem;
}
@media (max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr);}
  .it-text{font-size:1rem;}
  .en-text{font-size:.9rem;}
  .card-inner{height:60vw;}
}
</style>
</head>
<body>

<!-- SET BUTTONS -->
<div class="grid mb-4">
  <button onclick="loadSet(1)" class="set-btn px-3 py-1 rounded-full bg-white text-[#0E065C] font-bold">SET 1</button>
  <button onclick="loadSet(2)" class="set-btn px-3 py-1 rounded-full bg-white text-[#0E065C] font-bold">SET 2</button>
  <button onclick="loadSet(3)" class="set-btn px-3 py-1 rounded-full bg-white text-[#0E065C] font-bold">SET 3</button>
  <button onclick="loadSet(4)" class="set-btn px-3 py-1 rounded-full bg-white text-[#0E065C] font-bold">SET 4</button>
  <button onclick="loadSet(5)" class="set-btn px-3 py-1 rounded-full bg-white text-[#0E065C] font-bold">SET 5</button>
  <button onclick="loadSet(6)" class="set-btn px-3 py-1 rounded-full bg-white text-[#0E065C] font-bold">SET 6</button>
  <button onclick="loadSet(7)" class="set-btn px-3 py-1 rounded-full bg-white text-[#0E065C] font-bold">SET 7</button>
  <button onclick="loadSet(8)" class="set-btn px-3 py-1 rounded-full bg-white text-[#0E065C] font-bold">SET 8</button>
  <button onclick="loadSet(9)" class="set-btn px-3 py-1 rounded-full bg-white text-[#0E065C] font-bold">SET 9</button>
  <button onclick="loadSet(10)" class="set-btn px-3 py-1 rounded-full bg-white text-[#0E065C] font-bold">SET 10</button>
  <button onclick="loadSet(11)" class="set-btn px-3 py-1 rounded-full bg-white text-[#0E065C] font-bold">SET 11</button>
</div>

<!-- FLASHCARD -->
<div class="perspective mt-4">
  <div id="flashcard" class="card-inner">
    <div class="face bg-[#F7F2E7] border-4 border-[#8C0327] flex flex-col justify-center items-center p-3">
      <div id="front-text" class="it-text"></div>
    </div>
    <div class="face back bg-[#F7F2E7] border-4 border-[#8C0327] p-3 flex flex-col justify-center items-center">
      <div id="back-text" class="en-text mb-2"></div>
      <button id="speakBtn" class="listen-btn">🔊 Listen</button>
    </div>
  </div>
</div>

<div class="flex justify-between w-11/12 max-w-md mt-2">
  <button onclick="prevCard(event)" class="nav-btn text-white">◀</button>
  <span id="counter-display" class="text-white font-bold">1 / 16</span>
  <button onclick="nextCard(event)" class="nav-btn text-white">▶</button>
</div>

// ---------- FLASHCARD LOGIC ----------
let currentSet = 1;
let cards = sets[currentSet];
let index = 0;

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const speakBtn  = document.getElementById("speakBtn");

function loadSet(n){
  currentSet = n;
  cards = sets[n];
  index = 0;
  updateCard();
  highlightButton(n);
}

function highlightButton(n){
  document.querySelectorAll('.set-btn').forEach((btn,i)=>{
    btn.style.backgroundColor = (i+1 === n) ? "#061247" : "#fff";
    btn.style.color = (i+1 === n) ? "#fff" : "#0E065C";
  });
}

function updateCard(){
  flashcard.classList.remove("flipped");
  setTimeout(()=>{
    frontText.innerText = cards[index].it;
    backText.innerText  = cards[index].en;
    counter.innerText = `${index+1} / ${cards.length}`;
  },150);
}

function nextCard(e){
  e.stopPropagation();
  index = (index+1) % cards.length;
  updateCard();
}

function prevCard(e){
  e.stopPropagation();
  index = (index-1+cards.length) % cards.length;
  updateCard();
}

flashcard.addEventListener("click",()=>flashcard.classList.toggle("flipped"));

speakBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  const textToSpeak = cards[index].speak ? cards[index].speak.join(", ") : cards[index].en;
  const utter = new SpeechSynthesisUtterance(textToSpeak);
  utter.lang = "en-GB";
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
});

loadSet(1);
</script>
</body>
</html>
