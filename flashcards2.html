<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS - Stage 2 Compact</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root {
    --brand-navy:#002147;
    --brand-gold:#CFC752;
    --custom-purple:#561386;
    --counter-blue:#a3d2f2;
}

body{
    background:var(--custom-purple);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    overflow:hidden;
}

/* 3D card styles */
.perspective-1000{perspective:1000px;}
.preserve-3d{transform-style:preserve-3d;}
.backface-hidden{backface-visibility:hidden;}
.rotate-y-180{transform:rotateY(180deg);}
.flip-card-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);}
.flipped{transform:rotateY(180deg);}

/* Text styles */
.phrase-front{font-size:2.4rem; line-height:1.1; font-weight:700; color:var(--brand-navy);}
.phrase-back{font-size:2.75rem; line-height:1.05; font-weight:800;}

/* Navigation buttons */
.nav-btn{
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--brand-navy); font-weight:900;
}
.nav-btn:active{transform:scale(.9);}

/* Counter */
#counter-display{
    background:var(--counter-blue);
    padding:0 8px;
    border-radius:8px;
    color: var(--brand-navy);
    font-weight:900;
}

/* BACK button */
.back-btn{
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:.9rem;
}
.back-btn:active{transform:scale(.95); opacity:.8;}

/* Restart / Try Again button */
.restart-btn{
    margin-top:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:8px 18px;
    border-radius:999px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:.75rem;
    opacity:.85;
}
.restart-btn:hover{opacity:1;}
.restart-btn:active{transform:scale(.95);}

/* Mobile adjustments */
@media (max-width:480px){
    .phrase-front{font-size:1.3rem;}
    .phrase-back{font-size:1.6rem;}
    #flashcard{min-height:350px;}
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-[420px] perspective-1000">
<div id="flashcard" class="relative w-full h-[360px] preserve-3d flip-card-inner cursor-pointer shadow-2xl rounded-3xl">

<!-- FRONT -->
<div class="absolute inset-0 bg-white backface-hidden rounded-3xl flex flex-col justify-between p-5 border">
    <div class="text-[10px] font-black text-[#561386]/50 uppercase tracking-widest text-right">Stage 2</div>

    <div class="flex-grow flex items-center justify-center text-center px-2">
        <p id="front-text" class="phrase-front"></p>
    </div>

    <div class="flex flex-col items-center space-y-2">
        <div class="text-[#800000] text-[11px] font-black uppercase tracking-[0.2em]">
            Tap / Click to reveal
        </div>

        <div class="flex items-center space-x-4 ui-accent-bg px-3 py-1 rounded-full">
            <button onclick="prevCard(event)" class="nav-btn">◀</button>
            <span id="counter-display" class="text-[11px] font-black">1 / 15</span>
            <button onclick="nextCard(event)" class="nav-btn">▶</button>
        </div>
    </div>
</div>

<!-- BACK -->
<div class="absolute inset-0 bg-[#002147] text-white backface-hidden rotate-y-180 rounded-3xl flex flex-col justify-between p-5 border-b-8 border-[#CFC752]">

    <div class="flex-grow flex items-center justify-center text-center px-2">
        <p id="back-text" class="phrase-back italic"></p>
    </div>

    <div class="flex justify-center pb-2">
        <button id="backBtn" class="back-btn">Tap / Click to go back</button>
    </div>
</div>

</div>
</div>

<!-- Try Again -->
<button id="restartBtn" class="restart-btn flex items-center justify-center gap-2">
    <span class="text-lg">⟳</span>
    <span>Try again</span>
</button>

<script>
// Stage 2 library
const library=[
{front:"Dare per scontato",back:"To take for granted"},
{front:"Andare in panne / Crollare",back:"To break down"},
{front:"Chiarissimo / Ovvio",back:"Clear cut"},
{front:"Infatti / A dire il vero",back:"As a matter of fact"},
{front:"Avere voglia di",back:"To fancy doing"},
{front:"Non vedere l’ora di",back:"To look forward to"},
{front:"Prendere in giro",back:"To make fun of"},
{front:"Alla rovescia",back:"Inside out"},
{front:"Compilare",back:"To fill out / To fill in"},
{front:"Fuori controllo",back:"Out of hand"},
{front:"A detta di tutti",back:"By all accounts"},
{front:"Assomigliare a",back:"To take after"},
{front:"Accettare (un invito)",back:"To take up (an invitation)"},
{front:"Approfittare di",back:"To take advantage of"},
{front:"Abbassare / Rifiutare",back:"To turn down"},
{front:"Va da sé",back:"It goes without saying"},
{front:"Autorizzato / Libero",back:"At liberty"},
{front:"Mettersi di mezzo",back:"To get in one’s way"},
{front:"Sul punto di",back:"On the brink/verge of"},
{front:"Distinguere",back:"To tell apart"},
{front:"Lungi da me",back:"Far be it from me"},
{front:"Scendere (prezzi)",back:"To come down"},
{front:"Ospitare / Costruire",back:"To put up"},
{front:"Sopportare",back:"To put up with"},
{front:"Avvicinarsi",back:"To come up to"},
{front:"Imbattersi in / Dare l’impressione",back:"To come across"},
{front:"Fare scalo",back:"To stop over"},
{front:"Rappresentare / Tollerare",back:"To stand for"},
{front:"Redigere / Stilare",back:"To draw up"},
{front:"Incontrare per caso",back:"To run into"},
{front:"Prefissato di fare",back:"To set out to do"},
{front:"Essere appassionato di",back:"To be into"},
{front:"Dare sui nervi",back:"To get on one’s nerves"},
{front:"In anticipo",back:"Ahead of schedule"},
{front:"Accontentarsi / Farsi bastare di",back:"To make do with"},
{front:"Optare per / Vendere",back:"To go for"},
{front:"A dir poco",back:"To say the least"},
{front:"Benedizione sotto mentite spoglie",back:"Blessing in disguise"},
{front:"Provocare / Dare fastidio",back:"To mess with"},
{front:"Ripensamenti",back:"Second thoughts"},
{front:"A due passi",back:"A stone’s throw"},
{front:"Ultimamente",back:"Of late"},
{front:"Meno male",back:"Just as well"},
{front:"Spietato",back:"Ruthless"},
{front:"In breve",back:"For short"},
{front:"Estroverso",back:"Outgoing"},
{front:"Sospiro di sollievo",back:"Sigh of relief"},
{front:"Equivalere a",back:"To amount to"},
{front:"Qual è la fregatura?",back:"What’s the catch?"},
{front:"Prendila con calma",back:"To take it easy"},
{front:"Che fine ha fatto...?",back:"What’s become of...?"},
{front:"Sentire qualcuno",back:"To hear from"},
{front:"Richiedere / Passare a prendere",back:"To call for"},
{front:"Essere destinato a",back:"To be bound to"},
{front:"In linea con",back:"In keeping with"},
{front:"Se tutto va bene",back:"All being well"},
{front:"Non c’è da stupirsi",back:"No wonder"},
{front:"Essere benestante",back:"To be well-off"},
{front:"Separarsi da",back:"To part ways with"},
{front:"Avere una possibilità",back:"To stand a chance"},
{front:"Ad occhio e croce",back:"At a guess"},
{front:"Disprezzare",back:"To look down on"},
{front:"Osservare / Considerare",back:"To look on"},
{front:"Screditare / Rivelare",back:"To show up"},
{front:"In ritardo",back:"Behind schedule"},
{front:"A cavallo di",back:"On either side of"},
{front:"Venire a sapere di",back:"To get wind of"},
{front:"Giorno dopo giorno",back:"Day in and day out"},
{front:"Risultare / Diventare",back:"To turn out"},
{front:"Tenere a mente",back:"To bear in mind"},
{front:"Secondo (qualcuno)",back:"According to"},
{front:"Di gran lunga",back:"By far"},
{front:"Tutt’altro",back:"Far from it"},
{front:"Ammontare a / Rinvenire",back:"To come to"},
{front:"Rinunciare",back:"To give up"},
{front:"Occupare (spazio, tempo)",back:"To take up"},
{front:"Iniziare (attività)",back:"To take up"}
];

let cards=[], pool=[], currentIndex=0;
const flashcard=document.getElementById("flashcard");
const frontText=document.getElementById("front-text");
const backText=document.getElementById("back-text");
const counter=document.getElementById("counter-display");
const backBtn=document.getElementById("backBtn");
const restartBtn=document.getElementById("restartBtn");

function startSession(){
    if(pool.length<15) pool=[...library].sort(()=>0.5-Math.random());
    cards=pool.splice(0,15); currentIndex=0; updateCard();
}

function updateCard(){
    flashcard.classList.remove("flipped");
    setTimeout(()=>{
        frontText.innerText=cards[currentIndex].front;
        backText.innerText=cards[currentIndex].back;
        counter.innerText=`${currentIndex+1} / ${cards.length}`;
    },150);
}

function nextCard(e){ e.stopPropagation(); currentIndex=(currentIndex+1)%cards.length; updateCard(); }
function prevCard(e){ e.stopPropagation(); currentIndex=(currentIndex-1+cards.length)%cards.length; updateCard(); }

flashcard.addEventListener("click",()=>flashcard.classList.toggle("flipped"));
backBtn.addEventListener("click",(e)=>{ e.stopPropagation(); flashcard.classList.remove("flipped"); });
restartBtn.addEventListener("click",startSession);

startSession();
</script>

</body>
</html>
