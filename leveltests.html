  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-top:10px;

.sound-btn{

  background:#f3f3f3;

  font-size:0.8rem;

  transition:0.1s;
}
.sound-btn:active{
  transform:scale(0.95);
}


/* CARD */

.card{

  width:90vw;
  max-width:380px;

  min-height:190px;
  height:auto;

}
/* CARD TEXT */

.question-text{

  font-weight:800;

  color:var(--bg-blue);

}

/* HEADER */

.answers-header{

  width:90vw;

}

#score{

}

/* NEXT BUTTON */

.next-btn{

  font-weight:800;

  border:none;

  border-radius:10px;

  height:32px;

  padding:0 16px;

  font-size:0.8rem;

  transition:0.1s;
}

.next-btn:active{
  transform:scale(0.95);
}

/* ANSWERS */

.answers{

  width:90vw;
  max-width:380px;

  display:flex;
  flex-direction:column;

  gap:8px;

  margin-top:12px;
}

.answer-btn{

  width:100%;

  min-height:52px;

  background:#eef2f7;

  color:var(--front-purple);

  font-weight:700;

  border-radius:10px;

  border:none;

  display:flex;
  align-items:center;

  text-align:left;

  padding:10px 12px;

  font-size:0.95rem;

  line-height:1.3;

  transition:0.1s;

.answer-btn:active{
  transform:scale(0.95);
}

/* CORRECT / WRONG */

.correct{
  background:#22c55e;
  color:white;
}

.wrong{
  background:#ef4444;
  color:white;
}

  max-width:380px;

  flex-direction:column;

  gap:10px;

/* SOUND SYSTEM */

let soundEnabled = true;

function playSound(sound){

  if(!soundEnabled) return;

  document.querySelectorAll("audio")
  .forEach(a=>{

    a.pause();

    a.currentTime = 0;

  });

  sound.play();
}

const soundToggle =
document.getElementById("soundToggle");

soundToggle.onclick = ()=>{

  soundEnabled = !soundEnabled;

};

  ">

/* GLOBALS */

let currentLevel = "";
let currentQuiz = [];
let index = 0;
let score = 0;

let timer;
let timeLeft = 360;
let isTestMode = false;

/* SHUFFLE */

function shuffle(arr){

  let newArr = [...arr];

  for(let i = newArr.length - 1; i > 0; i--){

    const j = Math.floor(Math.random() * (i + 1));

    [newArr[i],newArr[j]] = [newArr[j],newArr[i]];

  }

  return newArr;
}

/* LOAD LEVEL */

function loadLevel(level, btn){

  currentLevel = level;

  document.querySelectorAll(".level-btn")
    .forEach(b=>b.classList.remove("selected-level"));

  btn.classList.add("selected-level");

  document.getElementById("levelsContainer")
    .classList.add("hidden");

document.getElementById("backButton")
  .classList.add("hidden");

  document.getElementById("question").innerHTML =
    quizzes[level].intro;

  document.getElementById("question").innerHTML +=
`<br>

<div style="
display:flex;
justify-content:space-between;
align-items:center;
font-weight:900;
font-size:1rem;
letter-spacing:1px;
margin-top:-10px;
">

  <div
  onclick="showLevelMenu()"
  style="
    cursor:pointer;
    color:#0b5d34;
  ">

    ← MENU

  </div>

  <div
  onclick="startQuiz()"
  style="
    cursor:pointer;
    color:darkred;
  ">

    START QUIZ →

  </div>

</div>`;

}
/* START QUIZ */

function startQuiz(){

  let questionLimit = 15;

  isTestMode = false;

  if(
    currentLevel === "6B" ||
    currentLevel === "7"
  ){
    questionLimit = 10;
  }

  if(
    currentLevel === "A2TEST" ||
    currentLevel === "B1TEST" ||
    currentLevel === "B2TEST"
  ){
    questionLimit = 20;
    isTestMode = true;
  }

  currentQuiz =
    shuffle(quizzes[currentLevel].questions).slice(0, questionLimit);

  index = 0;
  score = 0;

  document.getElementById("nextBtn")
  .classList.add("hidden");

  document.getElementById("header")
    .classList.remove("hidden");

  document.getElementById("answers")
    .classList.remove("hidden");

  document.getElementById("endButtons")
    .classList.add("hidden");



  if(isTestMode){

    timeLeft = 360;

    document.getElementById("timerDisplay").style.visibility = "visible";

    updateTimer();

    clearInterval(timer);

    timer = setInterval(function(){

      timeLeft--;

      updateTimer();

      if(timeLeft <= 0){

        clearInterval(timer);

        endQuiz();

      }

    },1000);

  }else{

    document.getElementById("timerDisplay").style.visibility = "hidden";

  }

  showQuestion();
}

/* TIMER DISPLAY */

function updateTimer(){

  let minutes =
    Math.floor(timeLeft / 60);

  let seconds =
    timeLeft % 60;

  if(seconds < 10){
    seconds = "0" + seconds;
  }

  document.getElementById("timerDisplay")
    .innerHTML = minutes + ":" + seconds;
}




/* SHOW QUESTION */

function showQuestion(){

  const q = currentQuiz[index];

  document.getElementById("question").innerText =
    q.question;

  const answersDiv =
    document.getElementById("answers");

  answersDiv.innerHTML = "";

  q.options.forEach((opt,i)=>{

    const btn = document.createElement("button");

    btn.className = "answer-btn";

    btn.innerHTML =
      `<span style="
      color:darkred;
      font-weight:800;
      width:28px;
      display:inline-block;
      ">
      ${["a)","b)","c)","d)"][i]}
      </span>${opt}`;

    btn.onclick = ()=>checkAnswer(i,q.answer);

    answersDiv.appendChild(btn);

  });

  document.getElementById("nextBtn")
  .classList.remove("hidden");

document.getElementById("nextBtn").disabled = true;

  updateHeader();
}

/* CHECK ANSWER */

function checkAnswer(selected,correct){

  const buttons =
    document.querySelectorAll(".answer-btn");

  const correctSound =
    document.getElementById("correctSound");

  const wrongSound =
    document.getElementById("wrongSound");

  buttons.forEach((btn,i)=>{

    if(i === correct){
      btn.classList.add("correct");
    }

    if(i === selected && selected !== correct){
      btn.classList.add("wrong");
    }

    btn.disabled = true;

  });

  if(selected === correct){

    score++;

    playSound(correctSound);

  } else {

    playSound(wrongSound);

  }

  document.getElementById("nextBtn").disabled = false;

  updateHeader();
}


/* UPDATE HEADER */

function updateHeader(){

  document.getElementById("counter").innerText =
    `${index + 1} / ${currentQuiz.length}`;

  document.getElementById("score").innerText =
    `${score} / ${currentQuiz.length}`;
}

/* NEXT */

document.getElementById("nextBtn").onclick = ()=>{

  if(index === currentQuiz.length - 1){

    endQuiz();

    return;
  }

  index++;

  showQuestion();
};

/* END QUIZ */

function endQuiz(){

  clearInterval(timer);

  document.getElementById("timerDisplay")
    .style.visibility = "hidden";

   const percent =
    (score / currentQuiz.length) * 100;

  const passSound =
    document.getElementById("passSound");

  const failSound =
    document.getElementById("failSound");

  document.getElementById("answers")
    .classList.add("hidden");

  document.getElementById("header")
    .classList.add("hidden");

  document.getElementById("endButtons")
    .classList.remove("hidden");

  if(percent >= 70){

    document.getElementById("question").innerHTML =

    `
    <div style="
    color:#061247;
    font-weight:900;
    line-height:1.4;
    ">

    WELL DONE! YOU'VE PASSED! 🎉

    <br><br>

    <span style="
    font-size:0.95rem;
    ">

    YOUR SCORE:
    <span style="color:darkred;">

    ${score} / ${currentQuiz.length}

    </span>

    </span>

    </div>
    `;

    playSound(passSound);

  } else {

    document.getElementById("question").innerHTML =

    `
    <div style="
    color:#061247;
    font-weight:900;
    line-height:1.4;
    ">

    BAD LUCK! TRY AGAIN ❌

    <br><br>

    <span style="
    font-size:0.95rem;
    ">

    YOUR SCORE:
    <span style="color:darkred;">

    ${score} / ${currentQuiz.length}

    </span>

    </span>

    </div>
    `;

    playSound(failSound);

  }

}

/* LEVEL MENU */

function showLevelMenu(){

  document.getElementById("levelsContainer")
    .classList.remove("hidden");

document.getElementById("backButton")
  .classList.remove("hidden");

  document.getElementById("answers")
    .classList.add("hidden");

  document.getElementById("header")
    .classList.add("hidden");

  document.getElementById("endButtons")
    .classList.add("hidden");

  document.getElementById("question").innerHTML =
    `CHOOSE YOUR LEVEL`;

}
