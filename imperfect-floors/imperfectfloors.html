let cards=[]
let index=0
let currentFloor=1
let mode="floor"
let currentAudio=null

let recentCards=[]
const RECENT_LIMIT=20

const flashcard=document.getElementById("flashcard")
const frontText=document.getElementById("front-text")
const backText=document.getElementById("back-text")
const counter=document.getElementById("counter-display")
const speakBtn=document.getElementById("speakBtn")
const floorLabel=document.getElementById("floor-label")

/* ================= SHUFFLE ================= */

function shuffle(arr){
const a=[...arr]
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1))
let temp=a[i]
a[i]=a[j]
a[j]=temp
}
return a
}

/* ================= BUTTON HIGHLIGHT ================= */

function activateButton(n){
document.querySelectorAll(".set-btn").forEach(btn=>{
btn.classList.remove("active")
})

if(mode==="test"){
document.getElementById("test-btn").classList.add("active")
}else{
document.querySelectorAll(".set-btn")[n-1].classList.add("active")
}
}

/* ================= LOAD FLOOR ================= */

window.loadSet=function(n){

mode="floor"
currentFloor=n

let weightedPool=[]

sets[n].forEach(card=>{
if(recentCards.includes(card)){
if(Math.random()<0.3){
weightedPool.push(card)
}
}else{
weightedPool.push(card)
}
})

if(weightedPool.length<10){
weightedPool=[...sets[n]]
}

let selected=shuffle(weightedPool).slice(0,10)

cards=selected.map(card=>{
let originalIndex=sets[n].indexOf(card)+1
return {
...card,
audio:`audio/floor${n}/F${n}-${String(originalIndex).padStart(3,'0')}.mp3`
}
})

recentCards=[...recentCards,...cards].slice(-RECENT_LIMIT)

index=0

activateButton(n)
updateCard()
}

/* ================= TEST MODE ================= */

window.loadTest=function(){

mode="test"

let combined=[]

for(let i=1;i<=11;i++){
if(sets[i]){
sets[i].forEach((card,idx)=>{
combined.push({
...card,
floor:i,
audio:`audio/floor${i}/F${i}-${String(idx+1).padStart(3,'0')}.mp3`
})
})
}
}

cards=shuffle(combined).slice(0,30)

index=0

activateButton()
updateCard()
}

/* ================= REFRESH ================= */

window.refreshCurrentSet=function(){
if(mode==="floor"){
loadSet(currentFloor)
}else{
loadTest()
}
}

/* ================= UPDATE CARD ================= */

function updateCard(){
flashcard.classList.remove("flipped")

const c=cards[index]

frontText.innerText=c.front.toUpperCase()
backText.innerText=c.back.toUpperCase()

if(mode==="floor"){
floorLabel.innerText="FLOOR "+currentFloor
}else{
floorLabel.innerText="FLOOR "+c.floor
}

counter.innerText=(index+1)+" / "+cards.length
}

/* ================= NAVIGATION ================= */

window.nextCard=function(){
index=(index+1)%cards.length
updateCard()
}

window.prevCard=function(){
index=(index-1+cards.length)%cards.length
updateCard()
}

/* ================= CARD FLIP ================= */

flashcard.addEventListener("click",()=>{
flashcard.classList.toggle("flipped")
})

/* ================= AUDIO ================= */

speakBtn.addEventListener("click",(e)=>{

e.stopPropagation()

if(currentAudio){
currentAudio.pause()
currentAudio.currentTime=0
}

currentAudio=new Audio(cards[index].audio)
currentAudio.play()

})

/* ================= INITIAL LOAD ================= */

loadSet(1)

</script>

</html>
