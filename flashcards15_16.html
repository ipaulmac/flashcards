<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS - Lessons 15 & 16 Compact</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
    --brand-navy:#002147;
    --brand-gold:#CFC752;
    --custom-purple:#561386;
}

body{
    background:var(--custom-purple);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    overflow:hidden;
}

.perspective-1000{perspective:1000px;}
.preserve-3d{transform-style:preserve-3d;}
.backface-hidden{backface-visibility:hidden;}
.rotate-y-180{transform:rotateY(180deg);}
.flip-card-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);}
.flipped{transform:rotateY(180deg);}

.phrase-front{
    font-size:2.4rem;line-height:1.1;
    font-weight:700;color:#fff;
}
.phrase-back{
    font-size:2.75rem;line-height:1.05;
    font-weight:800;color:var(--brand-navy);
}

.nav-btn{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
}
.nav-btn:active{transform:scale(.9);}

.back-btn{
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:.9rem;
}

.restart-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:.85rem;
    margin-top:1rem;
}

.speaker-btn{
    background:none;
    border:2px solid var(--brand-navy);
    color:var(--brand-navy);
    padding:4px 10px;
    border-radius:999px;
    font-weight:700;
    font-size:.8rem;
}

@media(max-width:480px){
    .phrase-front{font-size:1.4rem;}
    .phrase-back{font-size:1.7rem;}
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-[420px] perspective-1000">
<div id="flashcard" class="relative w-full h-[360px] preserve-3d flip-card-inner cursor-pointer shadow-2xl rounded-3xl">

<!-- FRONT -->
<div class="absolute inset-0 bg-[#002147] backface-hidden rounded-3xl flex flex-col justify-between p-5 border">

    <div class="text-[10px] font-black text-white/50 uppercase tracking-widest text-right">
        Lessons 15 & 16
    </div>

    <div class="flex-grow flex items-center justify-center text-center px-2">
        <p id="front-text" class="phrase-front"></p>
    </div>

    <div class="flex flex-col items-center space-y-2">
        <div class="text-white text-[11px] font-black uppercase tracking-[0.2em]">
            Tap / Click to reveal
        </div>

        <div class="flex items-center space-x-4 bg-white px-3 py-1 rounded-full">
            <button onclick="prevCard(event)" class="nav-btn text-[#002147]">◀</button>
            <span id="counter-display" class="text-[11px] font-black text-[#002147]">
                1 / 15
            </span>
            <button onclick="nextCard(event)" class="nav-btn text-[#002147]">▶</button>
        </div>
    </div>
</div>

<!-- BACK -->
<div class="absolute inset-0 bg-white backface-hidden rotate-y-180 rounded-3xl flex flex-col justify-between p-5 border-b-8 border-[#CFC752]">

    <div class="text-[10px] font-bold text-[#002147]/30 uppercase tracking-widest text-right">
        Translation
    </div>

    <div class="flex-grow flex flex-col items-center justify-center text-center px-2 space-y-3">
        <p id="back-text" class="phrase-back italic"></p>
        <button id="speakerBtn" class="speaker-btn">🔊 Listen</button>
    </div>

    <div class="flex justify-center pb-2">
        <button id="backBtn" class="back-btn">Tap / Click to go back</button>
    </div>
</div>

</div>
</div>

<button id="restartBtn" class="restart-btn">
    &#x21bb; Try again
</button>

<script>
const library = [
  {front:"Al contrario", back:"Back to front"},
  {front:"Aggiornare qualcuno", back:"Fill someone in"},
  {front:"Sostituire qualcuno", back:"Fill in for someone"},
  {front:"Compilare / Riempire moduli", back:"Fill out, or, Fill in"},
  {front:"A lungo termine", back:"In the long run"},
  {front:"In contatto", back:"In touch"},
  {front:"Alla rovescia", back:"Inside out"},
  {front:"Conoscere come le proprie tasche", back:"Know inside out, or, back to front"},
  {front:"Non importa come", back:"No matter how"},
  {front:"Fuori contatto / Fuori dal giro", back:"Out of touch"},
  {front:"Nel verso giusto", back:"Right way round"},
  {front:"Nel verso corretto / Dritto", back:"Right way up"},
  {front:"Approfittare di", back:"Take advantage of"},
  {front:"Assomigliare a / Seguire le orme", back:"Take after"},
  {front:"Iniziare (un passatempo)", back:"Take up"},
  {front:"Sottosopra / Capovolto", back:"Upside down"},
  {front:"A portata di mano", back:"At hand"},
  {front:"Tenere a mente / Ricordarsi", back:"Bear in mind"},
  {front:"A mano", back:"By hand"},
  {front:"Interrompere / Isolato", back:"Cut off"},
  {front:"Eliminare", back:"Cut out"},
  {front:"Ritagliare", back:"Cut out"},
  {front:"Spegnersi (motore)", back:"Cut out"},
  {front:"Per una volta", back:"For once"},
  {front:"Tenere in mente / Considerare", back:"Have, or Keep, in mind"},
  {front:"Sfruttare al meglio", back:"Make the best, or the most, of"},
  {front:"Da una parte", back:"On one hand"},
  {front:"Dall’altra parte", back:"On the other hand"},
  {front:"Andare fuori controllo / Sfuggire di mano", back:"Get out of hand"},
  {front:"Vedere le cose allo stesso modo", back:"See eye to eye"},
  {front:"Vigilia / Giorno prima", back:"Eve"},
  {front:"Sapere benissimo", back:"Know full well"},
  {front:"Accendere (una sigaretta)", back:"Light up"},
  {front:"Mettere i bastoni tra le ruote / Scherzare con", back:"Mess with"},
  {front:"Non si può tornare indietro", back:"There's no going back"},
  {front:"Ultimamente / Di recente", back:"Of late"},
  {front:"Stranezze / Peculiarità", back:"Quirks"},
  {front:"Ripensamenti / Dubbi", back:"Second thoughts"},
  {front:"Partire / Mettersi in viaggio", back:"Set off"},
  {front:"Restare fermo / Non muoversi", back:"Stay put"},
  {front:"Essere solito fare", back:"Be wont to do"},
  {front:"Avere il cuore puntato su / Essere decisi", back:"Have one’s heart set on"},
  {front:"Tutto inutile", back:"To no avail"},
  {front:"Una passeggiata / Facilissimo", back:"Piece of cake!"},
  {front:"Clausole / Testo piccolo", back:"Small print"},
  {front:"Meno male", back:"Just as well"},
  {front:"Essere indecisi / Essere combattuti", back:"Be in two minds"},
  {front:"Il punto è / Il fatto è", back:"The thing is"},
  {front:"Il più delle volte", back:"More often than not"},
  {front:"Febbre da fieno", back:"Hay fever"},
  {front:"Salire alle stelle", back:"Go through the roof!"},
  {front:"Non dire gatto se non l'hai nel sacco", back:"Don't count one’s chickens before they hatch"},
  {front:"Occuparsi dei fatti propri / Non immischiarsi", back:"Mind one’s own business"}
];

let cards=[], pool=[], currentIndex=0;

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const backBtn   = document.getElementById("backBtn");
const restartBtn= document.getElementById("restartBtn");
const speakerBtn= document.getElementById("speakerBtn");

function startSession(){
    pool=[...library].sort(()=>0.5-Math.random());
    cards = pool.slice(0,15);
    currentIndex=0;
    updateCard();
}

function updateCard(){
    flashcard.classList.remove("flipped");
    setTimeout(()=>{
        frontText.innerText = cards[currentIndex].front;
        backText.innerText  = cards[currentIndex].back;
        counter.innerText  = `${currentIndex+1} / ${cards.length}`;
    },150);
}

function nextCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex+1)%cards.length;
    updateCard();
}
function prevCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex-1+cards.length)%cards.length;
    updateCard();
}

flashcard.addEventListener("click",()=>flashcard.classList.toggle("flipped"));
backBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    flashcard.classList.remove("flipped");
});
restartBtn.addEventListener("click",startSession);

function getBritishMaleVoice() {
    const voices = speechSynthesis.getVoices();
    return voices.find(v =>
        v.lang === "en-GB" &&
        /male|daniel|oliver|google uk english male/i.test(v.name)
    ) || voices.find(v => v.lang === "en-GB") || voices[0];
}

speakerBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    const utter = new SpeechSynthesisUtterance(cards[currentIndex].back);
    utter.lang = "en-GB";
    utter.voice = getBritishMaleVoice();
    speechSynthesis.speak(utter);
});

speechSynthesis.onvoiceschanged = () => getBritishMaleVoice();

startSession();
</script>

</body>
</html>
