<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PVIE3 – Lessons 25–36</title>
<!-- update -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --bg-blue:#061247;
  --front-purple:#561386;
  --it-red:#8C0327;
  --en-blue:#0E065C;
}
body{
  background:var(--bg-blue);
  font-family:system-ui, Segoe UI, Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:1rem;
  gap:.3rem;
}
.perspective{perspective:1000px;}
.card-inner{
  width:90vw;
  max-width:380px;
  height:55vw;
  max-height:240px;
  position:relative;
  transform-style:preserve-3d;
  transition:.4s;
  cursor:pointer;
}
.flipped{transform:rotateY(180deg);}
.face{position:absolute; inset:0; backface-visibility:hidden; border-radius:1rem;}
.back{transform:rotateY(180deg);}
.it-text,.en-text{
  font-weight:800;
  text-transform:uppercase;
  text-align:center;
  font-size:1.25rem;
}
.it-text{ color:var(--front-purple); }
.en-text{ color:var(--en-blue); }
.listen-btn{
  background:none;
  border:none;
  color:var(--it-red);
  font-weight:700;
  font-size:.9rem;
}
.nav-btn{
  font-size:1.4rem;
  font-weight:700;
  color:white;
}
.set-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.25rem;
  max-width:380px;
  width:100%;
}

.set-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:7px 0;
  font-size:.75rem;
  font-weight:800;
  border-radius:999px;
  background:white;
  color:#0E065C;
  line-height:1.3;
  text-align:center;
}

.global-btn{
  background:#00cfd5;
  color:#061247;
}

.extras-btn{
  background:#0FF268;
  color:#061247;
}

.inactive-btn{
  background:#A8E6A3;
  color:#061247;
}

@media (max-width: 480px) {
  .set-btn{
    font-size:.65rem;
  }
}

.set-btn.active{
  background:#8C0327;
  color:white;
}

</style>
</head>

<body>

<h2 class="text-white text-lg font-extrabold tracking-widest text-center">
STAGE THREE
</h2>

<div class="perspective mt-4">
  <div id="flashcard" class="card-inner">
    <div class="face bg-white border-4 border-[#8C0327] flex items-center justify-center p-4">
      <div id="front-text" class="it-text"></div>
    </div>
    <div class="face back bg-white border-4 border-[#8C0327] flex flex-col justify-between p-4">
      <div class="flex-grow flex items-center justify-center">
        <div id="back-text" class="en-text"></div>
      </div>
      <div class="flex justify-center pb-2">
        <button id="speakBtn" class="listen-btn">🔊 LISTEN</button>
      </div>
    </div>
  </div>
</div>

<div class="flex justify-between items-center w-full max-w-[380px]">
  <button onclick="prevCard(event)" class="nav-btn">◀</button>
  <span id="counter-display" class="text-white font-bold text-sm">1 / 1</span>
  <button onclick="nextCard(event)" class="nav-btn">▶</button>
</div>

<div class="w-full max-w-[380px] flex justify-center mt-2">
  <button onclick="refreshCurrentSet()"
          class="text-white flex items-center gap-2 px-3 py-1.5 border border-white rounded-full">
    <span class="font-bold text-sm">REFRESH</span>
  </button>
</div>

<div class="set-grid mt-2">
<button class="set-btn" onclick="loadSet('pvie3.1')">LESSON 25</button>
<button class="set-btn" onclick="loadSet('pvie3.2')">LESSON 26</button>
<button class="set-btn inactive-btn">LESSON 27</button>
<button class="set-btn inactive-btn">LESSON 28</button>
<button class="set-btn inactive-btn">LESSON 29</button>
<button class="set-btn inactive-btn">LESSON 30</button>
<button class="set-btn inactive-btn">LESSON 31</button>
<button class="set-btn inactive-btn">LESSON 32</button>
<button class="set-btn inactive-btn">LESSON 33</button>
<button class="set-btn inactive-btn">LESSON 34</button>
<button class="set-btn inactive-btn">LESSON 35</button>
<button class="set-btn inactive-btn">LESSON 36</button>
<button class="set-btn global-btn" onclick="loadGlobal()">TEST 25-36</button>
</div>

};

/* ================= CORE ENGINE ================= */

let cards=[];
let index=0;
let activeMode=null;
let activeFolder=null;

const flashcard=document.getElementById("flashcard");
const frontText=document.getElementById("front-text");
const backText=document.getElementById("back-text");
const counter=document.getElementById("counter-display");
const speakBtn=document.getElementById("speakBtn");

function shuffle(arr){
  const a=[...arr];

  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

function prepareSet(folder){
  return sets[folder].map((card,i)=>({
    ...card,
    folder,
    id:`PVIE3-${String(i+1).padStart(3,"0")}`
  }));
}

window.loadSet = function(folder){
  activeMode="single";
  activeFolder=folder;
  index=0;

  const fullPool=prepareSet(folder);
  cards=shuffle(fullPool).slice(0,12);

  updateCard();
  activateButton(folder);
}

window.loadGlobal = function(){
  activeMode="global";
  activeFolder=null;
  index=0;

  let combined=[];

  Object.keys(sets).forEach(folder=>{
    combined.push(...prepareSet(folder));
  });

  cards=shuffle(combined).slice(0,20);

  updateCard();
  activateButton("GLOBAL");
}

window.refreshCurrentSet = function(){
  if(activeMode==="single"){
    loadSet(activeFolder);
  }else if(activeMode==="global"){
    loadGlobal();
  }
}

function updateCard(){
  flashcard.classList.remove("flipped");

  const c=cards[index];

  frontText.innerText=c.front.toUpperCase();
  backText.innerText=c.back.toUpperCase();
  counter.innerText=`${index+1} / ${cards.length}`;
}

window.nextCard=function(e){
  if(e) e.stopPropagation();
  index=(index+1)%cards.length;
  updateCard();
};

window.prevCard=function(e){
  if(e) e.stopPropagation();
  index=(index-1+cards.length)%cards.length;
  updateCard();
};

flashcard.addEventListener("click",()=>{
  flashcard.classList.toggle("flipped");
});

speakBtn.addEventListener("click",(e)=>{
  e.stopPropagation();

  const c=cards[index];
  const audio=new Audio(`audio/${c.folder}/${c.id}.mp3`);

  audio.play();
});

function activateButton(folder){
  document.querySelectorAll(".set-btn").forEach(btn=>
    btn.classList.remove("active")
  );

  const buttons=document.querySelectorAll(".set-btn");

  const map={
    "pvie3.1":0,
    "pvie3.2":1,
    "pvie3.3":2,
    "pvie3.4":3,
    "pvie3.5":4,
    "pvie3.6":5,
    "pvie3.7":6,
    "pvie3.8":7,
    "pvie3.9":8,
    "pvie3.10":9,
    "pvie3.11":10,
    "pvie3.12":11,
    "GLOBAL":12
  };

  buttons[map[folder]].classList.add("active");
}

/* INITIAL LOAD */

}); 

</script>
</body>
</html>
