/* ================= CORE ENGINE ================= */

let cards=[];
let index=0;
let activeMode=null;
let activeFolder=null;
let selectedFolder = null;
let selectedMode = null;

const flashcard=document.getElementById("flashcard");
const frontText=document.getElementById("front-text");
const backText=document.getElementById("back-text");
const lessonLabel=document.getElementById("lesson-label");
const counter=document.getElementById("counter-display");
const speakBtn=document.getElementById("speakBtn");

window.closeStartPopup = function(){

  document.getElementById("startPopup").style.display = "none";

}

window.openStartPopup = function(folder, mode){

  selectedFolder = folder;
  selectedMode = mode;

  let totalCards = 0;
  let selectedCards = 12;

  if(mode === "single"){

    totalCards = sets[folder].length;


  }else{

    Object.values(sets).forEach(set=>{
      totalCards += set.length;
    });

    selectedCards = 20;

  }

  document.getElementById("popupText").innerHTML =
      `THIS LESSON CONTAINS A TOTAL OF
      <br><strong style="color:#8C0327;">${totalCards}</strong> CARDS
      <br><br>
      OF WHICH
      <br><strong style="color:#8C0327;">${selectedCards}</strong> ARE SELECTED RANDOMLY`;

  document.getElementById("startPopup").style.display = "flex";

}

window.startSelectedSet = function(){

  closeStartPopup();

  if(selectedMode === "single"){

      loadSet(selectedFolder);

  }else{

      loadGlobal();

  }

}

function shuffle(arr){
  const a=[...arr];

  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

function prepareSet(folder){
  return sets[folder].map((card,i)=>({
    ...card,
    folder,
    id:`PVIE3-${String(i+1).padStart(3,"0")}`
  }));
}

window.loadSet = function(folder){
  activeMode="single";
  activeFolder=folder;
  index=0;

  const fullPool=prepareSet(folder);
  cards=shuffle(fullPool).slice(0,12);

  updateCard();
  activateButton(folder);
}

window.loadGlobal = function(){
  activeMode="global";
  activeFolder=null;
  index=0;

  let combined=[];

  Object.keys(sets).forEach(folder=>{
    combined.push(...prepareSet(folder));
  });

  cards=shuffle(combined).slice(0,20);

  updateCard();
  activateButton("GLOBAL");
}

window.refreshCurrentSet = function(){
  if(activeMode==="single"){
    loadSet(activeFolder);
  }else if(activeMode==="global"){
    loadGlobal();
  }
}

function updateCard(){
  flashcard.classList.remove("flipped");

  const c=cards[index];

  frontText.innerText=c.front.toUpperCase();
backText.innerText=c.back.toUpperCase();

const lessonNumber = Number(c.folder.split(".")[1]) + 24;
lessonLabel.innerText = `LESSON ${lessonNumber}`;

counter.innerText=`${index+1} / ${cards.length}`;
}

window.nextCard=function(e){

  if(e) e.stopPropagation();

  if(cards.length===0) return;

  index=(index+1)%cards.length;

  updateCard();

};

window.prevCard=function(e){

  if(e) e.stopPropagation();

  if(cards.length===0) return;

  index=(index-1+cards.length)%cards.length;

  updateCard();

};

flashcard.addEventListener("click",()=>{

  if(cards.length===0) return;

  flashcard.classList.toggle("flipped");

});


speakBtn.addEventListener("click",(e)=>{
  e.stopPropagation();

  const c=cards[index];
  const audio=new Audio(`audio/${c.folder}/${c.id}.mp3`);

  audio.play();
});

function activateButton(folder){
  document.querySelectorAll(".set-btn").forEach(btn=>
    btn.classList.remove("active")
  );

  const buttons=document.querySelectorAll(".set-btn");

  const map={
    "pvie3.1":0,
    "pvie3.2":1,
    "pvie3.3":2,
    "pvie3.4":3,
    "pvie3.5":4,
    "pvie3.6":5,
    "pvie3.7":6,
    "pvie3.8":7,
    "pvie3.9":8,
    "pvie3.10":9,
    "pvie3.11":10,
    "pvie3.12":11,
    "GLOBAL":12
  };

  buttons[map[folder]].classList.add("active");
}

document.getElementById("libraryBackBtn").addEventListener("click", function () {
  window.location.href = "https://www.acceleratedlanguagesystems.com/idiomatic-expressions-booster";
});

/* INITIAL SCREEN */

cards = [];

index = 0;

flashcard.classList.remove("flipped");

frontText.innerText = "CHOOSE YOUR LESSON";

backText.innerText = "";

lessonLabel.innerText = "";

counter.innerText = "0 / 0";

});
</script>

</script>

<div id="startPopup" class="popup">

  <div class="popup-box">

    <div id="popupText"></div>

    <div class="popup-buttons">

      <button type="button"
              class="popup-close"
              onclick="closeStartPopup()">
        CLOSE
      </button>

      <button type="button"
              class="popup-start"
              onclick="startSelectedSet()">
        START
      </button>

    </div>

  </div>

</div>

</body>
</html>
