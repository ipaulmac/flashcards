<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MATCH THE SOUND</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --bg-blue:#061247;
  --front-purple:#561386;
  --it-red:#8C0327;
  --gold:#FFD700;
  --cyan:#00cfd5;
}

body{
  margin:0;
  padding:10px;
  background:var(--bg-blue);
  font-family:system-ui,-apple-system,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* TOP BAR */


.topbar{
width:90vw;
max-width:380px;
display:grid;
grid-template-columns:90px 1fr 90px;
align-items:center;
margin-bottom:8px;
}

.quiz-title{
text-align:center;
font-size:1.15rem;
font-weight:800;
color:#ffffff;
}

.top-right{
display:flex;
justify-content:flex-end;
align-items:center;
}

.library-back-btn{
justify-self:start;
width:68px;
height:32px;
padding:0;
background:#930000;
color:#ffffff;
border:3px solid #ffffff;
border-radius:0;
font-size:.8rem;
font-weight:800;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-sizing:border-box;
}

.library-back-btn:hover{
background:#FFF3A3;
color:#061247;
}

.top-right{
display:flex;
justify-content:flex-end;
align-items:center;
}




/* CARD */
.card{
  width:90vw;
  max-width:380px;
  min-height:175px;
  background:#fff;
  border:4px solid var(--it-red);
  border-radius:1rem;
  padding:14px 12px 40px 12px;
  text-align:center;
  position:relative;
}

.main-word{
  color:var(--front-purple);
  font-weight:900;
  font-size:clamp(1.35rem,5vw,1.8rem);
  line-height:1.1;
  text-transform:uppercase;
  margin-top:18px;
}

.translation{
  color:var(--it-red);
  font-weight:800;
  margin-top:14px;
  font-size:clamp(.95rem,3vw,1.1rem);
  text-transform:uppercase;
}

.word-sound{
  position:absolute;
  right:18px;
  bottom:12px;
  background:none;
  border:none;
  padding:0;
  margin:0;
  cursor:pointer;
  font-weight:900;
  font-size:.92rem;
  color:#061247;
}

/* HEADER */
.answers-header{
  width:90vw;
  max-width:380px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  margin-top:8px;
  margin-bottom:6px;
}

#counter{
  color:#fff;
  font-weight:800;
}

#score{
  color:var(--gold);
  font-weight:800;
  text-align:right;
}

.next-btn,
.sound-btn{
  height:28px;
  padding:0 12px;
  border-radius:8px;
  font-weight:800;
  font-size:.8rem;
  display:flex;
  align-items:center;
  justify-content:center;
}

.next-btn{
  background:var(--cyan);
  color:#061247;
}

.sound-btn{
  background:#fff;
  color:#061247;
}

.readme-text{
color:#FFD54A;
font-weight:900;
font-size:.88rem;
cursor:pointer;
user-select:none;
}

.popup-overlay{
position:fixed;
inset:0;
background:rgba(6,18,71,.88);
display:none;
justify-content:center;
align-items:flex-start;
padding-top:90px;
padding-left:12px;
padding-right:12px;
box-sizing:border-box;
z-index:99999;
}

.readme-popup{
width:80vw;
max-width:360px;
background:#fff;
border:4px solid var(--it-red);
border-radius:16px;
padding:18px;
box-sizing:border-box;
}

.popup-text{
font-size:.82rem;
font-weight:900;
line-height:1.45;
color:#061247;
text-align:left;
}

.popup-close-text{
margin-top:18px;
display:flex;
justify-content:flex-end;
font-size:.9rem;
font-weight:900;
color:#006400;
cursor:pointer;
}





/* ANSWERS */
.answers{
  width:90vw;
  max-width:380px;
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:8px;
}

.answer-btn{
  width:100%;
  min-height:54px;
  background:#eef2f7;
  color:var(--front-purple);
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:10px 12px;
  text-align:left;
  font-weight:700;
  font-size:1rem;
  line-height:1.3;
}

.correct{
  background:#22c55e;
  color:#fff;
}

.wrong{
  background:#ef4444;
  color:#fff;
}

/* POPUP */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:50;
  padding:14px;
}

.hidden{
  display:none;
}

.popup{
  width:92vw;
  max-width:360px;
  background:#fff;
  border-radius:14px;
  padding:14px;
}

.popup-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.popup-word{
  color:var(--front-purple);
  font-weight:900;
}

.popup-line{
  font-size:.92rem;
  line-height:1.4;
  color:#061247;
  font-weight:700;
  margin-top:8px;
}

.popup-it{
  color:var(--it-red);
  font-weight:800;
  text-transform:uppercase;
}

.popup-next{
  text-align:right;
  margin-top:14px;
  color:#061247;
  font-weight:900;
  cursor:pointer;
}

/* RETRY */
.retry-btn{
  all:unset;
  background:var(--front-purple);
  color:#fff;
  font-weight:900;
  padding:8px 18px;
  border-radius:8px;
  margin-top:12px;
  cursor:pointer;
}






</style>
</head>

<div class="topbar">

<br><br>

<span style="color:darkred;">DEFINITIONS</span>

<span style="color:darkred;">SAME PRONUNCIATION / SOUND</span>

THERE ARE

<span style="color:darkred;">5</span>

<br><br>

CLOSE
</div>

</div>

<div id="overlay" class="overlay hidden">
<div class="popup" id="popupBox"></div>

{def:"male child",word:"SON",it:"figlio",speak:"sun"},
{def:"before long",word:"SOON",it:"presto",speak:"soon"},
{def:"cut with a saw",word:"SAWN",it:"segato",speak:"sawn"}
]
}
];
</script>

<script>
let quiz = [];
let index = 0;
let score = 0;
let locked = false;
const synth = window.speechSynthesis;

function playAudio(id){
const a=document.getElementById(id);
a.pause();
a.currentTime=0;
a.play();
}

function speakWord(word){
synth.cancel();
let u=new SpeechSynthesisUtterance(word);
u.lang="en-GB";
u.rate=.9;
synth.speak(u);
}

document.getElementById("wordSoundBtn").onclick=()=>{
speakWord(quiz[index].speak);
};


function shuffle(arr){
let a=[...arr];
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function startQuiz(){
quiz=shuffle(questions).slice(0,5);
index=0;
score=0;
showQuestion();

document.getElementById("answers").style.display="flex";
document.getElementById("wordSoundBtn").style.display="inline-block";
document.getElementById("retryContainer").innerHTML="";
}

function showQuestion(){
locked=false;

const q=quiz[index];

document.getElementById("mainWord").innerText=q.word;
document.getElementById("translation").innerText=q.translation;
document.getElementById("counter").innerText=`${index+1} / ${quiz.length}`;
document.getElementById("score").innerText="";

const wrap=document.getElementById("answers");
wrap.innerHTML="";

q.options.forEach((opt,i)=>{
let btn=document.createElement("button");
btn.className="answer-btn";
btn.textContent = opt.def.replace(/^./, c => c.toUpperCase());
btn.onclick=()=>checkAnswer(i);
wrap.appendChild(btn);
});
}

function checkAnswer(i){

if(locked) return;
locked=true;

const q=quiz[index];
const buttons=document.querySelectorAll(".answer-btn");
const correctIndex=q.options.findIndex(x=>x.correct);

buttons.forEach((btn,n)=>{
btn.disabled=true;
if(n===correctIndex) btn.classList.add("correct");
if(n===i && i!==correctIndex) btn.classList.add("wrong");
});

if(i===correctIndex){
score++;
playAudio("correctSound");
}else{
playAudio("wrongSound");
}

setTimeout(()=>showPopup(i),650);
}

function showPopup(i){

const q=quiz[index];
const chosen=q.options[i];

document.getElementById("popupBox").innerHTML=`

<div class="popup-row">
<div class="popup-word">${q.word}</div>
<button class="sound-btn" onclick="speakWord('${q.speak}')">🔊</button>
</div>

<div class="popup-row">
<div class="popup-word">${chosen.word}</div>
<button class="sound-btn" onclick="speakWord('${chosen.speak}')">🔊</button>
</div>

<div class="popup-line">
${chosen.def} = <b>${chosen.word}</b>
<span class="popup-it">(${chosen.it})</span>
</div>

<div class="popup-next" onclick="nextQuestion()">
NEXT &gt;
</div>

`;

document.getElementById("overlay").classList.remove("hidden");
}

function closePopup(){
document.getElementById("overlay").classList.add("hidden");
}

function nextQuestion(){

document.getElementById("overlay").classList.add("hidden");

if(index===quiz.length-1){
endQuiz();
return;
}

index++;
showQuestion();
}

function endQuiz(){

document.getElementById("answers").style.display="none";
document.getElementById("wordSoundBtn").style.display="none";

let passed=score>=4;

document.getElementById("mainWord").innerText=
passed?"WELL DONE!":"BAD LUCK!";

document.getElementById("translation").innerText=
passed?"YOU PASSED 🎉":"TRY AGAIN ❌";

document.getElementById("score").innerText=`SCORE ${score}/5`;

playAudio(passed?"passSound":"failSound");

document.getElementById("retryContainer").innerHTML=`
<button class="retry-btn" onclick="startQuiz()">
TRY AGAIN
</button>
`;
}

const popupOverlay = document.getElementById("popupOverlay");
const readMeBtn = document.getElementById("readMeBtn");
const closeReadMeBtn = document.getElementById("closePopup");

readMeBtn.addEventListener("click", function () {
    popupOverlay.style.display = "flex";
});

closeReadMeBtn.addEventListener("click", function () {
    popupOverlay.style.display = "none";
});

popupOverlay.addEventListener("click", function (e) {
    if (e.target === popupOverlay) {
        popupOverlay.style.display = "none";
    }
});

document.getElementById("libraryBackBtn").addEventListener("click", function () {
    window.location.href = "https://www.acceleratedlanguagesystems.com/quizzes-booster";
});



startQuiz();
</script>

</body>
</html>
