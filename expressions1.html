<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS – Extra Expressions - Stage One</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --navy:#002147;
  --gold:#CFC752;
  --purple:#561386;
}

body{
  background:var(--purple);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  overflow:hidden;
}

.perspective-1000{perspective:1000px;}
.preserve-3d{transform-style:preserve-3d;}
.backface-hidden{backface-visibility:hidden;}
.rotate-y-180{transform:rotateY(180deg);}
.flip-card-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);}
.flipped{transform:rotateY(180deg);}

.front-text{font-size:2.4rem;line-height:1.1;font-weight:800;color:#fff;}
.back-text{font-size:2.6rem;line-height:1.05;font-weight:800;color:var(--navy);}

.nav-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.nav-btn:active{transform:scale(.9);}

.restart-btn{
  display:flex;align-items:center;justify-content:center;
  background:none;border:2px solid #fff;color:#fff;
  padding:6px 14px;border-radius:999px;
  font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;font-size:.85rem;margin-top:1rem;
}
.restart-btn:active{transform:scale(.95);opacity:.8;}

.audio-btn{
  margin-top:.5rem;
  padding:6px 14px;
  border:2px solid var(--navy);
  border-radius:999px;
  font-weight:800;
  font-size:.8rem;
  letter-spacing:.05em;
  color:var(--navy);
}
.audio-btn:active{transform:scale(.95);opacity:.85;}

@media (max-width:480px){
  .front-text{font-size:1.4rem;}
  .back-text{font-size:1.7rem;}
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-[420px] perspective-1000">
<div id="flashcard" class="relative w-full h-[360px] preserve-3d flip-card-inner cursor-pointer shadow-2xl rounded-3xl">

<!-- FRONT -->
<div class="absolute inset-0 bg-[#002147] backface-hidden rounded-3xl flex flex-col justify-between p-5">
  <div class="text-[10px] font-black text-white/50 uppercase tracking-widest text-right">
  Extra Expressions – Stage One

  </div>

  <div class="flex-grow flex items-center justify-center text-center px-2">
    <p id="front-text" class="front-text"></p>
  </div>

  <div class="flex flex-col items-center space-y-2">
    <div class="text-white text-[11px] font-black uppercase tracking-[0.2em]">
      Tap / Click to reveal
    </div>

    <div class="flex items-center space-x-4 bg-white px-3 py-1 rounded-full">
      <button onclick="prevCard(event)" class="nav-btn text-[#002147]">◀</button>
      <span id="counter-display" class="text-[11px] font-black text-[#002147]">1 / 15</span>
      <button onclick="nextCard(event)" class="nav-btn text-[#002147]">▶</button>
    </div>
  </div>
</div>

<!-- BACK -->
<div class="absolute inset-0 bg-white backface-hidden rotate-y-180 rounded-3xl flex flex-col justify-between p-5 border-b-8 border-[#CFC752]">
  <div class="text-[10px] font-bold text-[#002147]/40 uppercase tracking-widest text-right">
    Translation
  </div>

  <div class="flex-grow flex flex-col items-center justify-center text-center px-2">
    <p id="back-text" class="back-text italic"></p>
    <button id="speakBtn" class="audio-btn">🔊 Listen</button>
  </div>

  <div class="flex justify-center pb-2">
    <div id="backBtn" class="text-[11px] font-black uppercase tracking-[0.2em] text-[#002147] cursor-pointer">
      Tap / Click to go back
    </div>
  </div>
</div>

</div>
</div>

<!-- RESTART -->
<button id="restartBtn" class="restart-btn">
  &#x21bb; Try again
</button>

<script>
const library = [
 { front: "Purtroppo", back: "I’m afraid", speak: "I'm afraid" },
 { front: "Mi raccomando", back: "Whatever you do", speak: "Whatever you do" },
 { front: "Non vedo un cavolo!", back: "I can't see a damned thing!", speak: "I can't see a damned thing" },
 { front: "Volevo solo dire", back: "I just wanted to mention", speak: "I just wanted to mention" },
 { front: "Quale è il suo problema?", back: "What’s wrong with him?", speak: "What's wrong with him?" },
 { front: "Non posso non essere d’accordo con te", back: "I would have to agree with you", speak: "I would have to agree with you" },
 { front: "Basta farlo!", back: "Just do it!", speak: "Just do it!" },
 { front: "Deve essere pronto per forza", back: "It must surely be ready", speak: "It must surely be ready" },
 { front: "Sono mortificato!", back: "I’m really sorry!", speak: "I'm really sorry!" },
 { front: "Giusto per cambiare", back: "Just for once", speak: "Just for once" },
 { front: "Come mai?", back: "How come?", speak: "How come?" },
 { front: "Chissà perché?", back: "I wonder why?", speak: "I wonder why?" },
 { front: "Spetta a te", back: "It’s your job", speak: "It's your job" },
 { front: "Che ne dici di andare domani?", back: "How about going tomorrow?", speak: "How about going tomorrow?" },
 { front: "Che ne dici se andiamo oggi?", back: "How about us going today?", speak: "How about us going today?" },
 { front: "Può essere altrettanto facile ora quanto prima", back: "It can be just as easy now as it was before", speak: "It can be just as easy now, as it was before" },
 { front: "Peggiorare / Andare a rotoli", back: "Go downhill", speak: "Go downhill" },
 { front: "Per nessun motivo", back: "There's no way!", speak: "There's no way!" },
 { front: "Per fortuna", back: "Thankfully", speak: "Thankfully" },
 { front: "Come mai la finistra è aperta??", back: "Why is it / How come that the window is open?", speak: "Why is it that, or, how come, that the window is open?" },
 { front: "A caldo / Nella foga del momento", back: "In the heat of the moment", speak: "In the heat of the moment" },
 { front: "Stai scherzando?", back: "You must be joking!", speak: "You must be joking!" },
 { front: "Non ti preoccupare. Non dirò nulla / Terrò la bocca chiusa", back: "Don't worry. Mum’s the word", speak: "Don't worry. Mum's the word" },
 { front: "A mente", back: "In one’s head", speak: "In one's head" },
 { front: "Ti è andato molto bene", back: "You were very lucky", speak: "You were very lucky" },
 { front: "Andiamo d’amore e d’accordo", back: "We get on / get along like a house on fire", speak: "We get on, or, we get along, like a house on fire" },
 { front: "Ho bisogno di mangiare qualcosa", back: "I need something inside of me", speak: "I need something inside of me" },
 { front: "Non è da me", back: "It’s unlike me", speak: "It's unlike me" },
 { front: "Sono io / Mi dica (al telefono)", back: "Speaking!", speak: "Speaking!" },
 { front: "Come posso esserti utile?", back: "What can I do for you?", speak: "What can I do for you?" },
 { front: "Ci penso io", back: "Leave it to me", speak: "Leave it, to me" },
 { front: "Per me è la stessa cosa", back: "I’m not bothered either way", speak: "I'm not bothered either way" },
 { front: "Se non ci sono io", back: "If I am not around", speak: "If eye am not around" },
 { front: "Hai ragione", back: "You’ve got a point", speak: "You've got a point" },
 { front: "Fino a nuovo avviso", back: "Until further notice", speak: "Until further notice" },
 { front: "Non si può negare", back: "There is no denying", speak: "There is no denying" }
];

let currentIndex = 0;
let cards = [];
let recentlyShown = []; // tracks recently shown cards
const sessionSize = 12; // number of cards per session
const recentLimit = 15; // how many cards to avoid repeating

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const backBtn   = document.getElementById("backBtn");
const restartBtn= document.getElementById("restartBtn");
const speakBtn  = document.getElementById("speakBtn");

// Pick a random card avoiding recently shown
function pickNextCard() {
  const candidates = library.filter(c => !recentlyShown.includes(c));
  if(candidates.length === 0) recentlyShown = []; // reset if all cards recently shown
  const choice = candidates[Math.floor(Math.random() * candidates.length)];
  recentlyShown.push(choice);
  if(recentlyShown.length > recentLimit) recentlyShown.shift(); // keep list manageable
  return choice;
}

// Start a session
function startSession() {
  cards = [];
  for(let i=0; i<sessionSize; i++){
    cards.push(pickNextCard());
  }
  currentIndex = 0;
  updateCard();
}

// Update the displayed card
function updateCard(){
  flashcard.classList.remove("flipped");
  setTimeout(()=>{
    frontText.innerText = cards[currentIndex].front;
    backText.innerText  = cards[currentIndex].back;
    counter.innerText   = `${currentIndex+1} / ${cards.length}`;
  },150);
}

function nextCard(e){
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % cards.length;
  updateCard();
}

function prevCard(e){
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + cards.length) % cards.length;
  updateCard();
}

/* FLIP */
flashcard.addEventListener("click", ()=> flashcard.classList.toggle("flipped"));
backBtn.addEventListener("click",(e)=>{
  e.stopPropagation();
  flashcard.classList.remove("flipped");
});

/* AUDIO – British male voice */
speakBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  
  // Use the 'speak' field if it exists, otherwise fall back to 'back'
  const textToSpeak = cards[currentIndex].speak || cards[currentIndex].back;
  const utter = new SpeechSynthesisUtterance(textToSpeak);
  utter.lang = "en-GB";

  // Try to find a UK male voice
  const voices = speechSynthesis.getVoices();
  const ukMale = voices.find(v => v.lang === "en-GB" && /male/i.test(v.name));
  if (ukMale) utter.voice = ukMale;

  speechSynthesis.speak(utter);
});

restartBtn.addEventListener("click",startSession);
startSession();
</script>
