<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS - Lessons 3 & 4 Compact</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root {
    --brand-navy:#002147;
    --brand-gold:#CFC752;
    --custom-purple:#561386;
}

body{
    background:var(--custom-purple);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    overflow:hidden;
}

.perspective-1000{perspective:1000px;}
.preserve-3d{transform-style:preserve-3d;}
.backface-hidden{backface-visibility:hidden;}
.rotate-y-180{transform:rotateY(180deg);}
.flip-card-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);}
.flipped{transform:rotateY(180deg);}

.phrase-front{font-size:2.4rem;line-height:1.1;font-weight:700;color:var(--brand-navy);}
.phrase-back{font-size:2.75rem;line-height:1.05;font-weight:800;}

.nav-btn{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
}
.nav-btn:active{transform:scale(.9);}

.ui-accent-bg{background:var(--brand-gold);}
.navy-text{color:var(--brand-navy);}

.back-btn{
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:.9rem;
}
.back-btn:active{transform:scale(.95);opacity:.8;}

.restart-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:.85rem;
    margin-top:1rem;
}
.restart-btn:active{transform:scale(.95);opacity:.8;}

@media (max-width:480px){
    .phrase-front{font-size:1.4rem;}
    .phrase-back{font-size:1.7rem;}
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-[420px] perspective-1000">
<div id="flashcard" class="relative w-full h-[360px] preserve-3d flip-card-inner cursor-pointer shadow-2xl rounded-3xl">

<!-- FRONT -->
<div class="absolute inset-0 bg-white backface-hidden rounded-3xl flex flex-col justify-between p-5 border">
    <div class="text-[10px] font-black text-[#561386]/50 uppercase tracking-widest text-right">Lessons 3 & 4</div>
    <div class="flex-grow flex items-center justify-center text-center px-2">
        <p id="front-text" class="phrase-front"></p>
    </div>

    <div class="flex flex-col items-center space-y-2">
        <div class="text-[#800000] text-[11px] font-black uppercase tracking-[0.2em]">
            Tap / Click to reveal
        </div>

        <div class="flex items-center space-x-4 ui-accent-bg px-3 py-1 rounded-full">
            <button onclick="prevCard(event)" class="nav-btn navy-text">◀</button>
            <span id="counter-display" class="text-[11px] font-black navy-text">1 / 15</span>
            <button onclick="nextCard(event)" class="nav-btn navy-text">▶</button>
        </div>
    </div>
</div>

<!-- BACK -->
<div class="absolute inset-0 bg-[#002147] text-white backface-hidden rotate-y-180 rounded-3xl flex flex-col justify-between p-5 border-b-8 border-[#CFC752]">
    <div class="text-[10px] font-bold text-white/30 uppercase tracking-widest text-right">Translation</div>

    <div class="flex-grow flex items-center justify-center text-center px-2">
        <p id="back-text" class="phrase-back italic"></p>
    </div>

    <div class="flex justify-center pb-2">
        <button id="backBtn" class="back-btn">Tap / Click to go back</button>
    </div>
</div>

</div>
</div>

<button id="restartBtn" class="restart-btn">
    &#x21bb; Try again
</button>

<script>
const library = [
  {front:"Tutto il giorno", back:"All day long"},
  {front:"Andare d’accordo", back:"To get on with / To get along with"},
  {front:"Continuare a fare qualcosa / Andare avanti con qualcosa", back:"To get on with something"},
  {front:"Sdraiarsi", back:"To lie down"},
  {front:"Fare la differenza / Incidere", back:"To make a difference"},
  {front:"Da solo / Per conto proprio", back:"On one’s own"},
  {front:"Di proposito", back:"On purpose"},
  {front:"Scegliere / Selezionare", back:"To pick out"},
  {front:"Sedersi", back:"To sit down"},
  {front:"Alzarsi in piedi", back:"To stand up"},
  {front:"Accomodarsi / Sedersi", back:"To take a seat"},
  {front:"Fare con calma", back:"To take one’s time doing something"},
  {front:"Discutere / Parlare di qualcosa", back:"To talk over"},
  {front:"Almeno", back:"At least"},
  {front:"Cercare qualcuno (online / sull’elenco)", back:"To look somebody up"},
  {front:"Cercare qualcosa (sul dizionario)", back:"To look something up"},
  {front:"Ammirare / Stimare", back:"To look up to"},
  {front:"Per niente / Figurati", back:"Not at all"},
  {front:"Per niente / Minimamente", back:"Not in the least"},
  {front:"Mettere via / Sistemare", back:"To put away"},
  {front:"Finora", back:"So far / Up to now / As of yet"},
  {front:"Prendere parte a / Partecipare a", back:"To take part in"},
  {front:"Avere luogo / Svolgersi", back:"To take place"},
  {front:"Riflettere su / Ripensare a", back:"To think over"},
  {front:"Provare (vestiti)", back:"To try on"},
  {front:"Sperimentare", back:"To try out"},
  {front:"Implorare / Pregare", back:"To beg"},
  {front:"Bocciare / Dare un giudizio negativo", back:"To give the thumbs down"},
  {front:"Nessuna delle due cose", back:"Neither of which"},
  {front:"Avanti", back:"Onward"},
  {front:"Quando si tratta di", back:"When it comes to"},
  {front:"Con preavviso", back:"With notice"},
  {front:"Delinquenti", back:"Troublemakers"},
  {front:"Allagato", back:"Flooded"},
  {front:"Sono mortificato!", back:"I’m really sorry!"},
  {front:"Giusto per cambiare", back:"Just for once"},
  {front:"Come mai?", back:"How come?"},
  {front:"Diretto / Schietto", back:"Forthright"},
  {front:"Perché diavolo…?", back:"Why the hell …?"},
  {front:"A prescindere da", back:"Regardless of"},
  {front:"Chissà perché?", back:"I wonder why?"},
  {front:"Spetta a te (fare)", back:"It’s your job to do…"}
];

let cards=[], pool=[], currentIndex=0;

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const backBtn   = document.getElementById("backBtn");
const restartBtn= document.getElementById("restartBtn");

function startSession(){
    if(pool.length < 15) pool=[...library].sort(()=>0.5-Math.random());
    cards = pool.splice(0,15);
    currentIndex=0;
    updateCard();
}

function updateCard(){
    flashcard.classList.remove("flipped");
    setTimeout(()=>{
        frontText.innerText = cards[currentIndex].front;
        backText.innerText  = cards[currentIndex].back;
        counter.innerText  = `${currentIndex+1} / ${cards.length}`;
    },150);
}

function nextCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex+1)%cards.length;
    updateCard();
}
function prevCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex-1+cards.length)%cards.length;
    updateCard();
}

flashcard.addEventListener("click",()=>flashcard.classList.toggle("flipped"));
backBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    flashcard.classList.remove("flipped");
});
restartBtn.addEventListener("click",startSession);

startSession();
</script>

</body>
</html>
