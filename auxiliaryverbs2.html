<style>
:root{

body{

  display:flex;
  flex-direction:column;
  align-items:center;
  padding:1rem 1rem 0 1rem;
  gap:.3rem;
}

.perspective{perspective:1000px;}

.card-inner{
  width:90vw;
  max-width:380px;
  height:55vw;
  max-height:240px;
  position:relative;
  transform-style:preserve-3d;
  transition:.4s;
  cursor:pointer;
}

.flipped{transform:rotateY(180deg);}
.face{position:absolute; inset:0; backface-visibility:hidden; border-radius:1rem;}
.back{transform:rotateY(180deg);}

.it-text,.en-text{
  font-weight:800;
  text-transform:uppercase;
  text-align:center;
  font-size:1rem;
}

.it-text{ color:var(--front-purple); }
.en-text{ color:var(--en-blue); }

.listen-btn{
  background:none;
  border:none;
  color:var(--it-red);
  font-weight:700;
  font-size:.9rem;
}

.nav-btn{
  font-size:1.4rem;
  font-weight:700;
  color:white;
}

.set-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.4rem;
  max-width:380px;
  width:100%;
}

.set-btn{
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.65rem;
  font-weight:800;
  border-radius:999px;
  background:white;
  color:#0E065C;
  text-align:center;
  padding:4px 6px;
}

.set-btn.active{
  background:#8C0327;
  color:white;
}

.special-set{
  background:#25C3D3;
  color:#061247;
  border:2px solid white;
  box-shadow:0 0 6px rgba(255,255,255,0.4);
  transition:all .2s ease;
}

.special-set:hover{
  transform:translateY(-2px);
  box-shadow:0 0 10px rgba(255,255,255,0.7);
}
</style>
</head>

Object.keys(sets).forEach(setKey => {
  sets[setKey].forEach(card => {
    card.id = `AUX2-${String(globalCounter).padStart(3, "0")}`;
    globalCounter++;
  });
});

let currentSet = 1;
let fullSet = [];
let cards = [];
let index = 0;

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const speakBtn  = document.getElementById("speakBtn");

/* ---------- SHUFFLE ---------- */
function shuffleArray(a){
  const arr = [...a];
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickRandom15(arr){
  if(!arr || !arr.length) return [];
  return shuffleArray(arr).slice(0, Math.min(15, arr.length));
}

/* ---------- LOAD SET ---------- */
function loadSet(n){
  currentSet = n;
  if(!sets || !sets[n]) return;

  fullSet = sets[n].filter(Boolean);
  cards   = pickRandom15(fullSet);
  index = 0;
  updateCard();

  document.querySelectorAll('.set-btn').forEach((btn,i)=>
    btn.classList.toggle('active', i + 1 === n)
  );
}

/* ---------- REFRESH ---------- */
function refreshCurrentSet(){
  if(!fullSet.length) return;
  cards = pickRandom15(fullSet);
  index = 0;
  updateCard();
}

/* ---------- DISPLAY ---------- */
function updateCard(){
  flashcard.classList.remove("flipped");

  if(!cards.length){
    frontText.innerText = "—";
    backText.innerText  = "—";
    counter.innerText   = "0 / 0";
    return;
  }

  setTimeout(()=>{
    const c = cards[index];
    frontText.innerText = c.it || c.front || "—";
    backText.innerText  = c.en || c.back  || "—";
    counter.innerText   = `${index + 1} / ${cards.length}`;
  },120);
}

/* ---------- NAV ---------- */
function nextCard(e){
  e?.stopPropagation();
  if(!cards.length) return;
  index = (index + 1) % cards.length;
  updateCard();
}

function prevCard(e){
  e?.stopPropagation();
  if(!cards.length) return;
  index = (index - 1 + cards.length) % cards.length;
  updateCard();
}

/* ---------- FLIP ---------- */
flashcard.addEventListener("click",()=>flashcard.classList.toggle("flipped"));

/* ---------- SPEAK (MP3 SYSTEM) ---------- */
speakBtn.addEventListener("click",(e)=>{
  e.stopPropagation();
  if(!cards.length) return;

  const id = cards[index].id;
  const audio = new Audio(`audio/auxiliaryverbs2/${id}.mp3`);
  audio.play();
});

/* ---------- GLOBAL ---------- */
window.loadSet = loadSet;
window.nextCard = nextCard;
window.prevCard = prevCard;
window.refreshCurrentSet = refreshCurrentSet;

/* ---------- INIT ---------- */
loadSet(1);

});

</script>

</body>
</html>
