<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS - Lessons 17 & 18 Compact</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
    --brand-navy:#002147;
    --brand-gold:#CFC752;
    --custom-purple:#561386;
}

body{
    background:var(--custom-purple);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    overflow:hidden;
}

.perspective-1000{perspective:1000px;}
.preserve-3d{transform-style:preserve-3d;}
.backface-hidden{backface-visibility:hidden;}
.rotate-y-180{transform:rotateY(180deg);}
.flip-card-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);}
.flipped{transform:rotateY(180deg);}

.phrase-front{
    font-size:2.4rem;line-height:1.1;
    font-weight:700;color:#fff;
}
.phrase-back{
    font-size:2.75rem;line-height:1.05;
    font-weight:800;color:var(--brand-navy);
}

.nav-btn{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
}
.nav-btn:active{transform:scale(.9);}

.back-btn{
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:.9rem;
}

.restart-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:.85rem;
    margin-top:1rem;
}

.speaker-btn{
    background:none;
    border:2px solid var(--brand-navy);
    color:var(--brand-navy);
    padding:4px 10px;
    border-radius:999px;
    font-weight:700;
    font-size:.8rem;
}

@media(max-width:480px){
    .phrase-front{font-size:1.4rem;}
    .phrase-back{font-size:1.7rem;}
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-[420px] perspective-1000">
<div id="flashcard" class="relative w-full h-[360px] preserve-3d flip-card-inner cursor-pointer shadow-2xl rounded-3xl">

<!-- FRONT -->
<div class="absolute inset-0 bg-[#002147] backface-hidden rounded-3xl flex flex-col justify-between p-5 border">

    <div class="text-[10px] font-black text-white/50 uppercase tracking-widest text-right">
        Lessons 17 & 18
    </div>

    <div class="flex-grow flex items-center justify-center text-center px-2">
        <p id="front-text" class="phrase-front"></p>
    </div>

    <div class="flex flex-col items-center space-y-2">
        <div class="text-white text-[11px] font-black uppercase tracking-[0.2em]">
            Tap / Click to reveal
        </div>

        <div class="flex items-center space-x-4 bg-white px-3 py-1 rounded-full">
            <button onclick="prevCard(event)" class="nav-btn text-[#002147]">◀</button>
            <span id="counter-display" class="text-[11px] font-black text-[#002147]">
                1 / 15
            </span>
            <button onclick="nextCard(event)" class="nav-btn text-[#002147]">▶</button>
        </div>
    </div>
</div>

<!-- BACK -->
<div class="absolute inset-0 bg-white backface-hidden rotate-y-180 rounded-3xl flex flex-col justify-between p-5 border-b-8 border-[#CFC752]">

    <div class="text-[10px] font-bold text-[#002147]/30 uppercase tracking-widest text-right">
        Translation
    </div>

    <div class="flex-grow flex flex-col items-center justify-center text-center px-2 space-y-3">
        <p id="back-text" class="phrase-back italic"></p>
        <button id="speakerBtn" class="speaker-btn">🔊 Listen</button>
    </div>

    <div class="flex justify-center pb-2">
        <button id="backBtn" class="back-btn">Tap / Click to go back</button>
    </div>
</div>

</div>
</div>

<button id="restartBtn" class="restart-btn">
    &#x21bb; Try again
</button>

<script>
const library = [
  {front:"Soprattutto", back:"Above all"},
  {front:"Che fine ha fatto …?", back:"What’s become of …?"},
  {front:"A detta di tutti", back:"By all accounts"},
  {front:"Per un pelo", back:"In the nick of time"},
  {front:"Va da sé / È inutile dire", back:"It goes without saying"},
  {front:"Tenersi al passo con / Stare al passo", back:"Keep up with"},
  {front:"Complessivamente", back:"Overall"},
  {front:"Prendila con calma", back:"Take it easy"},
  {front:"Rifiutare", back:"Turn down"},
  {front:"Arrivare / Presentarsi", back:"Turn up"},
  {front:"Alzare / Aumentare il volume", back:"Turn up"},
  {front:"Abbassare il volume", back:"Turn down"},
  {front:"Secondo lui", back:"According to him"},
  {front:"In fondo", back:"At heart"},
  {front:"Destinato a / Scontato", back:"Bound to"},
  {front:"Fare a meno di", back:"Do without"},
  {front:"Con certezza", back:"For certain / For sure"},
  {front:"Fare a meno", back:"Go without"},
  {front:"In linea con / In armonia con", back:"In keeping with"},
  {front:"Finire / Esaurire", back:"Run out of"},
  {front:"Scarseggiare / Avere poco di", back:"Run short of"},
  {front:"Svignarsela / Sgusciare via", back:"Slip away"},
  {front:"Entrare un attimo", back:"Slip in"},
  {front:"Sfilarsi", back:"Slip off"},
  {front:"Infilarsi", back:"Slip on"},
  {front:"Uscire un attimo", back:"Slip out"},
  {front:"Prendere per", back:"Take for"},
  {front:"Sarà anche vero ma …", back:"That’s all very well but …"},
  {front:"Vicolo / Stradina", back:"Alley"},
  {front:"Brivido", back:"Chill"},
  {front:"Venire alla luce / Emergere", back:"Come to light"},
  {front:"Spacciato", back:"Doomed"},
  {front:"Sospirare / Ansimi di sorpresa", back:"Gasp"},
  {front:"Bottino / Saccheggio", back:"Loot"},
  {front:"Forzare una serratura", back:"Pick a lock"},
  {front:"Sospirare di sollievo", back:"Sigh of relief"},
  {front:"Andarsene velocemente", back:"Speed away"},
  {front:"Pila / Mucchio", back:"Stack"},
  {front:"Severo", back:"Stern"},
  {front:"Ondata / Picco", back:"Surge"},
  {front:"Sterzare / Svoltare / Fare zig-zag", back:"Swerve"},
  {front:"Emozione forte", back:"Thrill"},
  {front:"Fermo nelle mie convinzioni", back:"Firm in my belief"},
  {front:"Per quanto mi sforzi", back:"For the life of me"},
  {front:"Ero convinto", back:"I could have sworn"},
  {front:"Per citarne solo alcuni", back:"To name but a few"},
  {front:"Per i miei gusti", back:"For my liking"},
  {front:"Ricominciare da zero", back:"Start from scratch"},
  {front:"Giorno e notte", back:"Around the clock"},
  {front:"Fuggire con / Scappare con", back:"Run off with"},
  {front:"Siccome siamo fortunati", back:"Knowing our luck"},
  {front:"Costa nulla (fare) …", back:"There’s no harm (doing)"},
  {front:"Diamoci da fare!", back:"Let’s get cracking!"},
  {front:"Col cavolo / ma quando mai!", back:"Like hell!"},
  {front:"Licenziarsi / Lasciare il lavoro", back:"Quit one’s job"},
  {front:"Una boccata d’aria fresca", back:"A breath of fresh air"},
  {front:"Inosservato", back:"Unnoticed"}
];

let cards=[], pool=[], currentIndex=0;

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const backBtn   = document.getElementById("backBtn");
const restartBtn= document.getElementById("restartBtn");
const speakerBtn= document.getElementById("speakerBtn");

function startSession(){
    pool=[...library].sort(()=>0.5-Math.random());
    cards = pool.slice(0,15);
    currentIndex=0;
    updateCard();
}

function updateCard(){
    flashcard.classList.remove("flipped");
    setTimeout(()=>{
        frontText.innerText = cards[currentIndex].front;
        backText.innerText  = cards[currentIndex].back;
        counter.innerText  = `${currentIndex+1} / ${cards.length}`;
    },150);
}

function nextCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex+1)%cards.length;
    updateCard();
}
function prevCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex-1+cards.length)%cards.length;
    updateCard();
}

flashcard.addEventListener("click",()=>flashcard.classList.toggle("flipped"));
backBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    flashcard.classList.remove("flipped");
});
restartBtn.addEventListener("click",startSession);

function getBritishMaleVoice() {
    const voices = speechSynthesis.getVoices();
    return voices.find(v =>
        v.lang === "en-GB" &&
        /male|daniel|oliver|google uk english male/i.test(v.name)
    ) || voices.find(v => v.lang === "en-GB") || voices[0];
}

speakerBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    const utter = new SpeechSynthesisUtterance(cards[currentIndex].back);
    utter.lang = "en-GB";
    utter.voice = getBritishMaleVoice();
    speechSynthesis.speak(utter);
});

speechSynthesis.onvoiceschanged = () => getBritishMaleVoice();

startSession();
</script>

</body>
</html>
