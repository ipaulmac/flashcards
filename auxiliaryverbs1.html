<script>
document.addEventListener("DOMContentLoaded",()=>{

let currentSet = 1;
let fullSet = [];
let cards = [];
let index = 0;

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const speakBtn  = document.getElementById("speakBtn");

/* ---------- SHUFFLE ---------- */
function shuffleArray(a){
  const arr = [...a];
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickRandom15(arr){
  if(!arr || !arr.length) return [];
  return shuffleArray(arr).slice(0, Math.min(15, arr.length));
}

/* ---------- LOAD SET ---------- */
function loadSet(n){
  currentSet = n;

  if(!sets || !sets[n]) return;

  fullSet = sets[n].filter(Boolean);
  cards   = pickRandom15(fullSet);

  index = 0;
  updateCard();

  document.querySelectorAll('.set-btn').forEach((btn,i)=>
    btn.classList.toggle('active', i + 1 === n)
  );
}

/* ---------- REFRESH ---------- */
function refreshCurrentSet(){
  if(!fullSet.length) return;
  cards = pickRandom15(fullSet);
  index = 0;
  updateCard();
}

/* ---------- DISPLAY ---------- */
function updateCard(){
  flashcard.classList.remove("flipped");

  if(!cards.length){
    frontText.innerText = "—";
    backText.innerText  = "—";
    counter.innerText   = "0 / 0";
    return;
  }

  const c = cards[index];

  frontText.innerText = c.it || c.front || "—";
  backText.innerText  = c.en || c.back  || "—";

  counter.innerText   = `${index + 1} / ${cards.length}`;
}

/* ---------- NAV ---------- */
function nextCard(e){
  e?.stopPropagation();
  if(!cards.length) return;
  index = (index + 1) % cards.length;
  updateCard();
}

function prevCard(e){
  e?.stopPropagation();
  if(!cards.length) return;
  index = (index - 1 + cards.length) % cards.length;
  updateCard();
}

/* ---------- FLIP ---------- */
flashcard.addEventListener("click",()=>{
  flashcard.classList.toggle("flipped");
});

/* ---------- SPEAK ---------- */
const player = document.getElementById("player");

speakBtn.addEventListener("click", function(e){
  e.stopPropagation();
  if(!cards.length) return;

  // Find original position inside full set
  const originalIndex = fullSet.indexOf(cards[index]);

  // Generate filename automatically (e.g. 1-01, 1-02, etc.)
  const audioId = currentSet + "-" + String(originalIndex + 1).padStart(2, "0");

  player.src = "https://ipaulmac.github.io/flashcards/audio/auxiliaryverbs1/" + audioId + ".mp3";
  player.load();
  player.play().catch(err => console.log(err));
});

/* ---------- GLOBAL ---------- */
window.loadSet = loadSet;
window.nextCard = nextCard;
window.prevCard = prevCard;
window.refreshCurrentSet = refreshCurrentSet;

/* ---------- INIT ---------- */
loadSet(1);

});
</script>

</body>
