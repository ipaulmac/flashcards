<style>
:root{
  --bg:#061247;
  --purple:#561386;
  --red:#8C0327;
  --blue:#00cfd5;
  --green:#22c55e;
  --gold:#FFD700;
}

body{
  margin:0;
  padding:12px;
  background:var(--bg);
  font-family:system-ui,Arial,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* TOP BAR */
.top-bar{
  width:92vw;
  max-width:380px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.top-title{
  color:#fff;
  font-weight:900;
  letter-spacing:.08em;
  font-size:.90rem;
}

.top-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.instructions-btn{
  background:none;
  border:none;
  color:var(--gold);
  font-weight:900;
  font-size:.9rem;
}

.sound-btn{
  background:#fff;
  color:#061247;
  border:none;
  border-radius:10px;
  padding:6px 10px;
  font-weight:900;
  font-size:.8rem;
}

/* CARD */
.perspective{perspective:1000px;}

.card{
  width:92vw;
  max-width:380px;
  height:48vw;
  max-height:220px;
  position:relative;
  transform-style:preserve-3d;
  transition:.45s;
}

.card.flipped{transform:rotateY(180deg);}

.face{
  position:absolute;
  inset:0;
  background:#fff;
  border:4px solid var(--red);
  border-radius:1rem;
  backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
  text-align:center;
}

.back{transform:rotateY(180deg);}

.back .card-text{
  color:var(--purple);
}

.card-text{
  color:#0E065C;
  font-weight:900;
  text-transform:uppercase;
  line-height:1.25;
  font-size:clamp(1rem,3.5vw,1.2rem);
}


/* INFO ROW */
.info-row{
  width:92vw;
  max-width:380px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  margin-top:10px;
  margin-bottom:10px;
  color:#fff;
  font-weight:800;
  font-size:.95rem;
}

.info-left{text-align:left;}
.info-right{text-align:right;color:var(--gold);}

.next-btn{
  background:var(--blue);
  color:#061247;
  border:none;
  border-radius:10px;
  font-weight:900;
  padding:7px 18px;
  font-size:.85rem;
}

/* ANSWERS */
.answers{
  width:92vw;
  max-width:380px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,48px);
  gap:10px;
}

.answer-btn,.refresh-btn{
  min-height:40px;
  border:none;
  border-radius:8px;
  background:#FCECEF;
  color:#0E065C;
  font-weight:900;
  font-size:.83rem;
  padding:4px;
  text-transform:uppercase;
}

.answer-btn.correct{
  background:var(--green);
  color:#fff;
}

.answer-btn.wrong{
  background:#ef4444;
  color:#fff;
}

.refresh-btn{
  background:#FFF3A3;
  color:#8C0327;
  border:none;
  border-radius:8px;
  font-weight:900;
  font-size:.83rem;
  min-height:40px;
  padding:4px;
}

/* RETRY */
.retry-wrap{
  width:92vw;
  max-width:380px;
  display:flex;
  justify-content:center;
  margin-top:16px;
}

.retry-btn{
  background:var(--purple);
  color:#fff;
  border:none;
  border-radius:10px;
  padding:10px 24px;
  font-weight:900;
  font-size:.95rem;
}

button:active{transform:scale(.96);}

.library-back-container{
  width:92vw;
  max-width:380px;
  display:flex;
  justify-content:center;
  margin-top:14px;
  margin-bottom:6px;
}

.library-back-btn{
  background:#8C0327;
  color:white;
  border:2px solid white;
  border-radius:10px;
  padding:8px 30px;
  font-weight:900;
  font-size:.82rem;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .2s,color .2s;
}

.library-back-btn:hover{
  background:#FFF3A3;
  color:#8C0327;
}

.library-back-btn:active{
  transform:scale(.97);
}


</style>
</head>

};




function playSound(id){
  if(!soundEnabled) return;
  const audio = document.getElementById(id);
  audio.pause();
  audio.currentTime = 0;
  audio.play();
}

  translation: "Mi dispiace, la sua domanda è ancora in fase di valutazione"
},
{
  question: "I met an old friend quite ______ chance in Rome last week",
  options: ["in","on","at","by","with"],
  answer: 3,
  translation: "Mi sono imbattuto per caso in un vecchio amico a Roma la settimana scorsa"
}

];

let quizSize = 10;
let quiz = [];
let index = 0;
let score = 0;
let answered = false;
let solved = false;

const card = document.getElementById("card");
const frontText = document.getElementById("frontText");
const backText = document.getElementById("backText");
const progress = document.getElementById("progress");
const scoreBox = document.getElementById("score");
const answersDiv = document.getElementById("answers");
const nextBtn = document.getElementById("nextBtn");
const libraryBackBtn = document.getElementById("libraryBackBtn");


libraryBackBtn.onclick = ()=>{

  window.location.href = "https://www.acceleratedlanguagesystems.com/quizzes-booster";

};


function shuffle(arr){
 let a=[...arr];
 for(let i=a.length-1;i>0;i--){
   let j=Math.floor(Math.random()*(i+1));
   [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function startQuiz(){
 quiz = shuffle(questions).slice(0,quizSize);
 index = 0;
 score = 0;
 answered = false;
 solved = false;

 answersDiv.style.display = "grid";
nextBtn.style.display = "inline-flex";
libraryBackBtn.style.display = "flex";
document.getElementById("retryWrap").innerHTML = "";

 showQuestion();
}

function showQuestion(){
 answered = false;
 solved = false;
 card.classList.remove("flipped");

 const q = quiz[index];

 frontText.innerText = q.question.toUpperCase();
 backText.innerText = q.translation.toUpperCase();

 progress.innerText = `${index+1} / ${quiz.length}`;
 scoreBox.innerText = `${score} / ${quiz.length}`;

 answersDiv.innerHTML = "";

nextBtn.disabled = true;
nextBtn.classList.add("disabled-next");

 q.options.forEach((opt,i)=>{
   const btn = document.createElement("button");
   btn.className = "answer-btn";
   btn.innerText = opt.toUpperCase();
   btn.onclick = ()=>checkAnswer(i,btn);
   answersDiv.appendChild(btn);
 });

 const refresh = document.createElement("button");
 refresh.className = "refresh-btn";
 refresh.innerText = "REFRESH";
 refresh.onclick = startQuiz;
 answersDiv.appendChild(refresh);
}

function checkAnswer(selected,btn){

 if(answered) return;

 answered = true;

 const q = quiz[index];
 const buttons = document.querySelectorAll(".answer-btn");

 buttons.forEach(b=>b.disabled=true);

 if(selected === q.answer){

   btn.classList.add("correct");
   score++;
   solved = true;

   playSound("correctSound");

   card.classList.add("flipped");

 }else{

   btn.classList.add("wrong");
   playSound("wrongSound");
 }

 scoreBox.innerText = `${score} / ${quiz.length}`;

nextBtn.disabled = false;
nextBtn.classList.remove("disabled-next");
}

function endQuiz(){

 const percent = (score / quiz.length) * 100;

 answersDiv.style.display = "none";
nextBtn.style.display = "none";
libraryBackBtn.style.display = "none";

 card.classList.remove("flipped");

 if(percent >= 80){
   frontText.innerText = "WELL DONE! YOU'VE PASSED! 🎉";
   playSound("passSound");
 }else{
   frontText.innerText = "BAD LUCK! TRY AGAIN ❌";
   playSound("failSound");
 }

 document.getElementById("retryWrap").innerHTML =
 `<button class="retry-btn">TRY AGAIN</button>`;

 document.querySelector(".retry-btn").onclick = startQuiz;

 solved = false;
}

nextBtn.onclick = ()=>{

 if(index === quiz.length - 1){
   endQuiz();
   return;
 }

 index++;
 showQuestion();
};


card.onclick = ()=>{

 if(solved){
   card.classList.toggle("flipped");
 }
};

document.addEventListener("DOMContentLoaded", function(){

 const closeBtn =
 document.getElementById("closeInstructions");

 const box =
 document.getElementById("instructionsBox");

 if(closeBtn){

   closeBtn.addEventListener("click", function(e){

     e.preventDefault();
     e.stopPropagation();

     box.removeAttribute("open");

   });

 }

});

startQuiz();

</script>

</body>
</html>
