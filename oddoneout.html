}

body{
margin:0;
padding:10px;
background:var(--bg-blue);
font-family:system-ui;
display:flex;
flex-direction:column;
align-items:center;
}

/* TOP BAR */

.topbar{
width:90vw;
max-width:380px;
display:grid;
grid-template-columns:60px 1fr auto;
align-items:center;
margin-bottom:10px;
}


.title{
color:#fff;
font-weight:900;
letter-spacing:.08em;
font-size:.95rem;
text-align:center;
justify-self:center;
width:100%;
}


.library-back-btn{
width:58px;
height:28px;
background:#930000;
color:#fff;
border:3px solid #fff;
border-radius:999px;
font-size:.72rem;
font-weight:900;
cursor:pointer;
}

.library-back-btn:hover{
background:#FFF3A3;
color:#930000;
}





/* INSTRUCTIONS */
details summary{
cursor:pointer;
list-style:none;
color:var(--gold);
font-weight:800;
font-size:.95rem;
}

.instructions-box{
position:absolute;
top:38px;
left:50%;
transform:translateX(-50%);
width:92vw;
max-width:310px;
background:#eef6ff;
color:#061247;
border-radius:10px;
padding:12px 14px;
font-size:.84rem;
line-height:1.4;
font-weight:700;
z-index:10;
box-shadow:0 4px 12px rgba(0,0,0,.25);
}

.close-box{
margin-top:10px;
text-align:right;
color:#006400;
font-weight:900;
cursor:pointer;
}

/* CARD */
.card{
width:90vw;
max-width:380px;
background:#fff;
border:4px solid var(--it-red);
border-radius:1rem;
padding:14px 12px;
min-height:190px;
}

.word-line{
font-size:1.05rem;
font-weight:900;
margin:10px 0;
text-transform:uppercase;
color:#061247;
}

.letter{
color:#8C0327;
margin-right:8px;
display:inline-block;
width:28px;
}

/* HEADER */
.header{
width:90vw;
max-width:380px;
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
margin-top:8px;
margin-bottom:8px;
}

#counter{
color:#fff;
font-weight:800;
}

#score{
color:var(--gold);
font-weight:800;
text-align:right;
}

.next-btn{
height:28px;
padding:0 12px;
border-radius:8px;
font-weight:800;
font-size:.8rem;
background:var(--cyan);
color:#061247;
visibility:hidden;
}

/* ANSWER BUTTONS */


.answer-row{
width:90vw;
max-width:320px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.answer-btn{
height:42px;
border:none;
border-radius:10px;
font-weight:900;
font-size:1.15rem;
background:#FFE4EC;
color:var(--front-purple);
}

.correct{
background:#22c55e;
color:#fff;
}

.wrong{
background:#ef4444;
color:#fff;
}

/* POPUP BELOW */
.popup{
width:90vw;
max-width:380px;
background:#fff;
border-radius:14px;
padding:14px;
margin-top:10px;
display:none;
}

.popup-title{
font-weight:900;
font-size:1rem;
margin-bottom:10px;
line-height:1.35;
}

.good{color:#22c55e;}
.bad{color:#ef4444;}

.popup-line{
font-weight:700;
color:#061247;
line-height:1.45;
margin:8px 0;
}

.listen{
background:#eef2f7;
border:none;
padding:3px 7px;
border-radius:7px;
font-weight:800;
font-size:.8rem;
margin-left:5px;
}

.sound-row{
display:grid;
grid-template-columns:1fr auto;
align-items:center;
gap:8px;
margin:3px 0;
}

.popup-word{
color:#8C0327;
font-weight:900;
}

.next-popup{
margin-top:12px;
text-align:right;
font-weight:900;
cursor:pointer;
color:#061247;
}

/* RETRY */
.retry-btn{
all:unset;
background:var(--front-purple);
color:#fff;
font-weight:900;
padding:8px 18px;
border-radius:8px;
margin-top:12px;
cursor:pointer;
}
</style>
</head>

let quiz=[];
let index=0;
let score=0;
let locked=false;

function shuffle(arr){
let a=[...arr];
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function speak(txt){
let u=new SpeechSynthesisUtterance(txt);
u.lang="en-GB";
u.rate=.9;
speechSynthesis.cancel();
speechSynthesis.speak(u);
}

function playSound(id){
let a=document.getElementById(id);
if(!a) return;
a.pause();
a.currentTime=0;
a.play();
}

function startQuiz(){
quiz=shuffle(questions).slice(0,8);
index=0;
score=0;
document.getElementById("retryArea").innerHTML="";
showQuestion();
}

function showQuestion(){
locked=false;
document.getElementById("popup").style.display="none";

let q=quiz[index];
let card=document.getElementById("card");

card.innerHTML=`
<div class="word-line"><span class="letter">A)</span>${q.options[0]}</div>
<div class="word-line"><span class="letter">B)</span>${q.options[1]}</div>
<div class="word-line"><span class="letter">C)</span>${q.options[2]}</div>
<div class="word-line"><span class="letter">D)</span>${q.options[3]}</div>
`;

let wrap=document.getElementById("answers");
wrap.innerHTML="";

["A","B","C","D"].forEach((letter,i)=>{
let btn=document.createElement("button");
btn.className="answer-btn";
btn.innerText=letter;
btn.onclick=()=>checkAnswer(i);
wrap.appendChild(btn);
});

updateHeader();
}

function updateHeader(){
document.getElementById("counter").innerText=`${index+1} / ${quiz.length}`;
document.getElementById("score").innerText=`${score} / ${quiz.length}`;
}

function checkAnswer(choice){
if(locked) return;
locked=true;

let q=quiz[index];
let buttons=document.querySelectorAll(".answer-btn");

buttons.forEach((b,i)=>{

if(choice===q.correct){
if(i===q.correct) b.classList.add("correct");
}else{
if(i===choice) b.classList.add("wrong");
}

b.disabled=true;
});

if(choice===q.correct){
score++;
playSound("correctSound");
}else{
playSound("wrongSound");
}

setTimeout(()=>showPopup(choice===q.correct, choice),500);
updateHeader();
}

function showPopup(correctChoice, choice){
let q=quiz[index];
let popup=document.getElementById("popup");

if(correctChoice){

let others=q.options.filter((x,i)=>i!==q.correct)
.map(w=>`
<div class="sound-row">
<span class="popup-word">${w.toUpperCase()}</span>
<button class="listen" onclick="speak('${w}')">🔊</button>
</div>
`)
.join("");

popup.innerHTML=`

<div class="popup-title good" style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;">
<span>CORRECT!</span>
<span class="popup-word">${q.options[q.correct].toUpperCase()}</span>
<span>is pronounced</span>
<button class="listen" onclick="speak('${q.options[q.correct]}')">🔊</button>
</div>

<div class="popup-line">${others}</div>

<div class="next-popup" style="margin-top:18px;" onclick="nextQuestion()">NEXT ></div>

`;

}else{

popup.innerHTML=`

<div class="popup-title bad">BAD LUCK!</div>

<div class="popup-line">
The pronunciation of this word is
<button class="listen" onclick="speak('${q.options[choice]}')">🔊</button>
</div>

<div class="next-popup" onclick="nextQuestion()">NEXT ></div>

`;
}

popup.style.display="block";
}

function nextQuestion(){

if(locked===false) return;

if(index===quiz.length-1){

endQuiz();
return;

}

index++;
showQuestion();

}
function endQuiz(){

document.getElementById("answers").innerHTML="";
document.getElementById("popup").style.display="none";

let passed=score>=6;

playSound(passed ? "passSound" : "failSound");

document.getElementById("card").innerHTML=`
<div class="word-line" style="text-align:center;margin-top:55px;">
${passed ? "WELL DONE! YOU'VE PASSED! 🎉" : "BAD LUCK! TRY AGAIN ❌"}
</div>
`;

document.getElementById("retryArea").innerHTML=`
<button class="retry-btn" onclick="startQuiz()">TRY AGAIN</button>
`;
}

document.getElementById("libraryBackBtn").addEventListener("click", function () {

});
