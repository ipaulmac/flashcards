<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS - Lessons 9 & 10 Compact</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root {
    --brand-navy:#002147;
    --brand-gold:#CFC752;
    --custom-purple:#561386;
}

body{
    background:var(--custom-purple);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    overflow:hidden;
}

.perspective-1000{perspective:1000px;}
.preserve-3d{transform-style:preserve-3d;}
.backface-hidden{backface-visibility:hidden;}
.rotate-y-180{transform:rotateY(180deg);}
.flip-card-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);}
.flipped{transform:rotateY(180deg);}

.phrase-front{font-size:2.4rem;line-height:1.1;font-weight:700;color:#fff;}
.phrase-back{font-size:2.75rem;line-height:1.05;font-weight:800;color:#fff;}

.nav-btn{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
}
.nav-btn:active{transform:scale(.9);}

.ui-accent-bg{background:var(--brand-gold);}
.navy-text{color:var(--brand-navy);}

/* BACK button */
.back-btn{
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:.9rem;
}
.back-btn:active{transform:scale(.95);opacity:.8;}

/* Try again / refresh button */
.restart-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:.85rem;
    margin-top:1rem;
}
.restart-btn:active{transform:scale(.95);opacity:.8;}

@media (max-width:480px){
    .phrase-front{font-size:1.4rem;}
    .phrase-back{font-size:1.7rem;}
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-[420px] perspective-1000">
<div id="flashcard" class="relative w-full h-[360px] preserve-3d flip-card-inner cursor-pointer shadow-2xl rounded-3xl">

<!-- FRONT (BLUE) -->
<div class="absolute inset-0 bg-[#002147] backface-hidden rounded-3xl flex flex-col justify-between p-5 border">
    <div class="text-[10px] font-black text-white/50 uppercase tracking-widest text-right">Lessons 9 & 10</div>
    <div class="flex-grow flex items-center justify-center text-center px-2">
        <p id="front-text" class="phrase-front"></p>
    </div>

    <div class="flex flex-col items-center space-y-2">
        <div class="text-[#CFC752] text-[11px] font-black uppercase tracking-[0.2em]">
            Tap / Click to reveal
        </div>

        <div class="flex items-center space-x-4 ui-accent-bg px-3 py-1 rounded-full">
            <button onclick="prevCard(event)" class="nav-btn navy-text">◀</button>
            <span id="counter-display" class="text-[11px] font-black navy-text">1 / 15</span>
            <button onclick="nextCard(event)" class="nav-btn navy-text">▶</button>
        </div>
    </div>
</div>

<!-- BACK (PURPLE) -->
<div class="absolute inset-0 bg-[#561386] backface-hidden rotate-y-180 rounded-3xl flex flex-col justify-between p-5 border-b-8 border-[#CFC752]">
    <div class="text-[10px] font-bold text-white/40 uppercase tracking-widest text-right">Translation</div>

    <div class="flex-grow flex items-center justify-center text-center px-2">
        <p id="back-text" class="phrase-back italic"></p>
    </div>

    <div class="flex justify-center pb-2">
        <button id="backBtn" class="back-btn">Tap / Click to go back</button>
    </div>
</div>

</div>
</div>

<button id="restartBtn" class="restart-btn">
    &#x21bb; Try again
</button>

<script>
const library = [
  {front:"A memoria", back:"By heart"},
  {front:"Provenire", back:"Come from"},
  {front:"A giorni alterni", back:"Every other day"},
  {front:"Di prim’ordine / Eccellente", back:"First-rate"},
  {front:"Confondersi", back:"Get mixed up"},
  {front:"Sbarazzarsi / Eliminare", back:"Get rid of"},
  {front:"Stare bene con / Abbinarsi a", back:"Go with / Match"},
  {front:"Assicurarsi", back:"Make certain / Make sure"},
  {front:"Viaggiare senza intoppi", back:"Make good time"},
  {front:"Capire (con difficoltà)", back:"Make out"},
  {front:"Ogni tanto", back:"Now and again / Now and then"},
  {front:"Occuparsi di / Provvedere a", back:"See to"},
  {front:"Avanti e indietro", back:"Back and forth"},
  {front:"Essere responsabile", back:"Be in charge"},
  {front:"Essere abituato a fare", back:"Be used to doing"},
  {front:"Ridurre (spese)", back:"Cut back on"},
  {front:"Ridurre (consumo)", back:"Cut down on"},
  {front:"Mettersi in contatto", back:"Get in touch"},
  {front:"Abituarsi a fare", back:"Get used to doing"},
  {front:"Divertirsi / Passarsela bene", back:"Have a (good) time"},
  {front:"In pochissimo tempo", back:"In no time"},
  {front:"Un bel po’ di", back:"Quite a few"},
  {front:"Essere solito fare", back:"Used to do"},
  {front:"Svegliarsi", back:"Wake up"},
  {front:"Rendersi conto di", back:"Wake up to"},
  {front:"All’inizio", back:"At the outset"},
  {front:"Cifra / Numero", back:"Figure"},
  {front:"Non avere altra scelta che", back:"No alternative but"},
  {front:"Pagare il prezzo più alto / Fallire", back:"Pay the ultimate price"},
  {front:"Spiacevole / Inaspettato", back:"Untoward"},
  {front:"Non è da me", back:"It’s unlike me"},
  {front:"Travolgente / Schiacciante", back:"Overwhelming"},
  {front:"Sono io (al telefono)", back:"Speaking"},
  {front:"Mi sono reso ridicolo!", back:"I made a fool of myself!"},
  {front:"Ingenuo", back:"Naïve"},
  {front:"All’alba", back:"The crack of dawn"},
  {front:"Ciò nonostante", back:"Nonetheless"},
  {front:"Al chiuso", back:"Indoors"}
];

let cards=[], pool=[], currentIndex=0;

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const backBtn   = document.getElementById("backBtn");
const restartBtn= document.getElementById("restartBtn");

function startSession(){
    if(pool.length < 15) pool=[...library].sort(()=>0.5-Math.random());
    cards = pool.splice(0,15);
    currentIndex=0;
    updateCard();
}

function updateCard(){
    flashcard.classList.remove("flipped");
    setTimeout(()=>{
        frontText.innerText = cards[currentIndex].front;
        backText.innerText  = cards[currentIndex].back;
        counter.innerText  = `${currentIndex+1} / ${cards.length}`;
    },150);
}

function nextCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex+1)%cards.length;
    updateCard();
}
function prevCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex-1+cards.length)%cards.length;
    updateCard();
}

flashcard.addEventListener("click",()=>flashcard.classList.toggle("flipped"));
backBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    flashcard.classList.remove("flipped");
});
restartBtn.addEventListener("click",startSession);

startSession();
</script>

</body>
</html>
