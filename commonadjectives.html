<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Common Adjectives – Mobile Flashcards</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --bg-blue:#061247;
  --card-cream:#F7F2E7;
  --it-red:#8C0327;
  --en-blue:#0E065C;
  --border-red:#8C0327;
}

body{
  background:var(--bg-blue);
  font-family:system-ui, Segoe UI, Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:1rem;
}

/* CARD */
.perspective{perspective:1000px;}
.card-inner{
  width:90vw;
  max-width:380px;
  height:55vw;
  max-height:240px;
  position:relative;
  transform-style:preserve-3d;
  transition:.4s;
  cursor:pointer;
}
.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:1rem;
}
.back{transform:rotateY(180deg);}

.corner-hint{
  position:absolute;
  top:.4rem;
  right:.6rem;
  font-size:.6rem;
  font-weight:800;
  color:#061247;
}

.it-text{
  color:var(--it-red);
  font-weight:800;
  text-transform:uppercase;
  text-align:center;
  font-size:1.1rem;
}
.en-text{
  color:var(--en-blue);
  font-weight:700;
  text-transform:uppercase;
  text-align:center;
  font-size:1rem;
  white-space:pre-line;
}

.listen-btn{
  background:none;
  border:none;
  color:var(--it-red);
  font-weight:700;
  font-size:.9rem;
}

/* NAV */
.nav-btn{
  font-size:1.4rem;
  font-weight:700;
  color:white;
}

/* SET BUTTONS */
.set-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.4rem;
  max-width:380px;
  width:100%;
}

.set-btn{
  padding:.35rem 0;
  font-size:.75rem;
  font-weight:800;
  border-radius:999px;
  background:white;
  color:#0E065C;
}
.set-btn.active{
  background:#8C0327;
  color:white;
}
</style>
</head>

<body>

<h1 class="text-white font-extrabold mb-2">COMMON ADJECTIVES</h1>

<div class="perspective">
  <div id="flashcard" class="card-inner">

    <!-- FRONT -->
    <div class="face bg-[#F7F2E7] border-4 border-[#8C0327] flex items-center justify-center p-4">
      <div class="corner-hint">TAP TO REVEAL</div>
      <div id="front-text" class="it-text"></div>
    </div>

    <!-- BACK -->
    <div class="face back bg-[#F7F2E7] border-4 border-[#8C0327] flex flex-col items-center justify-center gap-3 p-4">
      <div class="corner-hint">TAP TO RETURN</div>
      <div id="back-text" class="en-text"></div>
      <button id="speakBtn" class="listen-btn">🔊 Listen</button>
    </div>

  </div>
</div>

<div class="flex justify-between items-center w-full max-w-[380px] mt-1">
  <button onclick="prevCard(event)" class="nav-btn">◀</button>
  <span id="counter-display" class="text-white font-bold text-sm">1 / 1</span>
  <button onclick="nextCard(event)" class="nav-btn">▶</button>
</div>

<div class="set-grid mt-2">
  <button class="set-btn" onclick="loadSet(1)">SET 1</button>
  <button class="set-btn" onclick="loadSet(2)">SET 2</button>
  <button class="set-btn" onclick="loadSet(3)">SET 3</button>
  <button class="set-btn" onclick="loadSet(4)">SET 4</button>
  <button class="set-btn" onclick="loadSet(5)">SET 5</button>
  <button class="set-btn" onclick="loadSet(6)">SET 6</button>
</div>

<script>
const sets = {
  1: [
    {it:"BUONO", en:"GOOD", speak:["good"]},
    {it:"MALE / CATTIVO", en:"BAD", speak:["bad"]},
    {it:"GRANDE", en:"BIG / LARGE", speak:["big","large"]},
    {it:"PICCOLO", en:"SMALL / LITTLE", speak:["small","little"]},
    {it:"LUNGO", en:"LONG", speak:["long"]},
    {it:"CORTO", en:"SHORT", speak:["short"]},
    {it:"ALTO", en:"HIGH / TALL", speak:["high","tall"]},
    {it:"BASSO", en:"LOW / SHORT", speak:["low","short"]},
    {it:"FACILE", en:"EASY", speak:["easy"]},
    {it:"DIFFICILE", en:"DIFFICULT", speak:["difficult"]},
    {it:"VELOCE", en:"FAST / QUICK", speak:["fast","quick"]},
    {it:"LENTO", en:"SLOW", speak:["slow"]},
    {it:"VECCHIO", en:"OLD", speak:["old"]},
    {it:"NUOVO", en:"NEW", speak:["new"]}
  ],

  2: [
    {it:"CALDO", en:"HOT", speak:["hot"]},
    {it:"FREDDO", en:"COLD", speak:["cold"]},
    {it:"PIENO", en:"FULL", speak:["full"]},
    {it:"VUOTO", en:"EMPTY", speak:["empty"]},
    {it:"DIVERSO", en:"DIFFERENT", speak:["different"]},
    {it:"STESSO", en:"SAME", speak:["same"]},
    {it:"GIUSTO", en:"RIGHT", speak:["right"]},
    {it:"SBAGLIATO", en:"WRONG", speak:["wrong"]},
    {it:"UTILE", en:"USEFUL", speak:["useful"]},
    {it:"INUTILE", en:"USELESS", speak:["useless"]},
    {it:"NECESSARIO", en:"NECESSARY", speak:["necessary"]},
    {it:"VERO", en:"TRUE", speak:["true"]},
    {it:"FALSO", en:"FALSE", speak:["false"]}
  ],

  3: [
    {it:"FELICE", en:"HAPPY", speak:["happy"]},
    {it:"TRISTE", en:"SAD", speak:["sad"]},
    {it:"ARRABBIATO", en:"ANGRY", speak:["angry"]},
    {it:"STANCO", en:"TIRED", speak:["tired"]},
    {it:"AFFAMATO", en:"HUNGRY", speak:["hungry"]},
    {it:"ASSETATO", en:"THIRSTY", speak:["thirsty"]},
    {it:"OCCUPATO / IMPEGNATO", en:"BUSY", speak:["busy"]},
    {it:"LIBERO", en:"FREE", speak:["free"]},
    {it:"GENTILE", en:"KIND", speak:["kind"]},
    {it:"CARINO", en:"NICE", speak:["nice"]},
    {it:"AMICHEVOLE", en:"FRIENDLY", speak:["friendly"]},
    {it:"ANTIPATICO", en:"UNFRIENDLY", speak:["unfriendly"]},
    {it:"ONESTO", en:"HONEST", speak:["honest"]},
    {it:"SPAVENTATO", en:"AFRAID", speak:["afraid"]}
  ],

  4: [
    {it:"SICURO / CERTO", en:"SURE", speak:["sure"]},
    {it:"SICURO (PROTETTO)", en:"SAFE", speak:["safe"]},
    {it:"SERIO", en:"SERIOUS", speak:["serious"]},
    {it:"INTERESSANTE", en:"INTERESTING", speak:["interesting"]},
    {it:"NOIOSO", en:"BORING", speak:["boring"]},
    {it:"ECCITANTE / EMOZIONANTE", en:"EXCITING", speak:["exciting"]},
    {it:"DIVERTENTE", en:"FUN", speak:["fun"]},
    {it:"STRANO / INSOLITO", en:"STRANGE", speak:["strange"]},
    {it:"CHIARO", en:"CLEAR", speak:["clear"]},
    {it:"CONFUSO", en:"CONFUSING", speak:["confusing"]},
    {it:"SEMPLICE", en:"SIMPLE", speak:["simple"]},
    {it:"DISPONIBILE", en:"AVAILABLE", speak:["available"]},
    {it:"PRONTO", en:"READY", speak:["ready"]},
    {it:"INTERO", en:"WHOLE", speak:["whole"]}
  ],

  5: [
    {it:"SMUSSATO / SPUNTATO", en:"BLUNT", speak:["blunt"]},
    {it:"PROFONDO", en:"DEEP", speak:["deep"]},
    {it:"POCO PROFONDO", en:"SHALLOW", speak:["shallow"]},
    {it:"MOLTO", en:"MUCH", speak:["much"]},
    {it:"MOLTI", en:"MANY", speak:["many"]},
    {it:"POCO", en:"LITTLE", speak:["little"]},
    {it:"POCHI", en:"FEW", speak:["few"]},
    {it:"FORTE", en:"STRONG", speak:["strong"]},
    {it:"DEBOLE", en:"WEAK", speak:["weak"]},
    {it:"PESANTE", en:"HEAVY", speak:["heavy"]},
    {it:"LEGGERO", en:"LIGHT", speak:["light"]},
    {it:"EDUCATO", en:"POLITE", speak:["polite"]},
    {it:"MALEDUCATO", en:"IMPOLITE", speak:["impolite"]},
    {it:"AFFOLLATO", en:"CROWDED", speak:["crowded"]}
  ],

  6: [
    {it:"RICCO", en:"RICH", speak:["rich"]},
    {it:"POVERO", en:"POOR", speak:["poor"]},
    {it:"BLOCCATO", en:"STUCK", speak:["stuck"]},
    {it:"NUVOLOSO", en:"CLOUDY", speak:["cloudy"]},
    {it:"VENTOSO", en:"WINDY", speak:["windy"]},
    {it:"NERO", en:"BLACK", speak:["black"]},
    {it:"VERDE", en:"GREEN", speak:["green"]},
    {it:"BIANCO", en:"WHITE", speak:["white"]},
    {it:"APPICCICOSO", en:"STICKY", speak:["sticky"]},
    {it:"DI LEGNO", en:"WOODEN", speak:["wooden"]},
    {it:"STRETTO (ABITI)", en:"TIGHT", speak:["tight"]},
    {it:"LARGO / SCIOLTO (ABITI)", en:"LOOSE", speak:["loose"]},
    {it:"LARGO (SPAZIO)", en:"WIDE", speak:["wide"]},
    {it:"STRETTO (SPAZIO)", en:"NARROW", speak:["narrow"]}
  ]
};


let currentSet=1, cards=[], index=0;
const flashcard=document.getElementById("flashcard");
const frontText=document.getElementById("front-text");
const backText=document.getElementById("back-text");
const counter=document.getElementById("counter-display");
const speakBtn=document.getElementById("speakBtn");

function loadSet(n){
 currentSet=n; cards=sets[n]; index=0;
 updateCard(); highlightSet(n);
}
function highlightSet(n){
 document.querySelectorAll('.set-btn').forEach((b,i)=>b.classList.toggle('active',i+1===n));
}
function updateCard(){
 flashcard.classList.remove("flipped");
 if(!cards.length){
   frontText.innerText="—";
   backText.innerText="—";
   counter.innerText="0 / 0";
   return;
 }
 setTimeout(()=>{
   frontText.innerText=cards[index].it;
   backText.innerText=cards[index].en;
   counter.innerText=`${index+1} / ${cards.length}`;
 },120);
}
function nextCard(e){e.stopPropagation(); if(!cards.length) return; index=(index+1)%cards.length; updateCard();}
function prevCard(e){e.stopPropagation(); if(!cards.length) return; index=(index-1+cards.length)%cards.length; updateCard();}
flashcard.onclick=()=>flashcard.classList.toggle("flipped");

speakBtn.onclick=e=>{
 e.stopPropagation();
 if(!cards.length) return;
 const t = cards[index].speak.join(", ");
 const u=new SpeechSynthesisUtterance(t);
 u.lang="en-GB";
 speechSynthesis.cancel();
 speechSynthesis.speak(u);
};

loadSet(1);
</script>

</body>
</html>
