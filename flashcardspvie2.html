      <span style="color:#0E065C;">THERE ARE A TOTAL OF <strong style="color:#8C0327;">${totalCards}</strong> CARDS</span>
      <br><br>
      <span style="color:#0E065C;">OF WHICH</span>
      <br>
      <span style="color:#0E065C;"><strong style="color:#8C0327;">${selectedCards}</strong> ARE SELECTED RANDOMLY</span>`;

  }

}else{

  document.getElementById("popupText").innerHTML =
    `THIS SET CONTAINS A TOTAL OF
    <br><strong style="color:#8C0327;">${totalCards}</strong> CARDS
    <br><br>
    OF WHICH
    <br><strong style="color:#8C0327;">${selectedCards}</strong> ARE SELECTED RANDOMLY`;

}

document.getElementById("startPopup").style.display = "flex";

}

window.startSelectedSet = function(){

  closeStartPopup();

  if(selectedMode === "single"){

      loadSet(selectedFolder);

  }else if(selectedMode === "global13to18"){

      loadGlobal13to18();

  }else if(selectedMode === "global19to24"){

      loadGlobal19to24();

  }else if(selectedMode === "global13to24"){

      loadGlobal13to24();

  }

}

function shuffle(arr){
  const a=[...arr];

  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

function prepareSet(folder){
  return sets[folder].map((card,i)=>({
    ...card,
    folder,
    id:`PVIE2-${String(i+1).padStart(3,"0")}`
  }));
}

window.loadSet = function(folder){
  activeMode="single";
  activeFolder=folder;
  index=0;

  const fullPool=prepareSet(folder);
  cards=shuffle(fullPool).slice(0,12);

  updateCard();
  activateButton(folder);
}

window.loadGlobal13to18 = function(){

  activeMode="global13to18";
  activeFolder=null;
  index=0;

  let combined=[];

  ["pvie2.1","pvie2.2","pvie2.3","pvie2.4","pvie2.5","pvie2.6"].forEach(folder=>{
    if(sets[folder]){
      combined.push(...prepareSet(folder));
    }
  });

  cards=shuffle(combined).slice(0,20);

  updateCard();
  activateButton("GLOBAL13TO18");

}

window.loadGlobal19to24 = function(){

  activeMode="global19to24";
  activeFolder=null;
  index=0;

  let combined=[];

  ["pvie2.7","pvie2.8","pvie2.9","pvie2.10","pvie2.11","pvie2.12"].forEach(folder=>{
    if(sets[folder]){
      combined.push(...prepareSet(folder));
    }
  });

  cards=shuffle(combined).slice(0,20);

  updateCard();
  activateButton("GLOBAL19TO24");

}

window.loadGlobal13to24 = function(){

  activeMode="global13to24";
  activeFolder=null;
  index=0;

  let combined=[];

  Object.keys(sets).forEach(folder=>{
    combined.push(...prepareSet(folder));
  });

  cards=shuffle(combined).slice(0,20);

  updateCard();
  activateButton("GLOBAL13TO24");

}


window.refreshCurrentSet = function(){

  if(activeMode==="single"){

    loadSet(activeFolder);

  }else if(activeMode==="global13to18"){

    loadGlobal13to18();

  }else if(activeMode==="global19to24"){

    loadGlobal19to24();

  }else if(activeMode==="global13to24"){

    loadGlobal13to24();

  }

}
function updateCard(){
  flashcard.classList.remove("flipped");

  const c=cards[index];

  frontText.innerHTML=c.front.toUpperCase();
  backText.innerHTML=c.back.toUpperCase();

  const lessonNumber = Number(c.folder.split(".")[1]) + 12;
  lessonLabel.innerText = `LESSON ${lessonNumber}`;

  counter.innerText=`${index+1} / ${cards.length}`;
}

window.nextCard=function(e){

  if(e) e.stopPropagation();

  if(cards.length===0) return;

  index=(index+1)%cards.length;

  updateCard();

};

window.prevCard=function(e){

  if(e) e.stopPropagation();

  if(cards.length===0) return;

  index=(index-1+cards.length)%cards.length;

  updateCard();

};

flashcard.addEventListener("click",()=>{

  if(cards.length===0) return;

  flashcard.classList.toggle("flipped");

});


speakBtn.addEventListener("click",(e)=>{
  e.stopPropagation();

  const c=cards[index];
  const audio=new Audio(`audio/${c.folder}/${c.id}.mp3`);

  audio.play();
});

  document.querySelectorAll(".set-btn").forEach(btn=>

console.log(buttons);

 const map={

};


  if (buttons[map[folder]]) {
