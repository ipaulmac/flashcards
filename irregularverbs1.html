<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Irregular Verbs – Flashcards</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --bg-blue:#061247;
  --card-cream:#F7F2E7;
  --it-red:#8C0327;
  --en-blue:#0E065C;
  --border-red:#8C0327;
}

body{background:var(--bg-blue);font-family:system-ui;}

.perspective{perspective:1000px;}
.card-inner{transition:.5s;transform-style:preserve-3d;}
.flipped{transform:rotateY(180deg);}
.face{backface-visibility:hidden;}
.back{transform:rotateY(180deg);}

.it-text{color:var(--it-red);font-weight:900;letter-spacing:.08em;text-align:center;text-transform:uppercase;}
.en-text{color:var(--en-blue);font-weight:800;letter-spacing:.08em;text-align:center;text-transform:uppercase;}

.set-btn{background:var(--card-cream);color:var(--en-blue);font-weight:700;padding:.5rem 1rem;border-radius:999px;margin:2px;}
.selected-set{background:var(--en-blue)!important;color:white!important;}

.nav-btn{font-size:1.2rem;font-weight:bold;color:var(--en-blue);}
.listen-btn{background:none;color:#8C0327;font-weight:900;font-size:.9rem;cursor:pointer;}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center gap-4 p-4">

<!-- SET BUTTONS 2 ROWS -->
<div id="setButtons" class="flex flex-wrap justify-center gap-2 mb-4 max-w-[520px]">
  <button class="set-btn" onclick="loadSet(1,this)">SET 1</button>
  <button class="set-btn" onclick="loadSet(2,this)">SET 2</button>
  <button class="set-btn" onclick="loadSet(3,this)">SET 3</button>
  <button class="set-btn" onclick="loadSet(4,this)">SET 4</button>
  <button class="set-btn" onclick="loadSet(5,this)">SET 5</button>
  <button class="set-btn" onclick="loadSet(6,this)">SET 6</button>
  <button class="set-btn" onclick="loadSet(7,this)">SET 7</button>
  <button class="set-btn" onclick="loadSet(8,this)">SET 8</button>
  <button class="set-btn" onclick="loadSet(9,this)">SET 9</button>
  <button class="set-btn" onclick="loadSet(10,this)">SET 10</button>
  <button class="set-btn" onclick="loadSet(11,this)">SET 11</button>
</div>

<div class="perspective">
<div id="flashcard" class="card-inner relative w-[500px] h-[300px] cursor-pointer border-4 border-[var(--border-red)] rounded-3xl">

<!-- FRONT -->
<div class="face absolute inset-0 bg-[var(--card-cream)] rounded-3xl flex flex-col justify-between p-5 border-4 border-[var(--border-red)]">
  <div id="front-text" class="it-text text-4xl flex-grow flex items-center justify-center"></div>
  <div class="flex flex-col items-center gap-2">
    <div class="text-xs font-black tracking-widest text-[var(--en-blue)]">TAP TO REVEAL →</div>
    <div class="flex items-center gap-4 px-4 py-1 rounded-full border-2 border-[var(--en-blue)]">
      <button onclick="prevCard(event)" class="nav-btn">◀</button>
      <span id="counter">1 / 16</span>
      <button onclick="nextCard(event)" class="nav-btn">▶</button>
    </div>
  </div>
</div>

<!-- BACK -->
<div class="face back absolute inset-0 bg-[var(--card-cream)] border-4 border-[var(--border-red)] rounded-3xl p-5 flex flex-col justify-between">
  <div class="text-right text-xs font-black tracking-widest text-[var(--en-blue)]">← TAP TO GO BACK</div>
  <div class="flex-grow flex flex-col items-center justify-center gap-4">
    <div id="back-text" class="en-text text-3xl"></div>
    <button id="speakBtn" class="listen-btn">🔊 LISTEN</button>
  </div>
</div>

</div>
</div>

let currentSet = sets[1];
let index = 0;

const card = document.getElementById("flashcard");
const front = document.getElementById("front-text");
const back = document.getElementById("back-text");
const counter = document.getElementById("counter");
const speakBtn = document.getElementById("speakBtn");

/* FLIP */
card.addEventListener("click",()=>card.classList.toggle("flipped"));

/* AUDIO */
speakBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  const utter = new SpeechSynthesisUtterance(back.textContent);
  utter.lang = "en-GB";
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
});

/* NAVIGATION */
function updateCard(){
  front.textContent = currentSet[index].it;
  back.textContent  = currentSet[index].en;
  counter.textContent = `${index+1} / ${currentSet.length}`;
}
function nextCard(e){e.stopPropagation();index=(index+1)%currentSet.length;updateCard();}
function prevCard(e){e.stopPropagation();index=(index-1+currentSet.length)%currentSet.length;updateCard();}

/* LOAD SET & SELECTED BUTTON */
function loadSet(n,btn){
  currentSet = sets[n];
  index = 0;
  updateCard();
  card.classList.remove("flipped");
  document.querySelectorAll(".set-btn").forEach(b=>b.classList.remove("selected-set"));
  btn.classList.add("selected-set");
}

/* INIT */
