<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS – Extra Expressions Stage Two</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --navy:#002147;
  --gold:#CFC752;
  --purple:#561386;
}

body{
  background:var(--navy);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  overflow:hidden;
}

.perspective-1000{perspective:1000px;}
.preserve-3d{transform-style:preserve-3d;}
.backface-hidden{backface-visibility:hidden;}
.rotate-y-180{transform:rotateY(180deg);}
.flip-card-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);}
.flipped{transform:rotateY(180deg);}

.front-text, .back-text {
  font-size: 2.4rem;   /* natural size on desktop */
  line-height: 1.2;    /* gives a little breathing room */
  font-weight: 800;
}

.back-text {
  color: var(--navy);  /* keeps back text readable */
  line-height: 1.2;    /* match front for balance */
}

.nav-btn{
  width:50px;
  height:50px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.2rem;
}
.nav-btn:active{transform:scale(.9);}

.restart-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  background:none;
  border:2px solid #fff;
  color:#fff;
  padding:6px 14px;
  border-radius:999px;
  font-weight:800;
  letter-spacing:1.5px;
  text-transform:uppercase;
  font-size:.85rem;
  margin-top:1rem;
}
.restart-btn:active{transform:scale(.95);opacity:.8;}

.audio-btn{
  margin-top:.5rem;
  padding:6px 14px;
  border:2px solid var(--navy);
  border-radius:999px;
  font-weight:800;
  font-size:.8rem;
  letter-spacing:.05em;
  color:var(--navy);
}
.audio-btn:active{transform:scale(.95);opacity:.85;}

@media (max-width:480px){
  .front-text, .back-text{
    font-size:1.5rem;  /* mobile: readable but not too small */
    line-height:1.3;   /* add a little breathing room on small screens */
  }
  .nav-btn{
    width:40px;        /* slightly smaller on mobile */
    height:40px;
    font-size:1rem;
  }
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-[420px] perspective-1000">
<div id="flashcard" class="relative w-full h-[360px] preserve-3d flip-card-inner cursor-pointer shadow-2xl rounded-3xl">

<!-- FRONT -->
<div class="absolute inset-0 bg-white backface-hidden rounded-3xl flex flex-col justify-between p-5">
  <div class="text-[10px] font-black text-[#8B0000]/50 uppercase tracking-widest text-right">
    Extra Expressions Stage Two
  </div>

  <div class="flex-grow flex items-center justify-center text-center px-2">
    <p id="front-text" class="front-text"></p>
  </div>

  <div class="flex flex-col items-center space-y-2">
    <div class="text-[#8B0000] text-[11px] font-black uppercase tracking-[0.2em]">
      Tap / Click to reveal
    </div>

    <div class="flex items-center space-x-4 bg-white px-3 py-1 rounded-full">
      <button onclick="prevCard(event)" class="nav-btn text-[#002147]">◀</button>
      <span id="counter-display" class="text-[11px] font-black text-[#002147]">1 / 15</span>
      <button onclick="nextCard(event)" class="nav-btn text-[#002147]">▶</button>
    </div>
  </div>
</div>

<!-- BACK -->
<div class="absolute inset-0 bg-white backface-hidden rotate-y-180 rounded-3xl flex flex-col justify-between p-5 border-b-8 border-[#CFC752]">
  <div class="text-[10px] font-bold text-[#8B0000]/40 uppercase tracking-widest text-right">
    Translation
  </div>

  <div class="flex-grow flex flex-col items-center justify-center text-center px-2">
    <p id="back-text" class="back-text"></p>
    <button id="speakBtn" class="audio-btn">🔊 Listen</button>
  </div>

  <div class="flex justify-center pb-2">
    <div id="backBtn" class="text-[11px] font-black uppercase tracking-[0.2em] text-[#8B0000] cursor-pointer">
      Tap / Click to go back
    </div>
  </div>
</div>

</div>
</div>

<!-- RESTART -->
<button id="restartBtn" class="restart-btn">
  &#x21bb; Try again
</button>

<script>
 const library = [
 { front:"All’istante", back:"On the spot", speak:"On the spot" },
 { front:"Bravo!", back:"Good for you!", speak:"Good for you!" },
 { front:"Intendiamoci", back:"Mind you", speak:"Mind you" },
 { front:"Preferisco non pensare", back:"I hate to think", speak:"I hate to think" },
 { front:"Ci farebbe molto piacere!", back:"We would love to!", speak:"We would love to!" },
 { front:"Molto spiritoso!", back:"Very funny!", speak:"Very funny!" },
 { front:"Mi raccomando, chiamami domani", back:"Do call me tomorrow, won’t you?", speak:"Do call me tomorrow, won't you?" },
 { front:"Non potevo mica rifiutare!", back:"I was hardly going to refuse!", speak:"I was hardly going to refuse!" },
 { front:"Essere decisi a fare", back:"Have one’s heart set on doing", speak:"Have one's heart set on doing" },
 { front:"Facilissimo!", back:"Piece of cake!", speak:"Piece of cake!" },
 { front:"Molto probabilmente / Molto probabile che io…", back:"I may well …", speak:"I may well" },
 { front:"Meno male", back:"Just as well", speak:"Just as well" },
 { front:"Sono indeciso", back:"I’m in two minds", speak:"I'm in two minds" },
 { front:"Il punto / discorso è", back:"The thing is …", speak:"The thing is" },
 { front:"Il più delle volte", back:"More often than not", speak:"More often than not" },
 { front:"Mi dispiace dirlo", back:"I’m sad to say", speak:"I'm sad to say" },
 { front:"Salire alle stelle", back:"Go through the roof", speak:"Go through the roof" },
 { front:"Non dire gatto se non l'hai nel sacco", back:"Don't count your chickens before they hatch", speak:"Don't count your chickens before they hatch" },
 { front:"Farsi i fatti propri", back:"Mind one's own business", speak:"Mind one's own business" },
 { front:"Per caso, sai dov'è?", back:"You don't happen to know where it is, do you?", speak:"You don't happen to know where it is, do you?" },
 { front:"Fermo nella mia convinzione", back:"Firm in my belief", speak:"Firm in my belief" },
 { front:"Per quanto mi sforzi", back:"For the life of me", speak:"For the life of me" },
 { front:"Ero convinto", back:"I could have sworn", speak:"I could have sworn" },
 { front:"Per citarne alcuni", back:"To name but a few", speak:"To name but a few" },
 { front:"Per i miei gusti", back:"For my liking", speak:"For my liking" },
 { front:"Ricominciare da zero", back:"Start from scratch", speak:"Start from scratch" },
 { front:"24h su 24h / Giorno e notte", back:"Around the clock", speak:"Around the clock" },
 { front:"Siccome (sono) fortunato…!", back:"Knowing my luck", speak:"Knowing my luck" },
 { front:"Non costa nulla aspettare", back:"There’s no harm waiting", speak:"There's no harm waiting" },
 { front:"Io, per primo", back:"I, for one", speak:"I, for one" },
 { front:"Mettiamoci al lavoro!", back:"Let's get cracking!", speak:"Let's get cracking!" },
 { front:"Punto e basta (rif. noi)", back:"Won’t we", speak:"Won't we" },
 { front:"Col cavolo! / Ma quando mai!", back:"Like hell!", speak:"Like hell!" },
 { front:"Cosa vogliamo fare?", back:"What are we going to do about it?", speak:"What are we going to do about it?" },
 { front:"Non farsi scrupoli", back:"Think nothing of (doing)", speak:"Think nothing of doing" },
 { front:"Potresti per caso tornare domani?", back:"Any chance of coming back tomorrow?", speak:"Any chance of coming back tomorrow?" },
 { front:"Far impazzire", back:"Drive someone mad", speak:"Drive someone mad" },
 { front:"Suonare familiare", back:"Ring a bell", speak:"Ring a bell" },
 { front:"Se posso dirlo / Se posso permettermi", back:"If you don’t mind me saying so", speak:"If you don't mind me saying so" },
 { front:"Cosa ti è preso?", back:"What’s got into you?", speak:"What's got into you?" },
 { front:"La prima volta in assoluto", back:"First ever time", speak:"First ever time" },
 { front:"Ma pensa! / Solo a pensarci!", back:"Just think!", speak:"Just think!" },
 { front:"Magari!", back:"If only!", speak:"If only!" },
 { front:"Significa tutto / Vale un mondo", back:"It means the world", speak:"It means the world" },
 { front:"In reperibilità", back:"On stand-by", speak:"On stand-by" },
 { front:"Nel momento in cui", back:"By the time", speak:"By the time" },
 { front:"Figurati!", back:"No trouble at all!", speak:"No trouble at all!" },
 { front:"Pensa un po’! / Chi l'avrebbe mai detto!", back:"Fancy that!", speak:"Fancy that!" },
 { front:"Zero possibilità / Non c'è santo che tenga", back:"A cat in hell's chance", speak:"A cat in hell's chance" },
 { front:"Con loro stupore", back:"Much to their amazement", speak:"Much to their amazement" },
 { front:"Punto e basta!", back:"That’s that / That was that", speak:"That's that, or, that was that" },
 { front:"Per l’ennesima volta", back:"For the umpteenth time", speak:"For the umpteenth time" },
 { front:"Qualcuno in più, qualcuno in meno", back:"Give or take", speak:"Give or take" },
 { front:"Essere permalosi", back:"Be touchy", speak:"Be touchy" },
 { front:"Non ho la più pallida idea", back:"I haven't got a clue", speak:"I haven't got a clue" },
 { front:"All'istante / Con effetto immediato", back:"Right here and now", speak:"Right here and now" }
];


let currentIndex = 0;
let cards = [];
let recentlyShown = []; // tracks recently shown cards across sessions
const sessionSize = 15;
const recentLimit = Math.floor(library.length / 4);


const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const backBtn   = document.getElementById("backBtn");
const restartBtn= document.getElementById("restartBtn");
const speakBtn  = document.getElementById("speakBtn");

// --- Speech voices setup ---
let voices = [];
let currentSpeakArray = [];
speechSynthesis.onvoiceschanged = () => {
  voices = speechSynthesis.getVoices();
};

// Fisher–Yates shuffle
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// Start a session
function startSession() {
  // Filter out recently shown cards
  const available = library.filter(c => !recentlyShown.includes(c));
  const shuffled = shuffleArray(available.length ? [...available] : [...library]);
  
  cards = shuffled.slice(0, sessionSize);

  // Update recentlyShown to track minimal repetition across sessions
  recentlyShown.push(...cards);
  if (recentlyShown.length > recentLimit) {
    recentlyShown.splice(0, recentlyShown.length - recentLimit);
  }

  currentIndex = 0;
  updateCard();
}

// Update the displayed card
function updateCard() {
  flashcard.classList.remove("flipped");
  setTimeout(() => {
    frontText.innerText = cards[currentIndex].front;
    backText.innerText  = cards[currentIndex].back;
    currentSpeakArray = Array.isArray(cards[currentIndex].speak)
  ? cards[currentIndex].speak
  : [cards[currentIndex].speak];
    counter.innerText   = `${currentIndex+1} / ${cards.length}`;
  }, 150);
}

// Navigation buttons
function nextCard(e){
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % cards.length;
  updateCard();
}

function prevCard(e){
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + cards.length) % cards.length;
  updateCard();
}

/* FLIP */
flashcard.addEventListener("click", ()=> flashcard.classList.toggle("flipped"));
backBtn.addEventListener("click", (e)=>{
  e.stopPropagation();
  flashcard.classList.remove("flipped");
});

/* AUDIO – British male voice with “or” between alternatives */
speakBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if (!currentSpeakArray.length) return;

  speechSynthesis.cancel();

  const ukMale = voices.find(v => v.lang === "en-GB" && /male/i.test(v.name)) || voices.find(v => v.lang === "en-GB");

  let i = 0;

  function speakNext() {
    if (i >= currentSpeakArray.length) return;

    const utter = new SpeechSynthesisUtterance(currentSpeakArray[i]);
    utter.lang = "en-GB";
    if (ukMale) utter.voice = ukMale;

    utter.onend = () => {
      i++;
      if (i < currentSpeakArray.length) {
        const orUtter = new SpeechSynthesisUtterance("or");
        orUtter.lang = "en-GB";
        if (ukMale) orUtter.voice = ukMale;

        orUtter.onend = () => setTimeout(speakNext, 60); // short, natural pause
        speechSynthesis.speak(orUtter);
      }
    };

    speechSynthesis.speak(utter);
  }

  speakNext();
});

// Restart session (Try Again)
restartBtn.addEventListener("click", startSession);

// Start first session on page load
startSession();
</script>
