<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pronouns and Quantifiers – Mobile Flashcards</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --bg-blue:#061247;
  --card-cream:#F7F2E7;
  --it-red:#8C0327;
  --en-blue:#0E065C;
  --border-red:#8C0327;
}

body{
  background:var(--bg-blue);
  font-family:system-ui, Segoe UI, Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:1rem;
}

/* CARD */
.perspective{perspective:1000px;}
.card-inner{
  width:90vw;
  max-width:380px;
  height:55vw;
  max-height:240px;
  position:relative;
  transform-style:preserve-3d;
  transition:.4s;
  cursor:pointer;
}
.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:1rem;
}
.back{transform:rotateY(180deg);}

.corner-hint{
  position:absolute;
  top:.4rem;
  right:.6rem;
  font-size:.6rem;
  font-weight:800;
  color:#8C0327;
}


.it-text{
  color:#4B0082;
  font-weight:800;
  text-transform:uppercase;
  text-align:center;
  font-size:1.1rem;
}

.en-text{
  color:var(--en-blue);
  font-weight:800;
  text-transform:uppercase;
  text-align:center;
  font-size:1.15rem;
  white-space:pre-line;
}

.listen-btn{
  background:none;
  border:none;
  color:var(--en-blue);
  font-weight:700;
  font-size:.9rem;
}

/* NAV */
.nav-btn{
  font-size:1.4rem;
  font-weight:700;
  color:white;
}

/* SET BUTTONS */
.set-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.4rem;
  max-width:380px;
  width:100%;
}

.set-btn{
  padding:.35rem 0;
  font-size:.75rem;
  font-weight:800;
  border-radius:999px;
  background:white;
  color:#0E065C;
}
.set-btn.active{
  background:#8C0327;
  color:white;
}
</style>
</head>

<body>

<h1 class="text-white font-extrabold mb-2">PRONOUNS & QUANTIFIERS (X 35)</h1>

<div class="perspective">
  <div id="flashcard" class="card-inner">

    <!-- FRONT -->
    <div class="face bg-[#F7F2E7] border-4 border-[#8C0327] flex items-center justify-center p-4">
      <div class="corner-hint">TAP TO REVEAL</div>
      <div id="front-text" class="it-text"></div>
    </div>

    <!-- BACK -->
    <div class="face back bg-[#F7F2E7] border-4 border-[#8C0327] flex flex-col items-center justify-center gap-3 p-4">
      <div class="corner-hint">TAP TO RETURN</div>
      <div id="back-text" class="en-text"></div>
      <button id="speakBtn" class="listen-btn">🔊 Listen</button>
    </div>

  </div>
</div>

<div class="flex justify-between items-center w-full max-w-[380px] mt-1">
  <button onclick="prevCard(event)" class="nav-btn">◀</button>
  <span id="counter-display" class="text-white font-bold text-sm">1 / 1</span>
  <button onclick="nextCard(event)" class="nav-btn">▶</button>
</div>

<div class="set-grid mt-2">
  <button class="set-btn" onclick="loadSet(1)">SET 1</button>
  <button class="set-btn" onclick="loadSet(2)">SET 2</button>
  <button class="set-btn" onclick="loadSet(3)">SET 3</button>
</div>

<script>
const sets = {
  // SET 1 – Indefinite Pronouns
1: [
  {it:"QUALCUNO", en:"SOMEONE", speak:["someone"]},
  {it:"CHIUNQUE", en:"ANYONE", speak:["anyone"]},
  {it:"QUALCOSA", en:"SOMETHING", speak:["something"]},
  {it:"NIENTE / NULLA", en:"NOTHING", speak:["nothing"]},
  {it:"NESSUN LUOGO / DA NESSUNA PARTE", en:"NOWHERE", speak:["nowhere"]},
  {it:"UNA VOLTA", en:"ONCE", speak:["once"]},
  {it:"DUE VOLTE", en:"TWICE", speak:["twice"]},
  {it:"QUALSIASI COSA / QUALUNQUE COSA", en:"WHATEVER", speak:["whatever"]},
  {it:"QUALSIASI (TRA PIÙ OPZIONI)", en:"WHICHEVER", speak:["whichever"]},
  {it:"INVECE", en:"INSTEAD", speak:["instead"]},
  {it:"ALTRIMENTI", en:"OTHERWISE", speak:["otherwise"]}
],

// SET 2 – Relative & Demonstrative Pronouns
2: [
  {it:"CHE (PER PERSONE)", en:"WHO", speak:["who"]},
  {it:"(CON) CUI", en:"(WITH) WHOM", speak:["with whom"]},
  {it:"QUALE", en:"WHICH", speak:["which"]},
  {it:"DI CUI", en:"WHOSE", speak:["whose"]},
  {it:"QUESTO", en:"THIS", speak:["this"]},
  {it:"QUESTI", en:"THESE", speak:["these"]},
  {it:"QUELLO", en:"THAT", speak:["that"]},
  {it:"QUELLI", en:"THOSE", speak:["those"]},
  {it:"CHIUNQUE", en:"WHOEVER", speak:["whoever"]},
  {it:"OGNI VOLTA / QUANDO", en:"WHENEVER", speak:["whenever"]},
  {it:"OVUNQUE / DOVUNQUE", en:"WHEREVER", speak:["wherever"]}
],

// SET 3 – Quantifiers & Correlative Pronouns
3: [
  {it:"QUALSIASI COSA", en:"ANYTHING", speak:["anything"]},
  {it:"TUTTI / OGNUNO", en:"EVERYONE", speak:["everyone"]},
  {it:"TUTTO / OGNI COSA", en:"EVERYTHING", speak:["everything"]},
  {it:"O (L'UNO) O (L'ALTRO)", en:"EITHER (ONE) OR (THE OTHER)", speak:["either one","or", "the other"]},
  {it:"NÉ (L’UNO) NÉ (L’ALTRO)", en:"NEITHER (ONE) NOR (THE OTHER)", speak:["neither one","nor", "the other"]},
  {it:"ALTRO", en:"ANOTHER", speak:["another"]},
  {it:"L'UN L'ALTRO", en:"EACH OTHER", speak:["each other"]},
  {it:"MOLTO / TANTO", en:"A LOT", speak:["a lot"]},
  {it:"POCO / UN PO’", en:"A LITTLE", speak:["a little"]},
  {it:"NESSUNO", en:"NO ONE", speak:["no one"]},
  {it:"CIASCUNO / CADAUNO", en:"EACH", speak:["each"]},
  {it:"ENTRAMBI / TUTTI E DUE", en:"BOTH", speak:["both"]},
  {it:"SENZ'ALTRO", en:"DEFINITELY", speak:["definitely"]}
]

};

let currentSet=1, cards=[], index=0;
const flashcard=document.getElementById("flashcard");
const frontText=document.getElementById("front-text");
const backText=document.getElementById("back-text");
const counter=document.getElementById("counter-display");
const speakBtn=document.getElementById("speakBtn");

function loadSet(n){
  currentSet = n;
  cards = [...sets[n]];
  shuffle(cards);
  index = 0;
  updateCard();
  highlightSet(n);
}


function highlightSet(n){
 document.querySelectorAll('.set-btn').forEach((b,i)=>b.classList.toggle('active',i+1===n));
}
function updateCard(){
 flashcard.classList.remove("flipped");
 if(!cards.length){
   frontText.innerText="—";
   backText.innerText="—";
   counter.innerText="0 / 0";
   return;
 }
 setTimeout(()=>{
   frontText.innerText=cards[index].it;
   backText.innerText=cards[index].en;
   counter.innerText=`${index+1} / ${cards.length}`;
 },120);
}
function nextCard(e){e.stopPropagation(); if(!cards.length) return; index=(index+1)%cards.length; updateCard();}
function prevCard(e){e.stopPropagation(); if(!cards.length) return; index=(index-1+cards.length)%cards.length; updateCard();}
flashcard.onclick=()=>flashcard.classList.toggle("flipped");

speakBtn.onclick=e=>{
 e.stopPropagation();
 if(!cards.length) return;
 const t = cards[index].speak.join(", ");
 const u=new SpeechSynthesisUtterance(t);
 u.lang="en-GB";
 speechSynthesis.cancel();
 speechSynthesis.speak(u);
};

function shuffle(array){
  for(let i = array.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}


loadSet(1);
</script>

</body>
</html>
