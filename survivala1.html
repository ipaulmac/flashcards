<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survival Level (A1)</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>

:root{
  --bg-blue:#061247;
  --card-cream:#F7F2E7;
  --it-red:#8C0327;
  --en-blue:#0E065C;
  --border-red:#8C0327;
}

body{
  background:var(--bg-blue);
  font-family:system-ui, Segoe UI, Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:1rem;
}

/* CARD */
.perspective{perspective:1000px;}
.card-inner{
  width:90vw;
  max-width:380px;
  height:55vw;
  max-height:240px;
  position:relative;
  transform-style:preserve-3d;
  transition:.4s;
  cursor:pointer;
}
.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:1rem;
}
.back{transform:rotateY(180deg);}

.corner-hint{
  position:absolute;
  top:.4rem;
  right:.6rem;
  font-size:.6rem;
  font-weight:800;
  color:#8C0327;
}

.it-text{
  color:#4B0082;
  font-weight:800;
  text-transform:uppercase;
  text-align:center;
  font-size:1.1rem;
}
.en-text{
  color:var(--en-blue);
  font-weight:800;
  text-transform:uppercase;
  text-align:center;
  font-size:1.15rem;
  white-space:pre-line;
}

.listen-btn{
  background:none;
  border:none;
  color:#8C0327;
  font-weight:700;
  font-size:.9rem;
}

.clock-svg{
  width:35vw;
  max-width:140px;
  aspect-ratio:1 / 1;
  display:block;
  margin:0 auto;
}

/* NAV */
.nav-btn{
  font-size:1.4rem;
  font-weight:700;
  color:white;
}

/* SET BUTTONS */
.set-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.4rem;
  max-width:380px;
  width:100%;
}

.set-btn{
  padding:.6rem 0;
  font-size:.82rem;
  font-weight:800;
  border-radius:999px;
  background:white;
  color:#0E065C;
  line-height:1.1;
}

.group-btn{
  background:#D8F5D0;
  color:#0E065C;
}


.set-btn.active{
  background:#8C0327;
  color:white;
}

.back-btn{
  background:cyan;
  color:#0E065C;
}

.count{
  color:darkred;
}

.top-bar{
  width:100%;
  max-width:380px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:.5rem;
}

.top-title{
  color:white;
  font-weight:800;
  font-size:1.2rem;
  margin:0;
}


.readme-btn{
  background:none;
  border:none;
  color:gold;
  font-weight:800;
  cursor:pointer;
}

.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(6,18,71,.88);
  display:none;
  justify-content:center;
  align-items:flex-start;
  padding-top:90px;
  z-index:99999;
  padding-left:12px;
  padding-right:12px;
  box-sizing:border-box;
}

.popup{
  width:80vw;
  max-width:360px;
  max-height:80vh;
  overflow-y:auto;
  background:#fff;
  border:4px solid darkred;
  border-radius:16px;
  padding:18px;
  box-sizing:border-box;
}

.popup-text{
  font-size:.82rem;
  font-weight:900;
  line-height:1.45;
  color:#0E065C;
  text-align:left;
}

.popup-close-text{
  margin-top:18px;
  display:flex;
  justify-content:flex-end;
  font-size:.9rem;
  font-weight:900;
  color:darkred;
  cursor:pointer;
  user-select:none;
}

.popup-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:16px;
}

.popup-footer .popup-close-text{
  margin:0;
}



.vertical-buttons{
  display:flex;
  flex-direction:column;
  gap:.4rem;
  width:100%;
  max-width:380px;
}

.library-back-btn{
  width:100%;
  margin:0 auto;
  padding:.35rem 0;
  border:2px solid white;
  border-radius:999px;
  background:#1A4378;
  color:white;
  font-size:.75rem;
  font-weight:800;
  text-transform:uppercase;
  cursor:pointer;
  transition:.2s;
  display:block;
}

.library-back-btn:hover{
  background:#FCE7F3;
  color:#1A4378;
  border-color:#1A4378;
}


</style>
</head>

<body>

<div id="top-bar" class="top-bar">

 
  <h1 class="top-title">SURVIVAL LEVEL <span style="color:#FFF3A3;">(A1+)</span></h1>

  <button id="readme-btn" class="readme-btn">
    READ ME
  </button>

</div>

<div class="perspective">
  <div id="flashcard" class="card-inner">

    <!-- FRONT -->
    <div class="face bg-[#F7F2E7] border-4 border-[#8C0327] flex items-center justify-center p-4">
      <div id="front-hint" class="corner-hint">TAP TO REVEAL</div>
      <div id="front-text" class="it-text"></div>
    </div>

    <!-- BACK -->
    <div class="face back bg-[#F7F2E7] border-4 border-[#8C0327] flex flex-col items-center justify-center gap-3 p-4">
      <div class="corner-hint">TAP TO RETURN</div>
      <div id="back-text" class="en-text"></div>
      <button id="speakBtn" class="listen-btn">🔊 Listen</button>
    </div>

  </div>
</div>

<div class="flex justify-between items-center w-full max-w-[380px] mt-1">
 <button id="prevBtn" class="nav-btn" onclick="prevCard(event)">◀</button>
<span id="counter-display" class="text-white font-bold text-sm">1 / 1</span>
<button id="nextBtn" class="nav-btn" onclick="nextCard(event)">▶</button>
</div>

<div id="button-container" class="set-grid mt-2"></div>

let index = 0;

const flashcard=document.getElementById("flashcard");
const frontText=document.getElementById("front-text");
const backText=document.getElementById("back-text");
const counter=document.getElementById("counter-display");
const speakBtn=document.getElementById("speakBtn");
const buttonContainer=document.getElementById("button-container");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");

function updateCard(){

  document.getElementById("front-hint").style.visibility = "visible";

  flashcard.classList.remove("flipped");

  const card = cards[index];

  renderFront(card);
  renderBack(card);

  counter.innerText = `${index + 1} / ${cards.length}`;

}

function renderFront(card){

  if(card.renderer){

    switch(card.renderer){

      case "clock":
        renderClockFront(card);
        return;

    }

  }

  frontText.innerText = card.it;

}

function renderClockFront(card){

  const hourAngle = (card.h % 12) * 30 + card.m * 0.5;
  const minuteAngle = card.m * 6;

  const numbers = [...Array(12)].map((_, i) => {

    const n = i + 1;
    const angle = (n - 3) * 30 * Math.PI / 180;

    return `
      <text
        x="${100 + Math.cos(angle) * 70}"
        y="${100 + Math.sin(angle) * 70}"
        text-anchor="middle"
        dominant-baseline="middle"
        font-size="16"
        font-weight="800"
        fill="#0E065C">${n}</text>
    `;

  }).join("");

  frontText.innerHTML = `
    <svg viewBox="0 0 200 200" class="clock-svg">

      <circle
        cx="100"
        cy="100"
        r="90"
        fill="#F7F2E7"
        stroke="#8C0327"
        stroke-width="6"/>

      ${numbers}

      <line
        x1="100"
        y1="100"
        x2="100"
        y2="55"
        stroke="#0E065C"
        stroke-width="6"
        transform="rotate(${hourAngle} 100 100)"/>

      <line
        x1="100"
        y1="100"
        x2="100"
        y2="40"
        stroke="#0E065C"
        stroke-width="4"

    return;

  index = (index - 1 + cards.length) % cards.length;
  updateCard();
}

function shuffle(array){
  for(let i = array.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}
