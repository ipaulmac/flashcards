<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALS - Lessons 1 & 2 Compact</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root {
    --brand-navy:#002147;
    --brand-gold:#CFC752;
    --custom-purple:#561386;
}

body{
    background:var(--custom-purple);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    overflow:hidden;
}

.perspective-1000{perspective:1000px;}
.preserve-3d{transform-style:preserve-3d;}
.backface-hidden{backface-visibility:hidden;}
.rotate-y-180{transform:rotateY(180deg);}
.flip-card-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);}
.flipped{transform:rotateY(180deg);}

.phrase-front{font-size:2.4rem;line-height:1.1;font-weight:700;color:var(--brand-navy);}
.phrase-back{font-size:2.75rem;line-height:1.05;font-weight:800;}

.nav-btn{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
}
.nav-btn:active{transform:scale(.9);}

.ui-accent-bg{background:var(--brand-gold);}
.navy-text{color:var(--brand-navy);}

/* BACK button */
.back-btn{
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:.9rem;
}
.back-btn:active{transform:scale(.95);opacity:.8;}

/* Try again / refresh button */
.restart-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:2px solid #fff;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:.85rem;
    margin-top:1rem;
}
.restart-btn:active{transform:scale(.95);opacity:.8;}

@media (max-width:480px){
    .phrase-front{font-size:1.4rem;}
    .phrase-back{font-size:1.7rem;}
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-[420px] perspective-1000">
<div id="flashcard" class="relative w-full h-[360px] preserve-3d flip-card-inner cursor-pointer shadow-2xl rounded-3xl">

<!-- FRONT -->
<div class="absolute inset-0 bg-white backface-hidden rounded-3xl flex flex-col justify-between p-5 border">
    <div class="text-[10px] font-black text-[#561386]/50 uppercase tracking-widest text-right">Lessons 1 & 2</div>
    <div class="flex-grow flex items-center justify-center text-center px-2">
        <p id="front-text" class="phrase-front"></p>
    </div>

    <div class="flex flex-col items-center space-y-2">
        <div class="text-[#800000] text-[11px] font-black uppercase tracking-[0.2em]">
            Tap / Click to reveal
        </div>

        <div class="flex items-center space-x-4 ui-accent-bg px-3 py-1 rounded-full">
            <button onclick="prevCard(event)" class="nav-btn navy-text">◀</button>
            <span id="counter-display" class="text-[11px] font-black navy-text">1 / 15</span>
            <button onclick="nextCard(event)" class="nav-btn navy-text">▶</button>
        </div>
    </div>
</div>

<!-- BACK -->
<div class="absolute inset-0 bg-[#002147] text-white backface-hidden rotate-y-180 rounded-3xl flex flex-col justify-between p-5 border-b-8 border-[#CFC752]">
    <div class="text-[10px] font-bold text-white/30 uppercase tracking-widest text-right">Translation</div>

    <div class="flex-grow flex items-center justify-center text-center px-2">
        <p id="back-text" class="phrase-back italic"></p>
    </div>

    <!-- BACK BUTTON -->
    <div class="flex justify-center pb-2">
        <button id="backBtn" class="back-btn">Tap / Click to go back</button>
    </div>
</div>

</div>
</div>

<!-- RESTART -->
<button id="restartBtn" class="restart-btn">
    &#x21bb; Try again
</button>

<script>
const library = [
  {front:"All’inizio", back:"At first"},
  {front:"Subito", back:"At once"},
  {front:"Richiamare", back:"To call back"},
  {front:"Telefonare / Fare uno squillo", back:"To call up"},
  {front:"Entrare / Salire (in auto)", back:"To get in"},
  {front:"Scendere (dal treno)", back:"To get off"},
  {front:"Salire (mezzi pubblici)", back:"To get on"},
  {front:"Uscire / Scendere dalla macchina", back:"To get out"},
  {front:"Alzarsi", back:"To get up"},
  {front:"Fare uno squillo a qualcuno", back:"To give someone a call / To call up"},
  {front:"Raccogliere / Passare a prendere / Ritirare", back:"To pick up"},
  {front:"Indossare / Mettersi", back:"To put on"},
  {front:"Subito", back:"Straight away / Right away / At once"},
  {front:"Spegnere", back:"To switch off / To turn off / To shut off"},
  {front:"Accendere", back:"To switch on / To turn on"},
  {front:"Togliersi", back:"To take off"},
  {front:"Dall’inizio", back:"All along"},
  {front:"Dappertutto", back:"All over"},
  {front:"Va bene", back:"All right"},
  {front:"Come al solito", back:"As usual"},
  {front:"Finalmente", back:"At last"},
  {front:"Vestirsi elegante", back:"To dress up"},
  {front:"Scoprire / Informarsi", back:"To find out"},
  {front:"Poco a poco", back:"Little by little"},
  {front:"Guardare", back:"To look at"},
  {front:"Cercare", back:"To look for"},
  {front:"Non importa / Lascia perdere", back:"Never mind"},
  {front:"Cercare", back:"To search for"},
  {front:"Passo dopo passo", back:"Step by step"},
  {front:"Stancare troppo / Sfinire", back:"To tire out / To wear out"},
  {front:"Compagno di classe", back:"Classmate"},
  {front:"Nel giro di", back:"In the space of"},
  {front:"Versare", back:"To pour"},
  {front:"Saltare", back:"To skip"},
  {front:"Fornire", back:"To supply"},
  {front:"Mi raccomando", back:"Whatever you do"},
  {front:"Sgranchirsi le gambe", back:"To stretch one’s legs"},
  {front:"Per l’amor del cielo! / Mamma mia!", back:"For heaven’s sake!"},
  {front:"Un cavolo / Proprio niente", back:"A damned thing"},
  {front:"Identificare", back:"To put one’s finger on something"},
  {front:"Volevo solo dire", back:"I just wanted to mention"},
  {front:"Lascia stare / Non ti preoccupare", back:"Don’t bother / Never mind"},
  {front:"Qual è il suo problema?!", back:"What’s wrong with him?!"}, 
  {front:"Di fila / Consecutivamente", back:"In a row"},
  {front:"Non posso non essere d’accordo con te", back:"I would have to agree with you"}
];

let cards=[], pool=[], currentIndex=0;

const flashcard = document.getElementById("flashcard");
const frontText = document.getElementById("front-text");
const backText  = document.getElementById("back-text");
const counter   = document.getElementById("counter-display");
const backBtn   = document.getElementById("backBtn");
const restartBtn= document.getElementById("restartBtn");

function startSession(){
    if(pool.length < 15) pool=[...library].sort(()=>0.5-Math.random());
    cards = pool.splice(0,15);
    currentIndex=0;
    updateCard();
}

function updateCard(){
    flashcard.classList.remove("flipped");
    setTimeout(()=>{
        frontText.innerText = cards[currentIndex].front;
        backText.innerText  = cards[currentIndex].back;
        counter.innerText  = `${currentIndex+1} / ${cards.length}`;
    },150);
}

function nextCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex+1)%cards.length;
    updateCard();
}
function prevCard(e){
    e.stopPropagation();
    currentIndex=(currentIndex-1+cards.length)%cards.length;
    updateCard();
}

flashcard.addEventListener("click",()=>flashcard.classList.toggle("flipped"));
backBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    flashcard.classList.remove("flipped");
});
restartBtn.addEventListener("click",startSession);

startSession();
</script>

</body>
</html>
