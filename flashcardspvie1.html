  selectedFolder = folder;

    totalCards = sets[folder].length;

  }else if(mode === "global1to6"){

    ["pvie1.1","pvie1.2","pvie1.3","pvie1.4","pvie1.5","pvie1.6"].forEach(key=>{
      totalCards += sets[key].length;
    });

  }else if(mode === "global7to12"){

    ["pvie1.7","pvie1.8","pvie1.9","pvie1.10","pvie1.11","pvie1.12"].forEach(key=>{

    });

    selectedCards = 20;

    Object.values(sets).forEach(set=>{

    });

  if(mode === "single"){

window.startSelectedSet = function(){

  closeStartPopup();

  if(selectedMode === "single"){

      loadSet(selectedFolder);

  }else if(selectedMode === "global1to6"){

      loadGlobal1to6();

  }else if(selectedMode === "global7to12"){

      loadGlobal7to12();

  }else if(selectedMode === "global1to12"){

      loadGlobal1to12();

  }

}


function shuffle(arr){
  const a=[...arr];

  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

function prepareSet(folder){
  return sets[folder].map((card,i)=>({
    ...card,
    folder,
    id:`PVIE1-${String(i+1).padStart(3,"0")}`
  }));
}

window.loadSet = function(folder){
  activeMode="single";
  activeFolder=folder;
  index=0;

  const fullPool=prepareSet(folder);
  cards=shuffle(fullPool).slice(0,12);

  updateCard();
  activateButton(folder);
}

window.loadGlobal1to6 = function(){

  activeMode="global1to6";
  activeFolder=null;
  index=0;

  let combined=[];

  ["pvie1.1","pvie1.2","pvie1.3","pvie1.4","pvie1.5","pvie1.6"].forEach(folder=>{
    if(sets[folder]){
      combined.push(...prepareSet(folder));
    }
  });

  cards=shuffle(combined).slice(0,20);

  updateCard();
  activateButton("GLOBAL1TO6");

}

window.loadGlobal7to12 = function(){

  activeMode="global7to12";
  activeFolder=null;
  index=0;

  let combined=[];

  ["pvie1.7","pvie1.8","pvie1.9","pvie1.10","pvie1.11","pvie1.12"].forEach(folder=>{
    if(sets[folder]){
      combined.push(...prepareSet(folder));
    }
  });

  cards=shuffle(combined).slice(0,20);

  updateCard();
  activateButton("GLOBAL7TO12");

}

window.loadGlobal1to12 = function(){

  activeMode="global1to12";
  activeFolder=null;
  index=0;

  let combined=[];

  Object.keys(sets).forEach(folder=>{
    combined.push(...prepareSet(folder));
  });

  cards=shuffle(combined).slice(0,20);

  updateCard();
  activateButton("GLOBAL1TO12");

}


window.refreshCurrentSet = function(){

  if(activeMode==="single"){

    loadSet(activeFolder);

  }else if(activeMode==="global1to6"){

    loadGlobal1to6();

  }else if(activeMode==="global7to12"){

    loadGlobal7to12();

  }else if(activeMode==="global1to12"){

    loadGlobal1to12();

  }

}
function updateCard(){
  flashcard.classList.remove("flipped");

  const c=cards[index];

  frontText.innerText=c.front.toUpperCase();
backText.innerText=c.back.toUpperCase();

const lessonNumber = Number(c.folder.split(".")[1]);
lessonLabel.innerText = `LESSON ${lessonNumber}`;

counter.innerText=`${index+1} / ${cards.length}`;
}

window.nextCard=function(e){

  if(e) e.stopPropagation();

  if(cards.length===0) return;

  index=(index+1)%cards.length;

  updateCard();

};

window.prevCard=function(e){

  if(e) e.stopPropagation();

  if(cards.length===0) return;

  index=(index-1+cards.length)%cards.length;

  updateCard();

};

flashcard.addEventListener("click",()=>{

  if(cards.length===0) return;

  flashcard.classList.toggle("flipped");

});


speakBtn.addEventListener("click",(e)=>{
