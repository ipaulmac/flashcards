<style>

  height:55vw;

.face{position:absolute; inset:0; backface-visibility:hidden; border-radius:1rem;}

.it-text{ color:var(--front-purple); }
.en-text{ color:var(--en-blue); }
.listen-btn{
  background:none;
  border:none;
  color:var(--it-red);

  font-size:.9rem;
}
.nav-btn{
  font-size:1.4rem;
  font-weight:700;
  color:white;
}

.set-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.45rem;
  max-width:380px;
  width:100%;
}

.set-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:7px 0;
  font-size:.75rem;
  font-weight:800;
  border-radius:999px;
  background:white;
  color:#0E065C;
  line-height:1.3;
  text-align:center;
}

.global-btn{
  background:#00cfd5;
  color:#061247;
}

.global-green{
  background:#1E8E3E;
  color:white;
}

.global-yellow{
  background:#FFD700;
  color:#061247;
}


.back-btn{
  background:#C46A1A;
  color:white;
  border:none;
  cursor:pointer;
  transition:.2s;

  border-radius:10px;
  padding:6px 14px;
  min-width:82px;
  font-size:.80rem;
  font-weight:800;
}

.back-btn:hover{
  background:#FFF3A3;
  color:darkred;
}

.extras-btn{
  background:#0FF268;
  color:#061247;
}

.inactive-btn{
  background:#A8E6A3;
  color:#061247;
}

.lesson-label{

  font-weight:900;

  width:90%;

  background:#EEF6FF;

  border-radius:18px;
  padding:22px;
  text-align:center;

#popupText{

.popup-buttons{

.popup-close,

window.startSelectedSet = function(){

  closeStartPopup();

      loadSet(selectedFolder);

      loadGlobal1to6();

  }else if(selectedMode === "global7to12"){

      loadGlobal7to12();

  }else if(selectedMode === "global1to12"){

      loadGlobal1to12();

  }

}


function shuffle(arr){
  const a=[...arr];

  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

function prepareSet(folder){
  return sets[folder].map((card,i)=>({
    ...card,
    folder,
    id:`PVIE1-${String(i+1).padStart(3,"0")}`
  }));
}

window.loadSet = function(folder){
  activeMode="single";
  activeFolder=folder;
  index=0;

  const fullPool=prepareSet(folder);
  cards=shuffle(fullPool).slice(0,12);

  updateCard();
  activateButton(folder);
}

window.loadGlobal1to6 = function(){

  activeMode="global1to6";
  activeFolder=null;
  index=0;

  let combined=[];

  ["pvie1.1","pvie1.2","pvie1.3","pvie1.4","pvie1.5","pvie1.6"].forEach(folder=>{
    if(sets[folder]){
      combined.push(...prepareSet(folder));
    }
  });

  cards=shuffle(combined).slice(0,20);

  updateCard();
  activateButton("GLOBAL1TO6");

}

window.loadGlobal7to12 = function(){

  activeMode="global7to12";
  activeFolder=null;
  index=0;

  activeMode="global1to12";
  activeFolder=null;
  index=0;

  let combined=[];

  Object.keys(sets).forEach(folder=>{
    combined.push(...prepareSet(folder));
  });

  cards=shuffle(combined).slice(0,20);

  updateCard();
  activateButton("GLOBAL1TO12");

}


window.refreshCurrentSet = function(){

  if(activeMode==="single"){

    loadSet(activeFolder);

  }else if(activeMode==="global1to6"){

    loadGlobal1to6();

  }else if(activeMode==="global7to12"){

    loadGlobal7to12();

  }else if(activeMode==="global1to12"){

    loadGlobal1to12();

  }

}
function updateCard(){
  flashcard.classList.remove("flipped");

  const c=cards[index];

frontText.innerHTML=c.front.toUpperCase();
backText.innerHTML=c.back.toUpperCase();

const lessonNumber = Number(c.folder.split(".")[1]);
lessonLabel.innerText = `LESSON ${lessonNumber}`;

counter.innerText=`${index+1} / ${cards.length}`;

}

window.nextCard=function(e){

  if(e) e.stopPropagation();

  if(cards.length===0) return;

  index=(index+1)%cards.length;

  updateCard();

};

window.prevCard=function(e){

  if(e) e.stopPropagation();

  if(cards.length===0) return;

  index=(index-1+cards.length)%cards.length;

  updateCard();

};

flashcard.addEventListener("click",()=>{

  if(cards.length===0) return;

  flashcard.classList.toggle("flipped");

});


speakBtn.addEventListener("click",(e)=>{
  e.stopPropagation();

  const c=cards[index];

  audio.play();
});
