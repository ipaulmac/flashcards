<style>
:root{

}
body{
  background:var(--bg-blue);
  font-family:system-ui, Segoe UI, Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:1rem;
  gap:.3rem;
}
.perspective{perspective:1000px;}
.card-inner{
  width:90vw;
  max-width:380px;
  height:55vw;
  max-height:240px;
  position:relative;
  transform-style:preserve-3d;
  transition:.4s;
  cursor:pointer;
}
.flipped{transform:rotateY(180deg);}
.face{position:absolute; inset:0; backface-visibility:hidden; border-radius:1rem;}
.back{transform:rotateY(180deg);}
.it-text,.en-text{
  font-weight:800;
  text-transform:uppercase;
  text-align:center;
  font-size:1.25rem;
}
.it-text{ color:var(--front-purple); }
.en-text{ color:var(--en-blue); }
.listen-btn{
  background:none;
  border:none;
  color:var(--it-red);
  font-weight:700;
  font-size:.9rem;
}
.nav-btn{
  font-size:1.4rem;
  font-weight:700;
  color:white;
}
.set-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.4rem;
  max-width:380px;
  width:100%;
}

.set-btn{
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.75rem;
  font-weight:800;
  border-radius:999px;
  background:white;
  color:#0E065C;
}

.global-btn{
  background:#00cfd5;
  color:#061247;
}

.extras-btn{
  background:#0FF268;
  color:#061247;
}

@media (max-width: 480px) {
  .set-btn{
    font-size:.65rem;
  }
}

.set-btn.active{
  background:#8C0327;
  color:white;
}

</style>

/* ================= CORE ENGINE ================= */

let cards=[];
let index=0;
let activeMode=null;
let activeFolder=null;

const flashcard=document.getElementById("flashcard");
const frontText=document.getElementById("front-text");
const backText=document.getElementById("back-text");
const counter=document.getElementById("counter-display");
const speakBtn=document.getElementById("speakBtn");

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function prepareSet(folder){
  return sets[folder].map((card,i)=>({
    ...card,
    folder,
    id:`PVIE1-${String(i+1).padStart(3,"0")}`
  }));
}

function loadSet(folder){
  activeMode="single";
  activeFolder=folder;
  index=0;
  const fullPool=prepareSet(folder);
  cards=shuffle(fullPool).slice(0,15);
  updateCard();
  activateButton(folder);
}

function loadGlobal(){
  activeMode="global";
  index=0;
  let combined=[];
  Object.keys(sets).forEach(folder=>{
    combined.push(...prepareSet(folder));
  });
  cards=shuffle(combined).slice(0,30);
  updateCard();
  activateButton("GLOBAL");
}

function refreshCurrentSet(){
  if(activeMode==="single"){
    loadSet(activeFolder);
  }else if(activeMode==="global"){
    loadGlobal();
  }
}

function updateCard(){
  flashcard.classList.remove("flipped");
  const c=cards[index];
  frontText.innerText=c.front.toUpperCase();
  backText.innerText=c.back.toUpperCase();
  counter.innerText=`${index+1} / ${cards.length}`;
}

function nextCard(e){
  if(e) e.stopPropagation();
  index=(index+1)%cards.length;
  updateCard();
}

function prevCard(e){
  if(e) e.stopPropagation();
  index=(index-1+cards.length)%cards.length;
  updateCard();
}

flashcard.addEventListener("click",()=>{
  flashcard.classList.toggle("flipped");
});

speakBtn.addEventListener("click",(e)=>{
  e.stopPropagation();
  const c=cards[index];
  const audio=new Audio(`audio/${c.folder}/${c.id}.mp3`);
  audio.play();
});

function activateButton(folder){
  document.querySelectorAll(".set-btn").forEach(btn=>btn.classList.remove("active"));
  const buttons=document.querySelectorAll(".set-btn");
  const map={
  "pvie1.1":0,
  "pvie1.2":1,
  "pvie1.3":2,
  "pvie1.4":3,
  "pvie1.5":4,
  "pvie1.6":5,
  "pvie1.7":6,
  "GLOBAL":7
};

  buttons[map[folder]].classList.add("active");
}

/* INITIAL LOAD */
loadSet("pvie1.1");
